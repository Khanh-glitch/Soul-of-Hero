<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SOH × PixelFX — FX Foundry Browser</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>SOH × PixelFX <span>FX Foundry Browser</span></h1>
  <div id="status-line">loading registry…</div>
</header>
<div id="layout">
  <aside id="sidebar">
    <input id="search" type="search" placeholder="search 244 effects… (name, id, tag)">
    <nav id="categories"></nav>
  </aside>
  <main id="stage-wrap">
    <div id="stage-bar">
      <strong id="fx-title">—</strong>
      <div class="transport">
        <button id="btn-play" title="play/pause">⏸</button>
        <button id="btn-restart" title="restart">⏮</button>
        <input id="scrub" type="range" min="0" max="0" value="0" step="1">
        <span id="frame-label">0/0</span>
      </div>
      <div class="modes">
        <label><input type="checkbox" id="mode-daynight" checked> day/night</label>
        <button id="btn-night" class="on">☀ day</button>
        <label>anchor
          <select id="sel-anchor">
            <option value="source">source pivot</option>
            <option value="ground">ground</option>
            <option value="air">float</option>
            <option value="screen">screen fit</option>
          </select>
        </label>
        <label>scale <input id="rng-scale" type="range" min="0.25" max="4" step="0.05" value="1"> <span id="scale-val">1.00×</span></label>
        <label><input type="checkbox" id="mode-scene" checked> SOH scene</label>
        <label><input type="checkbox" id="mode-light"> emission map</label>
        <label><input type="checkbox" id="mode-act"> act preview</label>
        <label><input type="checkbox" id="mode-demo"> combat demo (3 FX)</label>
      </div>
    </div>
    <div id="stage"><canvas id="view"></canvas><div id="stage-hint">select an effect</div></div>
    <div id="thumbs"></div>
  </main>
  <aside id="meta">
    <h2>Metadata</h2>
    <div id="meta-body">—</div>
  </aside>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
