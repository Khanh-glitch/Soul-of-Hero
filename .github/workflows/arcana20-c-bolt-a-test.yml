name: ARCANA20 C bolt raster on A source field
on:
  workflow_dispatch:
  push:
    branches: [arena/c7b0c4e8-soul-of-hero]
    paths:
      - '.github/workflows/arcana20-c-bolt-a-test.yml'
      - 'prototypes/arcana_fusion20/renderer/c_bolt_a_raster_test.gd'
      - 'prototypes/arcana_fusion20/renderer/source_c/c_bolt_a_raster.gd'
      - 'prototypes/arcana_fusion20/renderer/source_a/a_chain_verdict_graph.gd'
      - 'prototypes/arcana_fusion20/renderer/source_a/a_volt_carousel_fusion.gd'
permissions:
  contents: read
jobs:
  source-raster:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.0
          use-dotnet: false
          include-templates: false
      - name: Import and compare
        run: |
          set -o pipefail
          godot --headless --path . --import > import.log 2>&1
          ! grep -Eq 'SCRIPT ERROR:|Parse Error:' import.log
          set +e
          timeout 240s godot --headless --path . --script res://prototypes/arcana_fusion20/renderer/c_bolt_a_raster_test.gd > result.log 2>&1
          status=$?
          set -e
          grep -E 'C_BOLT_A_|SCRIPT ERROR:|Parse Error:' result.log | head -10 | while IFS= read -r line; do echo "::notice title=C_BOLT_A::$line"; done || true
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          grep -Fq C_BOLT_A_PASS result.log
          ! grep -Eq 'C_BOLT_A_FAIL|SCRIPT ERROR:|Parse Error:' result.log
