name: ARCANA19 isolated sprite primitive comparison
on:
  workflow_dispatch:
  push:
    branches: [arena/c7b0c4e8-soul-of-hero]
    paths: ['tools/arcana19_sprite_compare/**', 'prototypes/arcana_fusion20/renderer/d19_sprite_compare.gd', 'prototypes/arcana_fusion20/renderer/source_d/d_fx.gd', '.github/workflows/arcana19-sprite-compare.yml']
permissions:
  contents: read
jobs:
  primitive:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.0
          use-dotnet: false
          include-templates: false
      - name: Install comparison tools
        run: |
          npm install --prefix "$RUNNER_TEMP/d19-ribbon" playwright@1.57.0
          "$RUNNER_TEMP/d19-ribbon/node_modules/.bin/playwright" install --with-deps chromium
          python3 -m pip install --quiet numpy pillow
          ln -s "$RUNNER_TEMP/d19-ribbon/node_modules" tools/arcana19_sprite_compare/node_modules
      - name: Capture original isolated WebGL sprite cases
        run: |
          set -o pipefail
          mkdir -p artifacts/arcana19-sprite
          node tools/arcana19_sprite_compare/capture.mjs artifacts/arcana19-sprite | tee original.log
          test "$(grep -c D19_SPRITE_ORIGINAL_CAPTURE original.log)" -eq 10
      - name: Audit source shader hash precision at sprite centers
        run: |
          SPRITE_HASH_AUDIT=1 node tools/arcana19_sprite_compare/capture.mjs artifacts/arcana19-sprite > hash-capture.log
          python3 tools/arcana19_sprite_compare/hash_audit.py artifacts/arcana19-sprite | tee hash.log
          sed 's/^/::notice title=D19_SPRITE_HASH::/' hash.log
      - name: Capture native sprite cases
        run: |
          set -o pipefail
          godot --headless --path . --import > import.log 2>&1
          ! grep -Eq 'SCRIPT ERROR:|Parse Error:' import.log
          timeout 300s godot --headless --path . --script res://prototypes/arcana_fusion20/renderer/d19_sprite_compare.gd 2>&1 | tee native.log
          grep -Fq 'D19_SPRITE_CAPTURE_COMPLETE' native.log
          ! grep -Eq 'SCRIPT ERROR:|Parse Error:' native.log
      - name: Compare spatial metrics without tolerance gates
        run: |
          set -o pipefail
          python3 tools/arcana19_sprite_compare/compare.py artifacts/arcana19-sprite | tee compare.log
          sed 's/^/::notice::/' compare.log
      - name: Surface all sprite transfer candidates
        if: always()
        run: |
          if test -f compare.log; then grep 'native_ldr8' compare.log | sed 's/^/::notice title=D19_SPRITE_LDR8::/' || true; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d19-sprite-source-primitive-diagnostic
          path: |
            artifacts/arcana19-sprite/
            original.log
            native.log
            import.log
            compare.log
            hash.log
            hash-capture.log
