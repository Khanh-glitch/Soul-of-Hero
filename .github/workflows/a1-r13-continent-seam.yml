name: A1 R13 Production-Consumable Continent Seam

# One focused integration-capability gate, not another Round 12 oracle-count
# round. It composes exact A0/A6/A8 owners, executes the public A1 consumer
# sample, drives real controller/A8 bodies and independently checks native PNGs.
# It never boots or certifies the A0 production GameRoot.

on:
  push:
    branches: [arena/e385312a-soul-of-hero]
    paths:
      - '.github/workflows/a1-r13-continent-seam.yml'
      - 'data/survival/world/**'
      - 'game/survival/world/**'
      - 'tests/survival/world/r13_continent_seam_native_test.gd'
      - 'tests/survival/world/test_r13_continent_interface.py'
      - 'tools/survival/worldgen/compile_r13_continent_interface.py'
      - 'tools/survival/worldgen/validate_r13_continent_seam.py'
      - 'docs/survival/world/R13_A1_CONTINENT_INTERFACE.md'
  pull_request:
    branches: [main, feature/survival-rpg-foundation-20261029]
    paths:
      - '.github/workflows/a1-r13-continent-seam.yml'
      - 'data/survival/world/**'
      - 'game/survival/world/**'
      - 'tests/survival/world/r13_continent_seam_native_test.gd'
      - 'tests/survival/world/test_r13_continent_interface.py'
      - 'tools/survival/worldgen/compile_r13_continent_interface.py'
      - 'tools/survival/worldgen/validate_r13_continent_seam.py'
      - 'docs/survival/world/R13_A1_CONTINENT_INTERFACE.md'
  workflow_dispatch:

permissions:
  contents: write

env:
  A1_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  A0_SHA: ee5f9f5160c8e4385f35a63b355ddda957f93d10
  A6_SHA: 6d1e8bcee0bbb09be0ff04f14de1f7e59f06cfb8
  A8_SHA: 0f885df862d7d34f18ca456e80b1aaac05b23de0

jobs:
  exact-owner-native-seam:
    name: EXACT A0+A1+A6+A8 / REAL D051 BODY + A8 SHELLS / NATIVE 1X
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install source-test dependencies
        run: python -m pip install -r tools/survival/worldgen/requirements.txt
      - name: Verify deterministic production-consumable manifest and source contract
        run: |
          set -euo pipefail
          mkdir -p artifacts/a1-r13-continent-seam
          python tools/survival/worldgen/compile_r13_continent_interface.py --check \
            | tee artifacts/a1-r13-continent-seam/source-compile.log
          python -m pytest tests/survival/world/test_r13_continent_interface.py -q \
            | tee artifacts/a1-r13-continent-seam/source-pytest.log
      - name: Compose and verify exact owner sources through A0 fences
        run: |
          set -euo pipefail
          printf '%s\n' "$A1_SHA" "$A0_SHA" "$A6_SHA" "$A8_SHA" \
            | tee artifacts/a1-r13-continent-seam/exact-owner-shas.txt
          git fetch --no-tags origin "$A1_SHA" "$A0_SHA" "$A6_SHA" "$A8_SHA"
          git worktree add --detach "$RUNNER_TEMP/a0-r13" "$A0_SHA"
          python3 "$RUNNER_TEMP/a0-r13/tools/a0/compose_owners.py" \
            --repo "$RUNNER_TEMP/a0-r13" --out "$GITHUB_WORKSPACE/.composition" --copy-base \
            --base-ref "$A0_SHA" --owner a1="$A1_SHA" --owner a6="$A6_SHA" --owner a8="$A8_SHA"
          python3 "$RUNNER_TEMP/a0-r13/tools/a0/check_composition.py" .composition \
            | tee artifacts/a1-r13-continent-seam/composition-check.log
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          root = pathlib.Path('.composition')
          report = json.loads((root / 'composition.json').read_text())
          assert report['base']['sha'] == os.environ['A0_SHA']
          assert report['owners']['a1']['sha'] == os.environ['A1_SHA']
          assert report['owners']['a6']['sha'] == os.environ['A6_SHA']
          assert report['owners']['a8']['sha'] == os.environ['A8_SHA']
          assert not [row for row in report['conflicts'] if not row.get('resolved')], report['conflicts']
          def git_bytes(sha, path):
              return subprocess.check_output(['git', 'show', f'{sha}:{path}'])
          required = {
              'a1': [
                  'data/survival/world/a1_continent_interface.v1.json',
                  'game/survival/world/a1_continent_interface.gd',
                  'game/survival/world/a1_continent_consumer_sample.gd',
                  'tests/survival/world/r13_continent_seam_native_test.gd',
              ],
              'a6': [
                  'game/characters/knight/knight.tscn',
                  'game/survival/player/player_avatar_presenter.gd',
                  'tools/fetch_a6_avatar_sources.sh',
                  'tools/stage_a6_avatar_art.py',
              ],
              'a8': [
                  'data/survival/world_content/sites/south_quarry.json',
                  'data/survival/world_content/sites/south_orchard_ruin.json',
                  'data/survival/world_content/sites/south_crown_mill.json',
                  'game/survival/world_content/scenes/south_quarry_overworld.tscn',
                  'game/survival/world_content/scenes/south_orchard_ruin_overworld.tscn',
                  'game/survival/world_content/scenes/south_crown_mill_overworld.tscn',
                  'game/survival/world_content/scripts/native_poi_shell.gd',
              ],
          }
          provenance = {}
          for owner, paths in required.items():
              sha = os.environ[owner.upper() + '_SHA']
              for path in paths:
                  assert (root / path).is_file(), f'OWNER_FILE_ABSENT:{owner}:{path}'
                  expected = git_bytes(sha, path)
                  assert (root / path).read_bytes() == expected, f'OWNER_FILE_DRIFT:{owner}:{path}'
                  provenance[path] = {'owner': owner, 'commit': sha, 'sha256': hashlib.sha256(expected).hexdigest()}
          for path in required['a1']:
              assert path in report['copied']['a1'], f'A1_SCOPE_NOT_COPIED:{path}'
          merged = root / 'game/autoload/save_service.gd'
          assert merged.read_bytes() == (root / 'tools/a0/merges/save_service.gd.merged').read_bytes()
          assert b'func get_player_appearance_projection()' in merged.read_bytes()
          for path in ['game/characters/knight/knight.gd', 'game/autoload/input_bootstrap.gd', 'project.godot']:
              raw = (root / path).read_bytes()
              provenance[path] = {'owner': 'a0', 'commit': os.environ['A0_SHA'], 'sha256': hashlib.sha256(raw).hexdigest()}
          pathlib.Path('artifacts/a1-r13-continent-seam/owner-file-validation.json').write_text(json.dumps({
              'ok': True, 'required': required, 'out_of_scope_source_mutation': False,
          }, indent=2, sort_keys=True) + '\n')
          pathlib.Path('artifacts/a1-r13-continent-seam/runtime-provenance.json').write_text(
              json.dumps(provenance, indent=2, sort_keys=True) + '\n')
          PY
          git -C .composition init -q
          git -C .composition add -A
          composed_tree=$(git -C .composition write-tree)
          python3 - "$composed_tree" <<'PY'
          import json, os, pathlib, sys
          value = {
              'schema': 'soh.a1.r13_composed_source_identity.v1',
              'composed_tree_sha1': sys.argv[1],
              'algorithm': 'git write-tree over A0 composer output before private staging/import',
              'base_a0': os.environ['A0_SHA'], 'owner_a1': os.environ['A1_SHA'],
              'owner_a6': os.environ['A6_SHA'], 'owner_a8': os.environ['A8_SHA'],
              'scope': 'isolated R13 seam only; not production activation',
          }
          pathlib.Path('artifacts/a1-r13-continent-seam/composed-source.json').write_text(
              json.dumps(value, indent=2, sort_keys=True) + '\n')
          print('R13_COMPOSED_SOURCE', json.dumps(value, sort_keys=True))
          PY
      - name: Stage SHA-locked D051 base art privately on the runner only
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/a6_r13_source"
          bash .composition/tools/fetch_a6_avatar_sources.sh "$RUNNER_TEMP/a6_r13_source" \
            | tee artifacts/a1-r13-continent-seam/avatar-source-fetch.log
          python3 .composition/tools/stage_a6_avatar_art.py \
            --male-zip "$RUNNER_TEMP/a6_r13_source/male.zip" \
            --female-zip "$RUNNER_TEMP/a6_r13_source/female.zip" \
            | tee artifacts/a1-r13-continent-seam/avatar-private-staging.log
          rm -f "$RUNNER_TEMP/a6_r13_source"/*.zip
          test -f .composition/private_art/a6_avatar/avatar_art_private_runtime.json
          test -z "$(git ls-files private_art)"
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.0
          use-dotnet: false
          include-templates: false
      - name: Import exact composed Godot 4.7 project
        run: |
          set -euo pipefail
          mkdir -p artifacts/ud_a1_r13_import
          timeout --signal=TERM --kill-after=10s 300s godot --headless \
            --path .composition --user-data-dir artifacts/ud_a1_r13_import \
            --import >artifacts/a1-r13-continent-seam/godot-import.log 2>&1
          rc=$?
          echo "R13 import exit_code=$rc"
          tail -60 artifacts/a1-r13-continent-seam/godot-import.log
          exit $rc
      - name: Execute real D051 controller + real A8 approach/door/retreat and native 1x captures
        run: |
          set -euo pipefail
          mkdir -p artifacts/ud_a1_r13_native
          timeout --signal=TERM --kill-after=15s 1200s xvfb-run -a -s "-screen 0 3840x2160x24" \
            env LIBGL_ALWAYS_SOFTWARE=1 SOUL_OF_HERO_SAVE_PATH="user://r13_continent_seam_identity.json" \
            godot --path .composition --rendering-method gl_compatibility --rendering-driver opengl3 --audio-driver Dummy \
            --user-data-dir artifacts/ud_a1_r13_native --windowed --fixed-fps 60 \
            --script res://tests/survival/world/r13_continent_seam_native_test.gd -- \
            --out-root="$GITHUB_WORKSPACE/artifacts/a1-r13-continent-seam" --require-d051-art \
            >artifacts/a1-r13-continent-seam/godot-r13.log 2>&1
          rc=$?
          echo "R13 native exit_code=$rc"
          cat artifacts/a1-r13-continent-seam/godot-r13.log
          exit $rc
      - name: Native anti-vacuity and independent report/PNG validation
        if: always()
        run: |
          set -euo pipefail
          log=artifacts/a1-r13-continent-seam/godot-r13.log
          test -f "$log"
          ! grep -q 'SCRIPT ERROR' "$log"
          checks=$(grep -cE '^A1_R13 (PASS|FAIL): ' "$log" || true)
          captures=$(grep -c 'nonblank native 1x capture' "$log" || true)
          echo "R13 assertions=${checks}; captures=${captures}"
          test "${checks:-0}" -ge 100
          test "${captures:-0}" -eq 15
          grep -q 'A1 R13 CONTINENT SEAM NATIVE FIXTURE PASSED' "$log"
          grep -q 'InputBootstrap autoload initialized before input/body diagnosis' "$log"
          grep -q 'actual A8 approach journey physically returns to retreat quarry' "$log"
          grep -q 'actual A8 approach journey physically returns to retreat orchard' "$log"
          grep -q 'physical crossing changes region and chunk but never world identity' "$log"
          python3 tools/survival/worldgen/validate_r13_continent_seam.py \
            --report artifacts/a1-r13-continent-seam/r13_native_report.json \
            --manifest data/survival/world/a1_continent_interface.v1.json \
            --project .composition --require-d051-art \
            --out artifacts/a1-r13-continent-seam/native_validation.json
      - name: Upload exact-head R13 evidence without private source sheets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a1-r13-continent-seam-native-evidence
          path: |
            artifacts/a1-r13-continent-seam/
            .composition/composition.json
            .composition/CONFLICTS.md
          if-no-files-found: warn
          retention-days: 14
      - name: Mirror public R13 evidence as Git blobs (artifact-host fallback)
        if: always()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/ci/mirror_native_evidence.py --root artifacts/a1-r13-continent-seam
