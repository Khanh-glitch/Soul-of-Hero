name: ARCANA20 current Spore Nebula world review
on:
  workflow_dispatch:
  push:
    branches: [arena/c7b0c4e8-soul-of-hero]
    # Capture the newer cap material and stored-event crystal candidate; frozen world, not acceptance.
    paths: ['.github/workflows/arcana20-spore-current-review.yml']
permissions:
  contents: read
jobs:
  capture:
    strategy:
      fail-fast: false
      matrix:
        lighting: [normal, dimmed]
        direction: [A, B]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Assemble isolated current owner composition
        run: |
          git fetch --depth=1 --no-tags origin 04eacf62f1a3740a57e08691c3a9006d454aaa2c 6b801554a6af95424b4e39dd29f43c146aa13848 2cb1a3c5f093724eb9fecbdf45909ccb611f7b32 18e7afcbd576bbd9bfbcc509b2ee13216186a522 e505173edd119fdd955cf6249511b575a5468440
          python3 tools/arcana20_join/assemble.py --out "$RUNNER_TEMP/arcana20-spore" --avfx-sha "$GITHUB_SHA" --a0-sha 04eacf62f1a3740a57e08691c3a9006d454aaa2c
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.0
          use-dotnet: false
          include-templates: false
      - name: Add 5.7-second dispersal beat to disposable harness
        run: |
          python3 -c 'import pathlib; p=pathlib.Path("'"$RUNNER_TEMP"'/arcana20-spore/prototypes/arcana_fusion20/renderer/arcana20_overworld_join_test.gd"); s=p.read_text(); old="        if num == 16:\n            # Natural seeded C tail"; assert s.count(old)==1; p.write_text(s.replace(old,"        if num == 14:\n            targets.append(342)\n            labels.append(\"release_plume\")\n"+old))'
      - name: Import disposable project
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/arcana20-spore/artifacts"
          timeout 300s godot --headless --path "$RUNNER_TEMP/arcana20-spore" --import 2>&1 | tee "$RUNNER_TEMP/arcana20-spore/artifacts/import.log"
          ! grep -Eq 'SCRIPT ERROR:|Parse Error:' "$RUNNER_TEMP/arcana20-spore/artifacts/import.log"
      - name: Capture candidate authored event beats on actual frozen overworld
        env:
          ARCANA20_PHASE_LIGHT: ${{ matrix.lighting }}
          ARCANA20_ART14: ${{ matrix.direction }}
          ARCANA20_PHASE_FIRST: '14'
          ARCANA20_PHASE_LAST: '14'
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=10s 1000s xvfb-run -a -s '-screen 0 1280x720x24' env LIBGL_ALWAYS_SOFTWARE=1 \
            godot --verbose --path "$RUNNER_TEMP/arcana20-spore" --rendering-method gl_compatibility --audio-driver Dummy --resolution 1280x720 --windowed \
            --user-data-dir "$RUNNER_TEMP/arcana20-spore-user" --script res://prototypes/arcana_fusion20/renderer/arcana20_overworld_join_test.gd \
            2>&1 | tee "$RUNNER_TEMP/arcana20-spore/artifacts/phases.log"
          grep -Fq 'ARCANA20_JOIN_DIAGNOSTIC PASS' "$RUNNER_TEMP/arcana20-spore/artifacts/phases.log"
          ! grep -Eq 'SCRIPT ERROR:|Parse Error:|Shader compilation failed|JOIN_FAIL' "$RUNNER_TEMP/arcana20-spore/artifacts/phases.log"
      - run: python3 -m pip install --quiet pillow
      - name: Surface colony preview
        run: python3 prototypes/arcana_fusion20/renderer/c10_review_surface.py "$RUNNER_TEMP/arcana20-spore/artifacts" phase_14_candidate_A_colony_contact_03_tick216
      - name: Surface sporulation preview
        run: python3 prototypes/arcana_fusion20/renderer/c10_review_surface.py "$RUNNER_TEMP/arcana20-spore/artifacts" phase_14_candidate_A_sporulation_impact_06_tick324
      - name: Surface dispersal preview
        run: python3 prototypes/arcana_fusion20/renderer/c10_review_surface.py "$RUNNER_TEMP/arcana20-spore/artifacts" phase_14_release_plume_tick342
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arcana20-spore-current-${{ matrix.lighting }}-${{ matrix.direction }}
          path: |
            ${{ runner.temp }}/arcana20-spore/arcana20_join_manifest.json
            ${{ runner.temp }}/arcana20-spore/artifacts/
          if-no-files-found: warn
  full-motion:
    # Current revision full native source ticks; baseline is archived in
    # run 41288691508. Frozen world, not combat or a visual verdict.
    strategy:
      fail-fast: false
      matrix:
        skill: [14, 18]
        lighting: [normal, dimmed]
        revision: [candidate]
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Assemble identical world and explicit AVFX source revisions
        env:
          REVISION: ${{ matrix.revision }}
        run: |
          set -euo pipefail
          BASELINE=ffbcbdd7ec7974bb2529fb230cb0d492286b1093
          A0=04eacf62f1a3740a57e08691c3a9006d454aaa2c
          git fetch --depth=1 --no-tags origin "$BASELINE" "$A0" 6b801554a6af95424b4e39dd29f43c146aa13848 2cb1a3c5f093724eb9fecbdf45909ccb611f7b32 18e7afcbd576bbd9bfbcc509b2ee13216186a522 e505173edd119fdd955cf6249511b575a5468440
          SHA="$GITHUB_SHA"; if [ "$REVISION" = baseline ]; then SHA="$BASELINE"; fi
          python3 tools/arcana20_join/assemble.py --out "$RUNNER_TEMP/redesign-motion" --avfx-sha "$SHA" --a0-sha "$A0"
          cp prototypes/arcana_fusion20/renderer/arcana20_overworld_join_test.gd "$RUNNER_TEMP/redesign-motion/prototypes/arcana_fusion20/renderer/arcana20_overworld_join_test.gd"
          python3 - "$RUNNER_TEMP/redesign-motion/prototypes/arcana_fusion20/renderer/arcana20_overworld_join_test.gd" <<'PY'
          import pathlib,sys
          p=pathlib.Path(sys.argv[1]); s=p.read_text()
          old='        _phase_set_render(source, false)\n        var previous := 0'
          assert s.count(old)==1
          extra='\n'.join([
              '        if num in [14, 18] and OS.get_environment("ARCANA20_REDESIGN_MOTION") == "1":',
              '            targets.clear()',
              '            labels.clear()',
              '            for motion_tick in range(ceili(native_duration * 60.0)):',
              '                targets.append(motion_tick)',
              '                labels.append("full_motion_%03d" % motion_tick)',
              '',
          ])
          p.write_text(s.replace(old,extra+old))
          PY
          printf 'source_avfx=%s\ntest_harness=%s\na0=%s\ndirection=A\n' "$SHA" "$GITHUB_SHA" "$A0" > "$RUNNER_TEMP/redesign-motion/capture-revisions.txt"
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.0
          use-dotnet: false
          include-templates: false
      - name: Import
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/redesign-motion/artifacts"
          godot --headless --path "$RUNNER_TEMP/redesign-motion" --import 2>&1 | tee "$RUNNER_TEMP/redesign-motion/artifacts/import.log"
          ! grep -Eq 'SCRIPT ERROR:|Parse Error:' "$RUNNER_TEMP/redesign-motion/artifacts/import.log"
      - name: Capture every native 60-Hz source tick on real frozen world
        env:
          ARCANA20_PHASE_LIGHT: ${{ matrix.lighting }}
          ARCANA20_PHASE_FIRST: ${{ matrix.skill }}
          ARCANA20_PHASE_LAST: ${{ matrix.skill }}
          ARCANA20_REDESIGN_MOTION: '1'
          ARCANA20_ART14: A
          ARCANA20_ART18: A
        run: |
          set +e
          set -o pipefail
          timeout --signal=TERM --kill-after=10s 3000s xvfb-run -a -s '-screen 0 1280x720x24' env LIBGL_ALWAYS_SOFTWARE=1 \
            godot --path "$RUNNER_TEMP/redesign-motion" --rendering-method gl_compatibility --audio-driver Dummy --resolution 1280x720 --windowed \
            --user-data-dir "$RUNNER_TEMP/redesign-user" --script res://prototypes/arcana_fusion20/renderer/arcana20_overworld_join_test.gd \
            2>&1 | tee "$RUNNER_TEMP/redesign-motion/artifacts/world.log"
          RESULT=${PIPESTATUS[0]}
          grep -E 'JOIN_FAIL|SCRIPT ERROR|Parse Error|ERROR:|ARCANA20_JOIN_DIAGNOSTIC' "$RUNNER_TEMP/redesign-motion/artifacts/world.log" | head -20 | while IFS= read -r line; do echo "::notice title=MOTION_DIAGNOSTIC::$line"; done || true
          if [ "$RESULT" -ne 0 ]; then echo "::error::Motion Godot exited $RESULT"; exit "$RESULT"; fi
          grep -Fq 'ARCANA20_JOIN_DIAGNOSTIC PASS' "$RUNNER_TEMP/redesign-motion/artifacts/world.log"
          ! grep -Eq 'SCRIPT ERROR:|Parse Error:|Shader compilation failed|JOIN_FAIL' "$RUNNER_TEMP/redesign-motion/artifacts/world.log"
      - name: Encode lossless full resolution and playable review copy
        env:
          SKILL: ${{ matrix.skill }}
        run: |
          set -euo pipefail
          if ! command -v ffmpeg; then sudo apt-get update -qq && sudo apt-get install -y ffmpeg; fi
          ROOT="$RUNNER_TEMP/redesign-motion/artifacts/arcana20-join"
          mkdir "$RUNNER_TEMP/frames"
          python3 - "$ROOT" "$RUNNER_TEMP/frames" "$SKILL" <<'PY'
          import os,pathlib,sys
          root=pathlib.Path(sys.argv[1]); out=pathlib.Path(sys.argv[2]); skill=int(sys.argv[3]); total={14:516,18:504}[skill]
          for i in range(total):
              p=root / f'phase_{skill:02d}_full_motion_{i:03d}_tick{i}.png'
              if not p.is_file(): raise SystemExit(f'missing native frame: {p}')
              os.link(p,out / f'{i:03d}.png')
          PY
          COUNT=516; if [ "$SKILL" = 18 ]; then COUNT=504; fi
          ffmpeg -hide_banner -loglevel error -framerate 60 -i "$RUNNER_TEMP/frames/%03d.png" -frames:v "$COUNT" -c:v ffv1 -pix_fmt bgr0 "$RUNNER_TEMP/redesign-motion/artifacts/native-lossless.mkv"
          ffmpeg -hide_banner -loglevel error -framerate 60 -i "$RUNNER_TEMP/frames/%03d.png" -frames:v "$COUNT" -c:v libx264 -crf 16 -pix_fmt yuv420p "$RUNNER_TEMP/redesign-motion/artifacts/review.mp4"
          rm "$ROOT"/phase_*_full_motion_*_tick*.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: redesign-motion-${{ matrix.skill }}-${{ matrix.revision }}-${{ matrix.lighting }}
          path: |
            ${{ runner.temp }}/redesign-motion/capture-revisions.txt
            ${{ runner.temp }}/redesign-motion/arcana20_join_manifest.json
            ${{ runner.temp }}/redesign-motion/artifacts/
          if-no-files-found: warn
