name: ARCANA20 redesign source event runtime smoke
on:
  workflow_dispatch:
  push:
    branches: [arena/c7b0c4e8-soul-of-hero]
    paths:
      - '.github/workflows/arcana20-redesign-motion-smoke.yml'
      - 'prototypes/arcana_fusion20/renderer/redesign_motion_smoke.gd'
      - 'prototypes/arcana_fusion20/renderer/redesign_source_bench.gd'
      - 'prototypes/arcana_fusion20/renderer/source_a/a_redesign_spells.gd'
      - 'prototypes/arcana_fusion20/renderer/source_a/a_redesign_spells2.gd'
permissions:
  contents: read
jobs:
  source-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.0
          use-dotnet: false
          include-templates: false
      - name: Import
        run: |
          set -o pipefail
          godot --headless --path . --import 2>&1 | tee import.log
          ! grep -Eq 'SCRIPT ERROR:|Parse Error:' import.log
      - name: Exercise authored beats
        run: |
          set -o pipefail
          timeout 240s godot --headless --path . --script res://prototypes/arcana_fusion20/renderer/redesign_motion_smoke.gd 2>&1 | tee result.log
          grep -Fq REDESIGN_SMOKE_PASS result.log
          ! grep -Eq 'SCRIPT ERROR:|Parse Error:|REDESIGN_SMOKE_FAIL' result.log
      - name: Exercise alternate art directions
        run: |
          set -o pipefail
          timeout 240s env ARCANA20_ART14=B ARCANA20_ART18=B godot --headless --path . --script res://prototypes/arcana_fusion20/renderer/redesign_motion_smoke.gd 2>&1 | tee result-alternate.log
          grep -Fq REDESIGN_SMOKE_PASS result-alternate.log
          ! grep -Eq 'SCRIPT ERROR:|Parse Error:|REDESIGN_SMOKE_FAIL' result-alternate.log
      - name: Surface runtime results
        if: always()
        run: grep -E 'REDESIGN_SMOKE|SCRIPT ERROR|Parse Error' result.log | sed 's/^/::notice title=REDESIGN_SMOKE::/' || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: redesign-source-runtime-smoke
          path: |
            import.log
            result.log
            result-alternate.log
  phase-matched-cpu:
    # Phase matched, isolated CPU field render; not GPU/composition/device FPS.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.0
          use-dotnet: false
          include-templates: false
      - name: Prepare independent pinned baseline
        run: |
          set -euo pipefail
          # The exact old/new optimization revisions must remain immutable.
          # Later intentional redesigns must not silently relax that equality.
          git fetch --depth=1 --no-tags origin 69719b10ec31bda34e7c7a3481394b02af58445d 146d668dd6d78482ea413726217eccaf8d3cc715
          mkdir "$RUNNER_TEMP/baseline" "$RUNNER_TEMP/optimized"
          git archive 69719b10ec31bda34e7c7a3481394b02af58445d | tar -x -C "$RUNNER_TEMP/baseline"
          git archive 146d668dd6d78482ea413726217eccaf8d3cc715 | tar -x -C "$RUNNER_TEMP/optimized"
          for project in baseline optimized; do cp prototypes/arcana_fusion20/renderer/redesign_source_bench.gd "$RUNNER_TEMP/$project/prototypes/arcana_fusion20/renderer/"; done
      - name: Import and benchmark matched source beats
        run: |
          set -euo pipefail
          for WHICH in baseline optimized current; do
            PROJECT="$RUNNER_TEMP/$WHICH"; if [ "$WHICH" = current ]; then PROJECT="$GITHUB_WORKSPACE"; fi
            set +e
            godot --headless --path "$PROJECT" --import > "$RUNNER_TEMP/import-$WHICH.log" 2>&1
            IMPORT_RESULT=$?
            set -e
            if [ "$IMPORT_RESULT" -ne 0 ]; then
              # Surface earlier fatal diagnostics before progress output, since
              # runner artifacts/log redirects may be unavailable for analysis.
              grep -Ein 'fatal|error|terminate|abort|assert|out of memory|pthread|resource temporarily unavailable|cannot allocate' "$RUNNER_TEMP/import-$WHICH.log" | head -20 | while IFS= read -r line; do echo "::notice title=BENCH_IMPORT_CAUSE::$line"; done || true
              tail -8 "$RUNNER_TEMP/import-$WHICH.log" | while IFS= read -r line; do echo "::notice title=BENCH_IMPORT_FAILURE::$line"; done
              echo "::error::Import $WHICH exited $IMPORT_RESULT"
              exit "$IMPORT_RESULT"
            fi
            if grep -Eq 'SCRIPT ERROR:|Parse Error:' "$RUNNER_TEMP/import-$WHICH.log"; then cat "$RUNNER_TEMP/import-$WHICH.log"; exit 1; fi
            for ART in A B; do
              LOG="$RUNNER_TEMP/bench-$WHICH-$ART.log"
              set +e
              timeout 360s env ARCANA20_ART14="$ART" ARCANA20_ART18="$ART" godot --headless --path "$PROJECT" --script res://prototypes/arcana_fusion20/renderer/redesign_source_bench.gd > "$LOG" 2>&1
              RESULT=$?
              set -e
              if [ "$RESULT" -ne 0 ]; then
                tail -30 "$LOG" | while IFS= read -r line; do echo "::notice title=BENCH_FAILURE::$line"; done
                echo "::error::Benchmark $WHICH/$ART exited $RESULT"
                exit "$RESULT"
              fi
              grep -Fq REDESIGN_BENCH_PASS "$LOG"
              if grep -Eq 'SCRIPT ERROR:|Parse Error:' "$LOG"; then cat "$LOG"; exit 1; fi
              echo "::notice title=PHASE_BENCH::$WHICH-$ART $(grep 'REDESIGN_BENCH id=' "$LOG" | tr '\n' '|')"
            done
          done
          for ART in A B; do
            grep '^REDESIGN_FIELDS ' "$RUNNER_TEMP/bench-baseline-$ART.log" > "$RUNNER_TEMP/fields-baseline.txt"
            grep '^REDESIGN_FIELDS ' "$RUNNER_TEMP/bench-optimized-$ART.log" > "$RUNNER_TEMP/fields-optimized.txt"
            diff -u "$RUNNER_TEMP/fields-baseline.txt" "$RUNNER_TEMP/fields-optimized.txt"
            echo "::notice title=PHASE_BENCH::Direction $ART: six old/optimized source field SHA-256 digests equal; current intentionally changed design is measured separately, not parity asserted"
          done
