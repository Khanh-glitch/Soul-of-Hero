name: ARCANA20 redesign source event runtime smoke
on:
  workflow_dispatch:
  push:
    branches: [arena/c7b0c4e8-soul-of-hero]
    paths:
      - '.github/workflows/arcana20-redesign-motion-smoke.yml'
      - 'prototypes/arcana_fusion20/renderer/redesign_motion_smoke.gd'
      - 'prototypes/arcana_fusion20/renderer/redesign_source_bench.gd'
      - 'prototypes/arcana_fusion20/renderer/source_a/a_redesign_spells.gd'
      - 'prototypes/arcana_fusion20/renderer/source_a/a_redesign_spells2.gd'
permissions:
  contents: read
jobs:
  source-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.0
          use-dotnet: false
          include-templates: false
      - name: Import
        run: |
          set -o pipefail
          godot --headless --path . --import 2>&1 | tee import.log
          ! grep -Eq 'SCRIPT ERROR:|Parse Error:' import.log
      - name: Exercise authored beats
        run: |
          set -o pipefail
          timeout 240s godot --headless --path . --script res://prototypes/arcana_fusion20/renderer/redesign_motion_smoke.gd 2>&1 | tee result.log
          grep -Fq REDESIGN_SMOKE_PASS result.log
          ! grep -Eq 'SCRIPT ERROR:|Parse Error:|REDESIGN_SMOKE_FAIL' result.log
      - name: Exercise alternate art directions
        run: |
          set -o pipefail
          timeout 240s env ARCANA20_ART14=B ARCANA20_ART18=B godot --headless --path . --script res://prototypes/arcana_fusion20/renderer/redesign_motion_smoke.gd 2>&1 | tee result-alternate.log
          grep -Fq REDESIGN_SMOKE_PASS result-alternate.log
          ! grep -Eq 'SCRIPT ERROR:|Parse Error:|REDESIGN_SMOKE_FAIL' result-alternate.log
      - name: Surface runtime results
        if: always()
        run: grep -E 'REDESIGN_SMOKE|SCRIPT ERROR|Parse Error' result.log | sed 's/^/::notice title=REDESIGN_SMOKE::/' || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: redesign-source-runtime-smoke
          path: |
            import.log
            result.log
            result-alternate.log
  phase-matched-cpu:
    # Phase matched, isolated CPU field render; not GPU/composition/device FPS.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.0
          use-dotnet: false
          include-templates: false
      - name: Prepare independent pinned baseline
        run: |
          set -euo pipefail
          git fetch --depth=1 --no-tags origin 69719b10ec31bda34e7c7a3481394b02af58445d
          mkdir "$RUNNER_TEMP/baseline"
          git archive 69719b10ec31bda34e7c7a3481394b02af58445d | tar -x -C "$RUNNER_TEMP/baseline"
          cp prototypes/arcana_fusion20/renderer/redesign_source_bench.gd "$RUNNER_TEMP/baseline/prototypes/arcana_fusion20/renderer/"
      - name: Import and benchmark matched source beats
        run: |
          set -euo pipefail
          for WHICH in baseline candidate; do
            PROJECT="$RUNNER_TEMP/baseline"; if [ "$WHICH" = candidate ]; then PROJECT="$GITHUB_WORKSPACE"; fi
            godot --headless --path "$PROJECT" --import > "$RUNNER_TEMP/import-$WHICH.log" 2>&1
            if grep -Eq 'SCRIPT ERROR:|Parse Error:' "$RUNNER_TEMP/import-$WHICH.log"; then cat "$RUNNER_TEMP/import-$WHICH.log"; exit 1; fi
            for ART in A B; do
              LOG="$RUNNER_TEMP/bench-$WHICH-$ART.log"
              timeout 360s env ARCANA20_ART14="$ART" ARCANA20_ART18="$ART" godot --headless --path "$PROJECT" --script res://prototypes/arcana_fusion20/renderer/redesign_source_bench.gd > "$LOG" 2>&1
              grep -Fq REDESIGN_BENCH_PASS "$LOG"
              if grep -Eq 'SCRIPT ERROR:|Parse Error:' "$LOG"; then cat "$LOG"; exit 1; fi
              echo "::notice title=PHASE_BENCH::$WHICH-$ART $(grep 'REDESIGN_BENCH id=' "$LOG" | tr '\n' '|')"
            done
          done
          for ART in A B; do
            grep '^REDESIGN_FIELDS ' "$RUNNER_TEMP/bench-baseline-$ART.log" > "$RUNNER_TEMP/fields-baseline.txt"
            grep '^REDESIGN_FIELDS ' "$RUNNER_TEMP/bench-candidate-$ART.log" > "$RUNNER_TEMP/fields-candidate.txt"
            diff -u "$RUNNER_TEMP/fields-baseline.txt" "$RUNNER_TEMP/fields-candidate.txt"
            echo "::notice title=PHASE_BENCH::Direction $ART: six matched source field SHA-256 digests equal; not full lifecycle/world parity"
          done
