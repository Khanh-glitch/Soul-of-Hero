name: A0 survival Web fixture validation
on:
  push:
    branches: [arena/dea2428e-soul-of-hero]
    paths:
      - game/survival/**
      - game/overworld/**
      - game/characters/knight/**
      - game/autoload/**
      - game/ui/**
      - data/survival/**
      - tools/survival/web_probe.*
      - .github/workflows/a0-survival-web-validation.yml
      - export_presets.cfg
      - project.godot
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web-survival-fixture:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GODOT_SILENCE_ROOT_WARNING: 1
      LIBGL_ALWAYS_SOFTWARE: 1
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.0
          use-dotnet: false
          include-templates: true
      - name: Compose temporary browser-only entry scene
        run: |
          set -euo pipefail
          printf '%s  %s\n' \
            703a8baa741ca6c4ad1e21ddd43b05c48af887dbfef7ed00d78117838e947ec3 game/survival/economy/a0_economy_adapter.gd \
            4f9165468cf98b557984c63168b84ace4dae264ef56e659ca7fe42c06802e82c game/survival/economy/vendor/a3_economy_service.gd \
            689a9b89dba4d756387b6b5c5f09b54d90ff0a787395f5e2fb523da496836efe game/survival/economy/world_source_adapter.gd \
            b1d291d035c9e543e69281da268b378c8e1bb498be561b2f15e67c840792b353 data/survival/items/world_source_bindings.v3.json \
            28ff818a406de7d53d2c0e3e2fd7295baef0fcec9c086ceb0206d5a2251fdb87 data/survival/items/sources.json | sha256sum -c -
          cp tools/survival/web_probe.gd game/survival/web_probe_ci.gd
          cp tools/survival/web_probe.tscn game/survival/web_probe_ci.tscn
          python3 - <<'PY'
          from pathlib import Path
          p = Path('project.godot')
          s = p.read_text()
          old = 'run/main_scene="res://game/app/app_root.tscn"'
          assert s.count(old) == 1
          p.write_text(s.replace(old, 'run/main_scene="res://game/survival/web_probe_ci.tscn"'))
          # Read-only breadcrumbs in this temporary checkout locate a native
          # Web engine abort inside the synchronous world builder.
          world = Path('game/overworld/chapter1_overworld.gd')
          s = world.read_text()
          for marker in ('_build_survival()', '_build_economy_session()', '_build_occlusion()', '_build_hud()', '_build_economy_panel()', '_connect_run_events()', '_apply_hud()'):
              needle = '\t' + marker + '\n'
              assert s.count(needle) >= 1, marker
              crumb = "\tJavaScriptBridge.eval(\"window.__survivalBuildTrace=(window.__survivalBuildTrace||[]).concat('%s');\", true)\n" % marker
              s = s.replace(needle, needle + crumb, 1)
          world.write_text(s)
          PY
          echo "Temporary CI fixture from A0 $(git rev-parse HEAD); production entrypoint not changed in Git." >> "$GITHUB_STEP_SUMMARY"
      - name: Import and export real Web runtime
        run: |
          set -euo pipefail
          mkdir -p artifacts/web-survival build/web
          timeout --signal=TERM --kill-after=10s 240s godot --headless --audio-driver Dummy --editor --path . --import 2>&1 | tee artifacts/web-survival/import.log
          timeout --signal=TERM --kill-after=10s 480s godot --headless --audio-driver Dummy --path . --export-release 'Web Playtest' build/web/index.html 2>&1 | tee artifacts/web-survival/export.log
          for file in index.html index.js index.wasm index.pck; do test -s "build/web/$file"; done
          ! grep -E 'SCRIPT ERROR|Parse Error|^ERROR:' artifacts/web-survival/import.log artifacts/web-survival/export.log
      - name: Drive production survival overworld in Chromium
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/web-probe" --no-save --no-audit --no-fund playwright-core@1.56.1
          export NODE_PATH="$RUNNER_TEMP/web-probe/node_modules"
          export CHROME_BIN="$(command -v google-chrome || command -v chromium || true)"
          test -n "$CHROME_BIN"
          python3 -m http.server 8787 --bind 127.0.0.1 --directory build/web > artifacts/web-survival/http.log 2>&1 &
          web_pid=$!
          trap 'kill "$web_pid" 2>/dev/null || true' EXIT
          export WEB_SMOKE_URL=http://127.0.0.1:8787/
          export WEB_SMOKE_OUTPUT=artifacts/web-survival
          timeout --signal=TERM --kill-after=10s 150s node tools/survival/web_probe.cjs 2>&1 | tee artifacts/web-survival/browser.log
          grep -q 'SURVIVAL WEB BROWSER FIXTURE PASSED' artifacts/web-survival/browser.log
      - name: Surface outcome
        if: always()
        run: |
          for file in artifacts/web-survival/*.log; do
            test -f "$file" || continue
            printf '::notice::%s: %s\n' "$file" "$(grep -E 'SURVIVAL WEB|SCRIPT ERROR|Parse Error|^ERROR:' "$file" | tail -5 | tr '\n' '~' | cut -c1-2500)"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: survival-web-fixture-evidence
          path: artifacts/web-survival/
          if-no-files-found: warn
