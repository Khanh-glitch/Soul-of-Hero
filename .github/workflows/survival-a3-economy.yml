name: Survival A3 Economy Validation

on:
  push:
    branches:
      - arena/7a12b27e-soul-of-hero
      - arena/daadd745-soul-of-hero
    paths:
      - '.github/workflows/survival-a3-economy.yml'
      - 'data/content/items/**'
      - 'data/survival/items/**'
      - 'data/survival/recipes/**'
      - 'game/survival/economy/**'
      - 'tools/survival/economy/**'
      - 'tests/survival/a3_value_economy_test.gd'
      - 'tests/survival/catalog/**'
      - 'docs/survival/economy/**'
  pull_request:
    branches:
      - arena/7a12b27e-soul-of-hero
      - arena/daadd745-soul-of-hero
      - feature/survival-rpg-foundation-20261029
      - main
    paths:
      - '.github/workflows/survival-a3-economy.yml'
      - 'data/content/items/**'
      - 'data/survival/items/**'
      - 'data/survival/recipes/**'
      - 'game/survival/economy/**'
      - 'tools/survival/economy/**'
      - 'tests/survival/a3_value_economy_test.gd'
      - 'tests/survival/catalog/**'
      - 'docs/survival/economy/**'
  workflow_dispatch:

env:
  ARTIFACT_DIR: artifacts/a3-economy

jobs:
  contracts-and-balance:
    name: A3 CATALOG / BALANCE CONTRACTS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/survival/economy/requirements.txt
      - run: mkdir -p "$ARTIFACT_DIR"
      - name: Schema / reference / accessibility / conservation audit
        run: |
          python tools/survival/economy/validate_economy.py \
            --json "$ARTIFACT_DIR/validation_report.json" \
            --index "$ARTIFACT_DIR/reverse_index.json"
      - name: Adversarial catalog and balance-model tests
        run: python -m unittest discover -s tests/survival/catalog -p 'test_*.py' -v
      - name: Deterministic economic simulation
        run: python tools/survival/economy/simulate_economy.py --json "$ARTIFACT_DIR/balance_report.json"
      - name: Save-growth serialization model
        run: python tools/survival/economy/measure_save_growth.py --json "$ARTIFACT_DIR/save_growth_report.json"
      - name: Product-facing progression/scarcity model (separate from conservation fixture)
        run: |
          python tools/survival/economy/model_progression.py --json "$ARTIFACT_DIR/progression_report.json"
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          r = json.load(open(os.environ['ARTIFACT_DIR'] + '/progression_report.json'))
          b = r['baseline']
          print('### A3 product progression model (SIMULATION_ONLY)')
          print(f"Baseline: Ember discovery session {b['firsts'].get('discovery:core_ember')}, Frost {b['firsts'].get('discovery:core_frost')}, Ember manufacture {b['firsts'].get('manufacture:core_ember')}.")
          print(f"Remaining late goals: {b['remaining_late_goal_count']}; native casts executed: {b['summary']['native_casts_executed']}.")
          t = b['time_accounting']
          print(f"Time accounting: {t['status']}; active {t['active_modeled_seconds']}s / budget {t['scheduled_budget_seconds']}s; unused {t['unused_budget_seconds']}s; station work {t['station_work_seconds']}s (overlaps active).")
          print(f"Scenarios: {len(r['scenarios'])}; A1 source adoption: {', '.join(b['source_adoption']['adopted'])}; rejected global aliases remain blocked.")
          PY
      - name: V5 first-hour pacing lower-bound model (not a playtest)
        run: |
          python tools/survival/economy/progression_v5.py --json "$ARTIFACT_DIR/progression_v5.json"
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          r = json.load(open(os.environ['ARTIFACT_DIR'] + '/progression_v5.json'))
          print('### A3 V5 pacing model (MODEL_ONLY, not human playtest)')
          for name, s in r['scenarios'].items():
              m = s['milestones']
              print(f"- {name}: 20m lower bound {m['20_min']['lower_bound_seconds']}s; 90m lower bound {m['90_min']['lower_bound_seconds']}s; cache wait {s['cache_active_wait_seconds']}s; tool effect {s['tool_effect_status']}.")
          PY
      - name: V7 deterministic 336h two-layer economy model (not a playtest)
        run: |
          python tools/survival/economy/model_meta_economy.py --json "$ARTIFACT_DIR/meta_balance_report.json"
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          r = json.load(open(os.environ['ARTIFACT_DIR'] + '/meta_balance_report.json'))
          print('### A3 V7 meta-economy model (AI_TUNABLE, NOT_HUMAN_PLAYTEST)')
          for s in r['baseline']:
              print(f"- {s['strategy']}: banked {s['expected_banked_currency']}, meals {s['meals_affordable_next_run']}, power {s['run_local_power_proxy']}, core proxy {s['rare_core_discovery_probability_proxy']}.")
          print(f"Universal dominance: {r['universally_dominant_strategies']}.")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a3-economy-contracts
          path: artifacts/a3-economy/

  native-adapter:
    name: A3 NATIVE SAVE ADAPTER
    needs: contracts-and-balance
    runs-on: ubuntu-latest
    env:
      ARTIFACT_DIR: artifacts/a3-economy
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.0
          use-dotnet: false
          include-templates: false
      - run: mkdir -p "$ARTIFACT_DIR"
      - name: Import project (real engine parser)
        run: |
          set +e
          timeout --signal=TERM --kill-after=10s 240s godot --headless --path . \
            --user-data-dir artifacts/a3-import --import >"$ARTIFACT_DIR/import.log" 2>&1
          rc=$?
          set -e
          tail -60 "$ARTIFACT_DIR/import.log"
          if [ "$rc" -ne 0 ]; then
            bash tools/ci/annotate_log.sh "$ARTIFACT_DIR/import.log" "A3 import engine exit $rc" 20 || true
            echo "::warning::A3 import: godot exited $rc; the log gate decides"
          fi
          bash tools/ci/gate_log.sh "$ARTIFACT_DIR/import.log" "A3 import" || exit 1
          exit 0
      - name: Economy adapter against real SaveService
        run: |
          set +e
          timeout --signal=TERM --kill-after=10s 300s godot --headless --path . \
            --user-data-dir artifacts/a3-runtime \
            --script res://tests/survival/catalog/economy_adapter_test.gd \
            >"$ARTIFACT_DIR/adapter.log" 2>&1
          rc=$?
          set -e
          cat "$ARTIFACT_DIR/adapter.log"
          if [ "$rc" -ne 0 ]; then
            bash tools/ci/annotate_log.sh "$ARTIFACT_DIR/adapter.log" "A3 adapter engine exit $rc" 30 || true
            echo "::warning::A3 adapter: godot exited $rc; the log gate and the PASS marker decide"
          fi
          # The V5 failed-save oracle intentionally obstructs the temporary write.
          # Gate a copy with exactly that line removed, never a blanket filter.
          grep -vE '^(USER )?ERROR: SaveService: Could not write the temporary save file[.]$' \
            "$ARTIFACT_DIR/adapter.log" > "$ARTIFACT_DIR/adapter.gate.log"
          bash tools/ci/gate_log.sh "$ARTIFACT_DIR/adapter.gate.log" "A3 adapter" "A3 ECONOMY ADAPTER PASSED" || exit 1
          summary="$(grep 'A3 ECONOMY ADAPTER PASSED' "$ARTIFACT_DIR/adapter.log" | tail -1)"
          echo "::notice title=A3 native adapter::${summary}"
          echo "$summary" >> "$GITHUB_STEP_SUMMARY"
          grep 'A3_NATIVE_SAVE_GROWTH' "$ARTIFACT_DIR/adapter.log" | tail -1 >> "$GITHUB_STEP_SUMMARY" || true
          exit 0
      - name: World cooldown / receipt across two OS processes
        run: |
          set +e
          A3_RESTART_PHASE=1 timeout --signal=TERM --kill-after=10s 120s godot --headless --path . \
            --user-data-dir artifacts/a3-runtime \
            --script res://tests/survival/catalog/economy_world_restart_test.gd \
            >"$ARTIFACT_DIR/restart_phase1.log" 2>&1
          rc1=$?
          A3_RESTART_PHASE=2 timeout --signal=TERM --kill-after=10s 120s godot --headless --path . \
            --user-data-dir artifacts/a3-runtime \
            --script res://tests/survival/catalog/economy_world_restart_test.gd \
            >"$ARTIFACT_DIR/restart_phase2.log" 2>&1
          rc2=$?
          set -e
          cat "$ARTIFACT_DIR/restart_phase1.log" "$ARTIFACT_DIR/restart_phase2.log"
          if [ "$rc1" -ne 0 ] || [ "$rc2" -ne 0 ]; then
            bash tools/ci/annotate_log.sh "$ARTIFACT_DIR/restart_phase2.log" "A3 restart phase2 engine exit $rc2" 25 || true
            echo "::warning::A3 world restart: rc1=$rc1 rc2=$rc2; both logs must pass their gates"
          fi
          # Both phases deliberately exercise a failed atomic write, so gate copies
          # with exactly that line removed (named, never a blanket filter).
          for phase in restart_phase1 restart_phase2; do
            grep -vE '^(USER )?ERROR: SaveService: Could not write the temporary save file[.]$' \
              "$ARTIFACT_DIR/${phase}.log" > "$ARTIFACT_DIR/${phase}.gate.log"
          done
          bash tools/ci/gate_log.sh "$ARTIFACT_DIR/restart_phase1.gate.log" "A3 restart phase1" "A3 WORLD RESTART PHASE 1 PASSED" || exit 1
          bash tools/ci/gate_log.sh "$ARTIFACT_DIR/restart_phase2.gate.log" "A3 restart phase2" "A3 WORLD RESTART PHASE 2 PASSED" || exit 1
          echo "A3 two-process world restart PASSED" >> "$GITHUB_STEP_SUMMARY"
          exit 0
      - name: V6 prepared offline operations against real SaveService
        run: |
          set +e
          timeout --signal=TERM --kill-after=10s 300s godot --headless --path . \
            --user-data-dir artifacts/a3-runtime \
            --script res://tests/survival/catalog/economy_offline_test.gd \
            >"$ARTIFACT_DIR/offline.log" 2>&1
          rc=$?
          set -e
          cat "$ARTIFACT_DIR/offline.log"
          if [ "$rc" -ne 0 ]; then
            bash tools/ci/annotate_log.sh "$ARTIFACT_DIR/offline.log" "A3 offline engine exit $rc" 30 || true
            echo "::warning::A3 offline: godot exited $rc; the log gate and PASS marker decide"
          fi
          # The crash/replay case intentionally obstructs the temporary write.
          grep -vE '^(USER )?ERROR: SaveService: Could not write the temporary save file[.]$' \
            "$ARTIFACT_DIR/offline.log" > "$ARTIFACT_DIR/offline.gate.log"
          bash tools/ci/gate_log.sh "$ARTIFACT_DIR/offline.gate.log" "A3 offline" "A3 OFFLINE OPERATIONS PASSED" || exit 1
          grep 'A3 OFFLINE OPERATIONS PASSED' "$ARTIFACT_DIR/offline.log" | tail -1 >> "$GITHUB_STEP_SUMMARY" || true
          exit 0
      - name: V6 prepared offline settlement across two OS processes
        run: |
          set +e
          A3_OFFLINE_RESTART_PHASE=1 timeout --signal=TERM --kill-after=10s 120s godot --headless --path . \
            --user-data-dir artifacts/a3-runtime \
            --script res://tests/survival/catalog/economy_offline_restart_test.gd \
            >"$ARTIFACT_DIR/offline_restart_phase1.log" 2>&1
          rc1=$?
          A3_OFFLINE_RESTART_PHASE=2 timeout --signal=TERM --kill-after=10s 120s godot --headless --path . \
            --user-data-dir artifacts/a3-runtime \
            --script res://tests/survival/catalog/economy_offline_restart_test.gd \
            >"$ARTIFACT_DIR/offline_restart_phase2.log" 2>&1
          rc2=$?
          set -e
          cat "$ARTIFACT_DIR/offline_restart_phase1.log" "$ARTIFACT_DIR/offline_restart_phase2.log"
          if [ "$rc1" -ne 0 ] || [ "$rc2" -ne 0 ]; then
            bash tools/ci/annotate_log.sh "$ARTIFACT_DIR/offline_restart_phase2.log" "A3 offline restart phase2 engine exit $rc2" 25 || true
            echo "::warning::A3 offline restart: rc1=$rc1 rc2=$rc2; both logs must pass their gates"
          fi
          # Both phases deliberately exercise a failed atomic write, so gate copies
          # with exactly that line removed (named, never a blanket filter).
          for phase in offline_restart_phase1 offline_restart_phase2; do
            grep -vE '^(USER )?ERROR: SaveService: Could not write the temporary save file[.]$' \
              "$ARTIFACT_DIR/${phase}.log" > "$ARTIFACT_DIR/${phase}.gate.log"
          done
          bash tools/ci/gate_log.sh "$ARTIFACT_DIR/offline_restart_phase1.gate.log" "A3 offline restart phase1" "A3 OFFLINE RESTART PHASE 1 PASSED" || exit 1
          bash tools/ci/gate_log.sh "$ARTIFACT_DIR/offline_restart_phase2.gate.log" "A3 offline restart phase2" "A3 OFFLINE RESTART PHASE 2 PASSED" || exit 1
          echo "A3 two-process offline restart PASSED" >> "$GITHUB_STEP_SUMMARY"
          exit 0
      - name: V5 tool-use callable read-only plan / atomic candidate transform
        run: |
          set +e
          timeout --signal=TERM --kill-after=10s 120s godot --headless --path . \
            --user-data-dir artifacts/a3-runtime \
            --script res://tests/survival/catalog/economy_tool_use_test.gd \
            >"$ARTIFACT_DIR/tool_use.log" 2>&1
          rc=$?
          set -e
          cat "$ARTIFACT_DIR/tool_use.log"
          if [ "$rc" -ne 0 ]; then
            bash tools/ci/annotate_log.sh "$ARTIFACT_DIR/tool_use.log" "A3 tool use engine exit $rc" 30 || true
            echo "::warning::A3 tool use: godot exited $rc; the log gate and PASS marker decide"
          fi
          grep -vE '^(USER )?ERROR: SaveService: Could not write the temporary save file[.]$' \
            "$ARTIFACT_DIR/tool_use.log" > "$ARTIFACT_DIR/tool_use.gate.log"
          bash tools/ci/gate_log.sh "$ARTIFACT_DIR/tool_use.gate.log" "A3 tool use" "A3 TOOL USE CALLABLE PASSED" || exit 1
          grep 'A3 TOOL USE CALLABLE PASSED' "$ARTIFACT_DIR/tool_use.log" | tail -1 >> "$GITHUB_STEP_SUMMARY" || true
          exit 0
      - name: V7 two-layer meta-economy owner-contract candidate tests
        run: |
          set +e
          timeout --signal=TERM --kill-after=10s 300s godot --headless --path . \
            --user-data-dir artifacts/a3-runtime \
            --script res://tests/survival/catalog/economy_meta_test.gd \
            >"$ARTIFACT_DIR/meta.log" 2>&1
          rc=$?
          set -e
          cat "$ARTIFACT_DIR/meta.log"
          if [ "$rc" -ne 0 ]; then
            bash tools/ci/annotate_log.sh "$ARTIFACT_DIR/meta.log" "A3 meta engine exit $rc" 30 || true
            echo "::warning::A3 meta: godot exited $rc; the log gate and PASS marker decide"
          fi
          grep -vE '^(USER )?ERROR: SaveService: Could not write the temporary save file[.]$' \
            "$ARTIFACT_DIR/meta.log" > "$ARTIFACT_DIR/meta.gate.log"
          bash tools/ci/gate_log.sh "$ARTIFACT_DIR/meta.gate.log" "A3 meta" "A3 META ECONOMY PASSED" || exit 1
          grep 'A3 META ECONOMY PASSED' "$ARTIFACT_DIR/meta.log" | tail -1 >> "$GITHUB_STEP_SUMMARY" || true
          exit 0
      - name: V7 meta deposit/purchase across two OS processes
        run: |
          set +e
          A3_META_RESTART_PHASE=1 timeout --signal=TERM --kill-after=10s 120s godot --headless --path . \
            --user-data-dir artifacts/a3-runtime \
            --script res://tests/survival/catalog/economy_meta_restart_test.gd \
            >"$ARTIFACT_DIR/meta_restart_phase1.log" 2>&1
          rc1=$?
          A3_META_RESTART_PHASE=2 timeout --signal=TERM --kill-after=10s 120s godot --headless --path . \
            --user-data-dir artifacts/a3-runtime \
            --script res://tests/survival/catalog/economy_meta_restart_test.gd \
            >"$ARTIFACT_DIR/meta_restart_phase2.log" 2>&1
          rc2=$?
          set -e
          cat "$ARTIFACT_DIR/meta_restart_phase1.log" "$ARTIFACT_DIR/meta_restart_phase2.log"
          if [ "$rc1" -ne 0 ] || [ "$rc2" -ne 0 ]; then
            bash tools/ci/annotate_log.sh "$ARTIFACT_DIR/meta_restart_phase2.log" "A3 meta restart phase2 engine exit $rc2" 25 || true
            echo "::warning::A3 meta restart: rc1=$rc1 rc2=$rc2; both logs must pass their gates"
          fi
          # Both phases deliberately exercise a failed atomic write, so gate copies
          # with exactly that line removed (named, never a blanket filter).
          for phase in meta_restart_phase1 meta_restart_phase2; do
            grep -vE '^(USER )?ERROR: SaveService: Could not write the temporary save file[.]$' \
              "$ARTIFACT_DIR/${phase}.log" > "$ARTIFACT_DIR/${phase}.gate.log"
          done
          bash tools/ci/gate_log.sh "$ARTIFACT_DIR/meta_restart_phase1.gate.log" "A3 meta restart phase1" "A3 META RESTART PHASE 1 PASSED" || exit 1
          bash tools/ci/gate_log.sh "$ARTIFACT_DIR/meta_restart_phase2.gate.log" "A3 meta restart phase2" "A3 META RESTART PHASE 2 PASSED" || exit 1
          echo "A3 two-process meta restart PASSED" >> "$GITHUB_STEP_SUMMARY"
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a3-economy-native
          path: artifacts/a3-economy/

  r13-value-economy:
    name: R13 A3 VALUE ECONOMY NATIVE (GODOT 4.7)
    needs: native-adapter
    runs-on: ubuntu-latest
    env:
      ARTIFACT_DIR: artifacts/r13-value-economy
      A3_TEST_SAVE: user://tests/r13_value_economy_p1.json
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.0
          use-dotnet: false
          include-templates: false
      - run: mkdir -p "$ARTIFACT_DIR"
      - name: Adoption contract matches this tree
        # A stale contract is how A0 ends up composing a file set no engine run
        # validated. Fails on hash drift, a missing composed file, a rejected file
        # that came back, or a composed edit after the tested head.
        run: |
          tested="$(python3 -c "import json;print((json.load(open('docs/survival/economy/A0_ADOPTION_CONTRACT_V2.json')).get('generated_from') or {}).get('tested_head',''))")"
          if [ -n "$tested" ]; then
            git fetch --depth=1 origin "$tested" >/dev/null 2>&1 || true
          fi
          python3 tools/ci/verify_adoption_contract.py
      - name: Static hazard gate (Variant inference, second authority, shell state)
        # This is not a substitute for the engine. It removes the exact defect
        # class that failed run 41228370691 before an engine minute is spent.
        run: python3 tools/ci/gd_r13_static_check.py
      - name: Import project (real engine parser)
        run: |
          timeout --signal=TERM --kill-after=10s 240s godot --headless --path . \
            --user-data-dir "$ARTIFACT_DIR" --import >"$ARTIFACT_DIR/import.log" 2>&1
          rc=$?
          tail -60 "$ARTIFACT_DIR/import.log"
          bash tools/ci/gate_log.sh "$ARTIFACT_DIR/import.log" "R13 import" || exit 1
          if [ "$rc" -ne 0 ]; then
            bash tools/ci/annotate_log.sh "$ARTIFACT_DIR/import.log" "R13 import engine exit $rc" 20 || true
          fi
          exit $rc
      - name: R13 process 1 — authenticate, harvest, research, queue, exit
        # Independent Godot OS process 1. Its exit code is captured and gated
        # inside THIS step: GitHub Actions steps share no shell variables.
        run: |
          set +e
          A3_TEST_ROLE=process_1 \
          SOUL_OF_HERO_SAVE_PATH="$A3_TEST_SAVE" \
          A3_RECEIPT_DIR="$PWD/$ARTIFACT_DIR/tests/receipts" \
          timeout --signal=TERM --kill-after=10s 120s godot --headless --path . \
            --user-data-dir "$ARTIFACT_DIR" \
            --script res://tests/survival/a3_value_economy_test.gd \
            >"$ARTIFACT_DIR/r13_phase1.log" 2>&1
          rc=$?
          set -e
          cat "$ARTIFACT_DIR/r13_phase1.log"
          # Two independent obligations, never conflated:
          #   1. the process must exit 0 (this gate; TIMEOUT/SHUTDOWN_ONLY/ABNORMAL fail);
          #   2. the log must be clean and must carry the PASS marker (gate_log.sh).
          # Run the exit gate first: GitHub caps annotations per step, and this one
          # is the decisive single line if the summary below is ever truncated.
          exit_rc=0
          python3 tools/ci/godot_exit_gate.py \
            --phase "R13 phase1" --rc "$rc" --log "$ARTIFACT_DIR/r13_phase1.log" || exit_rc=$?
          gate_rc=0
          bash tools/ci/gate_log.sh "$ARTIFACT_DIR/r13_phase1.log" "R13 phase1" "P1 PASSED" || gate_rc=$?
          if [ "$exit_rc" -ne 0 ] || [ "$gate_rc" -ne 0 ]; then
            if grep -q '^\[FAIL\]' "$ARTIFACT_DIR/r13_phase1.log"; then
              grep '^\[FAIL\]' "$ARTIFACT_DIR/r13_phase1.log" | head -3 | while IFS= read -r line; do
                echo "::error::R13 phase1 assertion ${line}"
              done
            fi
            bash tools/ci/annotate_log.sh "$ARTIFACT_DIR/r13_phase1.log" "R13 phase1 tail" 20 || true
            echo "::error::R13 phase1 FAILED: engine rc=$rc exit_gate=$exit_rc log_gate=$gate_rc"
            exit 1
          fi
          echo "R13 phase1 PASSED (engine rc=0, log gate clean, pid recorded in receipt)" >> "$GITHUB_STEP_SUMMARY"
      - name: R13 process 2 — reload, mature, claim once, refuse duplicate, exit
        # Independent Godot OS process 2 against the SAME isolated durable save.
        run: |
          set +e
          A3_TEST_ROLE=process_2 \
          SOUL_OF_HERO_SAVE_PATH="$A3_TEST_SAVE" \
          A3_RECEIPT_DIR="$PWD/$ARTIFACT_DIR/tests/receipts" \
          timeout --signal=TERM --kill-after=10s 120s godot --headless --path . \
            --user-data-dir "$ARTIFACT_DIR" \
            --script res://tests/survival/a3_value_economy_test.gd \
            >"$ARTIFACT_DIR/r13_phase2.log" 2>&1
          rc=$?
          set -e
          cat "$ARTIFACT_DIR/r13_phase2.log"
          exit_rc=0
          python3 tools/ci/godot_exit_gate.py \
            --phase "R13 phase2" --rc "$rc" --log "$ARTIFACT_DIR/r13_phase2.log" || exit_rc=$?
          gate_rc=0
          bash tools/ci/gate_log.sh "$ARTIFACT_DIR/r13_phase2.log" "R13 phase2" "P2 PASSED" || gate_rc=$?
          if [ "$exit_rc" -ne 0 ] || [ "$gate_rc" -ne 0 ]; then
            if grep -q '^\[FAIL\]' "$ARTIFACT_DIR/r13_phase2.log"; then
              grep '^\[FAIL\]' "$ARTIFACT_DIR/r13_phase2.log" | head -3 | while IFS= read -r line; do
                echo "::error::R13 phase2 assertion ${line}"
              done
            fi
            bash tools/ci/annotate_log.sh "$ARTIFACT_DIR/r13_phase2.log" "R13 phase2 tail" 20 || true
            echo "::error::R13 phase2 FAILED: engine rc=$rc exit_gate=$exit_rc log_gate=$gate_rc"
            exit 1
          fi
          echo "R13 phase2 PASSED (engine rc=0, log gate clean, distinct pid in receipt)" >> "$GITHUB_STEP_SUMMARY"
      - name: Two-process receipt verification (one paid settlement, duplicate refused)
        # The receipts are the evidence; no shell state crosses the steps above.
        run: |
          set +e
          python3 tools/ci/verify_r13_receipts.py \
            --p1 "$ARTIFACT_DIR/tests/receipts/r13_p1_receipt.json" \
            --p2 "$ARTIFACT_DIR/tests/receipts/r13_p2_receipt.json" \
            --summary "$ARTIFACT_DIR/r13_two_process_summary.json"
          rc=$?
          set -e
          if [ -f "$ARTIFACT_DIR/r13_two_process_summary.json" ]; then
            # Notices are readable through the check-run annotation API even
            # when the raw job log is not retrievable.
            python3 tools/ci/r13_receipt_notices.py || true
          fi
          exit $rc
      - name: R13 single-process negative controls (forgery, wear, cooldown, I/O, reset)
        run: |
          set +e
          A3_TEST_ROLE= \
          SOUL_OF_HERO_SAVE_PATH="user://tests/r13_value_economy_single.json" \
          A3_RECEIPT_DIR="$PWD/$ARTIFACT_DIR/tests/receipts" \
          timeout --signal=TERM --kill-after=10s 180s godot --headless --path . \
            --user-data-dir "$ARTIFACT_DIR" \
            --script res://tests/survival/a3_value_economy_test.gd \
            >"$ARTIFACT_DIR/r13_single.log" 2>&1
          rc=$?
          set -e
          cat "$ARTIFACT_DIR/r13_single.log"
          # The suite deliberately obstructs the atomic temporary write and then
          # repairs it, so the SaveService failure line is EXPECTED. Gate a copy
          # with exactly that line removed (same convention as the V5/V6 steps),
          # never a blanket filter, and prove the control actually fired.
          if ! grep -qE '^ERROR: SaveService: Could not write the temporary save file[.]$' \
              "$ARTIFACT_DIR/r13_single.log"; then
            echo "::error::R13 single-process: the obstructed-write negative control never fired"
            exit 1
          fi
          grep -vE '^(USER )?ERROR: SaveService: Could not write the temporary save file[.]$' \
            "$ARTIFACT_DIR/r13_single.log" > "$ARTIFACT_DIR/r13_single.gate.log"
          # Gate FIRST so its summary and engine-error annotations survive the
          # per-step annotation cap; detail follows only when it fails.
          # Exit-code obligation for the negative suite too. The gate copy is
          # passed on purpose: it is the raw log with exactly the deliberately
          # obstructed save write removed, so an intentional failed transaction
          # is never counted as a broken engine, and no other line is filtered.
          exit_rc=0
          python3 tools/ci/godot_exit_gate.py \
            --phase "R13 single-process" --rc "$rc" --log "$ARTIFACT_DIR/r13_single.gate.log" || exit_rc=$?
          gate_rc=0
          bash tools/ci/gate_log.sh "$ARTIFACT_DIR/r13_single.gate.log" "R13 single-process" "R13 NATIVE PASSED" || gate_rc=$?
          if [ "$exit_rc" -ne 0 ] || [ "$gate_rc" -ne 0 ]; then
            if grep -q '^\[FAIL\]' "$ARTIFACT_DIR/r13_single.log"; then
              grep '^\[FAIL\]' "$ARTIFACT_DIR/r13_single.log" | head -3 | while IFS= read -r line; do
                echo "::error::R13 assertion ${line}"
              done
            fi
            echo "::error::R13 single-process engine exit $rc, exit gate $exit_rc, log gate $gate_rc"
            exit 1
          fi
          summary="$(grep 'R13 NATIVE PASSED' "$ARTIFACT_DIR/r13_single.log" | tail -1)"
          echo "::notice title=R13 single-process negatives::${summary}"
          echo "$summary" >> "$GITHUB_STEP_SUMMARY"
          exit 0
      - name: Record R13 SHA and evidence
        if: always()
        run: |
          echo "R13 SHA: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "R13 suite: tests/survival/a3_value_economy_test.gd" >> "$GITHUB_STEP_SUMMARY"
          echo "R13 receipts: $ARTIFACT_DIR/tests/receipts" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r13-value-economy
          path: artifacts/r13-value-economy/
