name: Survival A3 Economy Validation

on:
  push:
    branches: [arena/7a12b27e-soul-of-hero]
    paths:
      - '.github/workflows/survival-a3-economy.yml'
      - 'data/survival/items/**'
      - 'data/survival/recipes/**'
      - 'game/survival/economy/**'
      - 'tools/survival/economy/**'
      - 'tests/survival/catalog/**'
      - 'docs/survival/economy/**'
  pull_request:
    branches: [feature/survival-rpg-foundation-20261029]
    paths:
      - '.github/workflows/survival-a3-economy.yml'
      - 'data/survival/items/**'
      - 'data/survival/recipes/**'
      - 'game/survival/economy/**'
      - 'tools/survival/economy/**'
      - 'tests/survival/catalog/**'
      - 'docs/survival/economy/**'
  workflow_dispatch:

env:
  ARTIFACT_DIR: artifacts/a3-economy

jobs:
  contracts-and-balance:
    name: A3 CATALOG / BALANCE CONTRACTS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/survival/economy/requirements.txt
      - run: mkdir -p "$ARTIFACT_DIR"
      - name: Schema / reference / accessibility / conservation audit
        run: |
          python tools/survival/economy/validate_economy.py \
            --json "$ARTIFACT_DIR/validation_report.json" \
            --index "$ARTIFACT_DIR/reverse_index.json"
      - name: Adversarial catalog and balance-model tests
        run: python -m unittest discover -s tests/survival/catalog -p 'test_*.py' -v
      - name: Deterministic economic simulation
        run: python tools/survival/economy/simulate_economy.py --json "$ARTIFACT_DIR/balance_report.json"
      - name: Save-growth serialization model
        run: python tools/survival/economy/measure_save_growth.py --json "$ARTIFACT_DIR/save_growth_report.json"
      - name: Product-facing progression/scarcity model (separate from conservation fixture)
        run: |
          python tools/survival/economy/model_progression.py --json "$ARTIFACT_DIR/progression_report.json"
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          r = json.load(open(os.environ['ARTIFACT_DIR'] + '/progression_report.json'))
          b = r['baseline']
          print('### A3 product progression model (SIMULATION_ONLY)')
          print(f"Baseline: Ember discovery session {b['firsts'].get('discovery:core_ember')}, Frost {b['firsts'].get('discovery:core_frost')}, Ember manufacture {b['firsts'].get('manufacture:core_ember')}.")
          print(f"Remaining late goals: {b['remaining_late_goal_count']}; native casts executed: {b['summary']['native_casts_executed']}.")
          t = b['time_accounting']
          print(f"Time accounting: {t['status']}; active {t['active_modeled_seconds']}s / budget {t['scheduled_budget_seconds']}s; unused {t['unused_budget_seconds']}s; station work {t['station_work_seconds']}s (overlaps active).")
          print(f"Scenarios: {len(r['scenarios'])}; A1 source adoption: {', '.join(b['source_adoption']['adopted'])}; rejected global aliases remain blocked.")
          PY
      - name: V5 first-hour pacing lower-bound model (not a playtest)
        run: |
          python tools/survival/economy/progression_v5.py --json "$ARTIFACT_DIR/progression_v5.json"
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          r = json.load(open(os.environ['ARTIFACT_DIR'] + '/progression_v5.json'))
          print('### A3 V5 pacing model (MODEL_ONLY, not human playtest)')
          for name, s in r['scenarios'].items():
              m = s['milestones']
              print(f"- {name}: 20m lower bound {m['20_min']['lower_bound_seconds']}s; 90m lower bound {m['90_min']['lower_bound_seconds']}s; cache wait {s['cache_active_wait_seconds']}s; tool effect {s['tool_effect_status']}.")
          PY
      - name: V7 deterministic 336h two-layer economy model (not a playtest)
        run: |
          python tools/survival/economy/model_meta_economy.py --json "$ARTIFACT_DIR/meta_balance_report.json"
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          r = json.load(open(os.environ['ARTIFACT_DIR'] + '/meta_balance_report.json'))
          print('### A3 V7 meta-economy model (AI_TUNABLE, NOT_HUMAN_PLAYTEST)')
          for s in r['baseline']:
              print(f"- {s['strategy']}: banked {s['expected_banked_currency']}, meals {s['meals_affordable_next_run']}, power {s['run_local_power_proxy']}, core proxy {s['rare_core_discovery_probability_proxy']}.")
          print(f"Universal dominance: {r['universally_dominant_strategies']}.")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a3-economy-contracts
          path: artifacts/a3-economy/

  native-adapter:
    name: A3 NATIVE SAVE ADAPTER
    needs: contracts-and-balance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.0
          use-dotnet: false
          include-templates: false
      - run: mkdir -p "$ARTIFACT_DIR"
      - name: Import project (real engine parser)
        run: |
          timeout --signal=TERM --kill-after=10s 240s godot --headless --path . \
            --user-data-dir artifacts/a3-import --import >"$ARTIFACT_DIR/import.log" 2>&1
          rc=$?
          tail -60 "$ARTIFACT_DIR/import.log"
          bash tools/ci/gate_log.sh "$ARTIFACT_DIR/import.log" "A3 import" || exit $rc
          exit $rc
      - name: Economy adapter against real SaveService
        run: |
          set +e
          timeout --signal=TERM --kill-after=10s 300s godot --headless --path . \
            --user-data-dir artifacts/a3-runtime \
            --script res://tests/survival/catalog/economy_adapter_test.gd \
            >"$ARTIFACT_DIR/adapter.log" 2>&1
          rc=$?
          set -e
          cat "$ARTIFACT_DIR/adapter.log"
          # The V5 failed-save oracle intentionally obstructs the temporary write.
          # Keep the full negative log in the artifact; gate the expected I/O line
          # by name so it cannot mask unrelated script/engine errors.
          grep -vE '^ERROR: SaveService: Could not write the temporary save file\.$' "$ARTIFACT_DIR/adapter.log" > "$ARTIFACT_DIR/adapter.gate.log"
          bash tools/ci/gate_log.sh "$ARTIFACT_DIR/adapter.gate.log" "A3 adapter" "A3 ECONOMY ADAPTER PASSED"
          if [ "$rc" -eq 0 ]; then
            summary="$(grep 'A3 ECONOMY ADAPTER PASSED' "$ARTIFACT_DIR/adapter.log" | tail -1)"
            echo "::notice title=A3 native adapter::$summary"
            echo "$summary" >> "$GITHUB_STEP_SUMMARY"
            grep 'A3_NATIVE_SAVE_GROWTH' "$ARTIFACT_DIR/adapter.log" | tail -1 >> "$GITHUB_STEP_SUMMARY" || true
          fi
          exit $rc
      - name: World cooldown / receipt across two OS processes
        run: |
          set +e
          A3_RESTART_PHASE=1 timeout --signal=TERM --kill-after=10s 120s godot --headless --path . \
            --user-data-dir artifacts/a3-runtime \
            --script res://tests/survival/catalog/economy_world_restart_test.gd \
            >"$ARTIFACT_DIR/restart_phase1.log" 2>&1
          rc1=$?
          A3_RESTART_PHASE=2 timeout --signal=TERM --kill-after=10s 120s godot --headless --path . \
            --user-data-dir artifacts/a3-runtime \
            --script res://tests/survival/catalog/economy_world_restart_test.gd \
            >"$ARTIFACT_DIR/restart_phase2.log" 2>&1
          rc2=$?
          set -e
          cat "$ARTIFACT_DIR/restart_phase1.log" "$ARTIFACT_DIR/restart_phase2.log"
          bash tools/ci/gate_log.sh "$ARTIFACT_DIR/restart_phase1.log" "A3 restart phase1" "A3 WORLD RESTART PHASE 1 PASSED"
          bash tools/ci/gate_log.sh "$ARTIFACT_DIR/restart_phase2.log" "A3 restart phase2" "A3 WORLD RESTART PHASE 2 PASSED"
          if [ "$rc1" -ne 0 ] || [ "$rc2" -ne 0 ]; then exit 1; fi
          echo "A3 two-process world restart PASSED" >> "$GITHUB_STEP_SUMMARY"
      - name: V6 prepared offline operations against real SaveService
        run: |
          set +e
          timeout --signal=TERM --kill-after=10s 300s godot --headless --path . \
            --user-data-dir artifacts/a3-runtime \
            --script res://tests/survival/catalog/economy_offline_test.gd \
            >"$ARTIFACT_DIR/offline.log" 2>&1
          rc=$?
          set -e
          cat "$ARTIFACT_DIR/offline.log"
          # The crash/replay case intentionally obstructs the temporary write.
          grep -vE '^ERROR: SaveService: Could not write the temporary save file\.$' "$ARTIFACT_DIR/offline.log" > "$ARTIFACT_DIR/offline.gate.log"
          bash tools/ci/gate_log.sh "$ARTIFACT_DIR/offline.gate.log" "A3 offline" "A3 OFFLINE OPERATIONS PASSED"
          if [ "$rc" -eq 0 ]; then
            grep 'A3 OFFLINE OPERATIONS PASSED' "$ARTIFACT_DIR/offline.log" | tail -1 >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $rc
      - name: V6 prepared offline settlement across two OS processes
        run: |
          set +e
          A3_OFFLINE_RESTART_PHASE=1 timeout --signal=TERM --kill-after=10s 120s godot --headless --path . \
            --user-data-dir artifacts/a3-runtime \
            --script res://tests/survival/catalog/economy_offline_restart_test.gd \
            >"$ARTIFACT_DIR/offline_restart_phase1.log" 2>&1
          rc1=$?
          A3_OFFLINE_RESTART_PHASE=2 timeout --signal=TERM --kill-after=10s 120s godot --headless --path . \
            --user-data-dir artifacts/a3-runtime \
            --script res://tests/survival/catalog/economy_offline_restart_test.gd \
            >"$ARTIFACT_DIR/offline_restart_phase2.log" 2>&1
          rc2=$?
          set -e
          cat "$ARTIFACT_DIR/offline_restart_phase1.log" "$ARTIFACT_DIR/offline_restart_phase2.log"
          bash tools/ci/gate_log.sh "$ARTIFACT_DIR/offline_restart_phase1.log" "A3 offline restart phase1" "A3 OFFLINE RESTART PHASE 1 PASSED"
          bash tools/ci/gate_log.sh "$ARTIFACT_DIR/offline_restart_phase2.log" "A3 offline restart phase2" "A3 OFFLINE RESTART PHASE 2 PASSED"
          if [ "$rc1" -ne 0 ] || [ "$rc2" -ne 0 ]; then exit 1; fi
          echo "A3 two-process offline restart PASSED" >> "$GITHUB_STEP_SUMMARY"
      - name: V5 tool-use callable read-only plan / atomic candidate transform
        run: |
          set +e
          timeout --signal=TERM --kill-after=10s 120s godot --headless --path . \
            --user-data-dir artifacts/a3-runtime \
            --script res://tests/survival/catalog/economy_tool_use_test.gd \
            >"$ARTIFACT_DIR/tool_use.log" 2>&1
          rc=$?
          set -e
          cat "$ARTIFACT_DIR/tool_use.log"
          grep -vE '^ERROR: SaveService: Could not write the temporary save file\.$' "$ARTIFACT_DIR/tool_use.log" > "$ARTIFACT_DIR/tool_use.gate.log"
          bash tools/ci/gate_log.sh "$ARTIFACT_DIR/tool_use.gate.log" "A3 tool use" "A3 TOOL USE CALLABLE PASSED"
          if [ "$rc" -eq 0 ]; then
            grep 'A3 TOOL USE CALLABLE PASSED' "$ARTIFACT_DIR/tool_use.log" | tail -1 >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $rc
      - name: V7 two-layer meta-economy owner-contract candidate tests
        run: |
          set +e
          timeout --signal=TERM --kill-after=10s 300s godot --headless --path . \
            --user-data-dir artifacts/a3-runtime \
            --script res://tests/survival/catalog/economy_meta_test.gd \
            >"$ARTIFACT_DIR/meta.log" 2>&1
          rc=$?
          set -e
          cat "$ARTIFACT_DIR/meta.log"
          grep -vE '^ERROR: SaveService: Could not write the temporary save file\.$' "$ARTIFACT_DIR/meta.log" > "$ARTIFACT_DIR/meta.gate.log"
          bash tools/ci/gate_log.sh "$ARTIFACT_DIR/meta.gate.log" "A3 meta" "A3 META ECONOMY PASSED"
          if [ "$rc" -eq 0 ]; then
            grep 'A3 META ECONOMY PASSED' "$ARTIFACT_DIR/meta.log" | tail -1 >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $rc
      - name: V7 meta deposit/purchase across two OS processes
        run: |
          set +e
          A3_META_RESTART_PHASE=1 timeout --signal=TERM --kill-after=10s 120s godot --headless --path . \
            --user-data-dir artifacts/a3-runtime \
            --script res://tests/survival/catalog/economy_meta_restart_test.gd \
            >"$ARTIFACT_DIR/meta_restart_phase1.log" 2>&1
          rc1=$?
          A3_META_RESTART_PHASE=2 timeout --signal=TERM --kill-after=10s 120s godot --headless --path . \
            --user-data-dir artifacts/a3-runtime \
            --script res://tests/survival/catalog/economy_meta_restart_test.gd \
            >"$ARTIFACT_DIR/meta_restart_phase2.log" 2>&1
          rc2=$?
          set -e
          cat "$ARTIFACT_DIR/meta_restart_phase1.log" "$ARTIFACT_DIR/meta_restart_phase2.log"
          grep -vE '^ERROR: SaveService: Could not write the temporary save file\.$' "$ARTIFACT_DIR/meta_restart_phase2.log" > "$ARTIFACT_DIR/meta_restart_phase2.gate.log"
          bash tools/ci/gate_log.sh "$ARTIFACT_DIR/meta_restart_phase1.log" "A3 meta restart phase1" "A3 META RESTART PHASE 1 PASSED"
          bash tools/ci/gate_log.sh "$ARTIFACT_DIR/meta_restart_phase2.gate.log" "A3 meta restart phase2" "A3 META RESTART PHASE 2 PASSED"
          if [ "$rc1" -ne 0 ] || [ "$rc2" -ne 0 ]; then exit 1; fi
          echo "A3 two-process meta restart PASSED" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a3-economy-native
          path: artifacts/a3-economy/
