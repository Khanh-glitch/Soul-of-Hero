name: veyra-r4-browser
on:
  push:
    paths: ['world/**', 'tools/world/**', '.github/workflows/veyra-r3-browser.yml']
  workflow_dispatch:
jobs:
  spatial:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install pillow numpy
      - name: Rebuild world from GOLD
        run: |
          python tools/world/art_registry.py
          python tools/world/veyra_compile.py
      - name: Spatial + behavioural gates (fails the job when a mandatory gate is red)
        run: python tools/world/validate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: veyra-spatial-validation
          path: |
            docs/map_tower/SPATIAL_VALIDATION.json
            out/world_meta.json

  browser-capture:
    needs: spatial
    if: always()          # evidence is captured even when the spatial gate is red
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install pillow numpy
      - name: Rebuild world from GOLD (capture only; the spatial job owns the gate)
        run: |
          python tools/world/art_registry.py
          python tools/world/veyra_compile.py
      - name: Publish runtime assets
        run: |
          cp out/world.png out/world_meta.json out/minimap.png world/assets/
      - run: npm init -y >/dev/null 2>&1; npm i -D playwright@1.47.2
      - run: npx playwright install --with-deps chromium
      - name: Serve
        run: |
          python -m http.server 8011 --bind 127.0.0.1 --directory world &
          sleep 2
      - name: Capture (real Chromium, real input, canvas pixel checks)
        run: |
          mkdir -p docs/map_tower/evidence/browser
          node tools/world/browser_capture.mjs 2>&1 | tee docs/map_tower/evidence/browser/capture.log
          echo "commit ${GITHUB_SHA} run ${GITHUB_RUN_ID}" >> docs/map_tower/evidence/browser/capture.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: veyra-browser-evidence
          path: |
            docs/map_tower/evidence/browser/**
            docs/map_tower/SPATIAL_VALIDATION.json
            docs/map_tower/SPATIAL_VALIDATION.json
            out/world_meta.json

  godot-native-attempt:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Download Godot 4.7 (recorded attempt, no binaries are vendored)
        run: |
          set -x
          curl -fsSL -o godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip \
            | tee godot_download.log || echo "GODOT_DOWNLOAD_FAILED" >> "$GITHUB_STEP_SUMMARY"
          unzip -o godot.zip || echo "GODOT_UNZIP_FAILED" >> "$GITHUB_STEP_SUMMARY"
          chmod +x Godot_v4.7-stable_linux.x86_64 2>/dev/null || true
      - name: Version
        run: ./Godot_v4.7-stable_linux.x86_64 --version 2>&1 | tee godot_version.log || true
      - name: Headless import of the project (native, no proxy)
        run: timeout 420 ./Godot_v4.7-stable_linux.x86_64 --headless --path . --quit 2>&1 | tee godot_import.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: godot-native-attempt
          path: |
            godot_version.log
            godot_import.log
            godot_download.log

  godot-native-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Download Godot 4.7
        run: |
          set -euo pipefail
          curl -fsSL -o godot.zip https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
          unzip -o godot.zip >/dev/null
          chmod +x Godot_v4.7-stable_linux.x86_64
          ./Godot_v4.7-stable_linux.x86_64 --version | tee godot_version.log
      - name: Baseline import (R3 commit 63f6001b) — pre-existing errors
        run: |
          set -o pipefail
          git worktree add /tmp/baseline 63f6001b
          cd /tmp/baseline
          timeout 600 /home/user/Soul-of-Hero/Godot_v4.7-stable_linux.x86_64 --headless --path . --quit 2>&1 \
            | tee /tmp/baseline_import.log || echo "baseline exit=$?" >> /tmp/baseline_import.log
          grep -E "ERROR|SCRIPT ERROR|Failed" /tmp/baseline_import.log | sort | uniq -c | sort -rn > /tmp/baseline_errors.txt || true
      - name: Candidate import (this HEAD) — authoritative native gate
        run: |
          set -euo pipefail
          timeout 600 ./Godot_v4.7-stable_linux.x86_64 --headless --path . --quit > /tmp/candidate_import.log 2>&1 || {
            echo "GODOT_IMPORT_FAILED"; tail -60 /tmp/candidate_import.log; exit 1; }
          grep -E "ERROR|SCRIPT ERROR|Failed" /tmp/candidate_import.log | sort | uniq -c | sort -rn > /tmp/candidate_errors.txt || true
          echo "no ERROR lines: $( [ -s /tmp/candidate_errors.txt ] && echo NO || echo YES )"
      - name: Baseline vs candidate error diff
        run: |
          set -o pipefail
          echo "=== baseline (R3) ==="; cat /tmp/baseline_errors.txt || true
          echo "=== candidate (HEAD) ==="; cat /tmp/candidate_errors.txt || true
          comm -13 /tmp/baseline_errors.txt /tmp/candidate_errors.txt > /tmp/new_errors.txt || true
          echo "=== introduced by R5 ==="; cat /tmp/new_errors.txt
          if [ -s /tmp/new_errors.txt ]; then echo "REGRESSION: new native errors"; exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: godot-native-gate
          path: |
            /tmp/baseline_import.log
            /tmp/candidate_import.log
            /tmp/baseline_errors.txt
            /tmp/candidate_errors.txt
            /tmp/new_errors.txt
            godot_version.log
