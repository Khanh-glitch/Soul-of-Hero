name: Hero Library Godot QA

on:
  pull_request:
    paths:
      - "game/heroes/hero_library_catalog.gd"
      - "game/ui/screens/hub/tabs/components/hero_library_panel.gd"
      - "game/ui/screens/hub/tabs/components/hero_library_panel.tscn"
      - "tests/hero_library_coverage_test.gd"
      - "game/ui/screens/hub/tabs/arsenal_tab.gd"
      - "tests/hero_team_quicklook_test.gd"
      - "tests/hero_team_quicklook_runtime.gd"
      - "tests/hero_team_quicklook_runtime.tscn"
      - "game/ui/screens/hub/tabs/components/hero_team_quicklook.gd"
      - "game/ui/screens/hub/tabs/components/hero_equipment_preview.gd"
      - "tests/hero_equipment_preview_test.gd"
      - "tests/hero_skill_kit_matrix_test.gd"
      - "tests/hero_roster_visual_capture.gd"
      - "tests/hero_roster_visual_capture.tscn"
      - ".github/workflows/hero-library-godot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hero-library:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Install official Godot 4.7 Linux editor
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            "https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip" \
            --output /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          chmod +x /tmp/godot-bin/Godot_v4.7-stable_linux.x86_64
          /tmp/godot-bin/Godot_v4.7-stable_linux.x86_64 --version

      - name: Import project with actual Godot engine
        shell: bash
        run: |
          set -euo pipefail
          /tmp/godot-bin/Godot_v4.7-stable_linux.x86_64 \
            --headless --editor --path . --import 2>&1 | tee godot-import.log

      - name: Verify Hero Library profiles and scene navigation
        shell: bash
        run: |
          set -euo pipefail
          export SOUL_OF_HERO_SAVE_PATH="user://tests/hero_library_qa_ci.json"
          export LIVING_ARSENAL_SAVE_PATH="$SOUL_OF_HERO_SAVE_PATH"
          /tmp/godot-bin/Godot_v4.7-stable_linux.x86_64 \
            --headless --path . --script res://tests/hero_library_coverage_test.gd \
            2>&1 | tee hero-library-test.log
          grep -q "HERO LIBRARY COVERAGE TEST PASSED" hero-library-test.log
          if grep -Eq '^(SCRIPT ERROR|ERROR):' hero-library-test.log; then
            echo "Godot reported an engine/script error."
            exit 1
          fi

      - name: Verify focused Hero Roster quick-look
        shell: bash
        run: |
          set -euo pipefail
          export SOUL_OF_HERO_SAVE_PATH="user://tests/hero_team_quicklook_qa_ci.json"
          export LIVING_ARSENAL_SAVE_PATH="$SOUL_OF_HERO_SAVE_PATH"
          timeout --kill-after=5s 60s \
            /tmp/godot-bin/Godot_v4.7-stable_linux.x86_64 \
            --headless --path . --script res://tests/hero_team_quicklook_test.gd \
            2>&1 | tee hero-team-test.log
          grep -q "HERO TEAM QUICK LOOK TEST PASSED" hero-team-test.log
          if grep -Eq '^(SCRIPT ERROR|ERROR):' hero-team-test.log; then
            echo "Godot reported an engine/script error."
            exit 1
          fi

      - name: Verify actual Hero Roster scene with autoloads
        shell: bash
        run: |
          set -euo pipefail
          export SOUL_OF_HERO_SAVE_PATH="user://tests/hero_team_scene_qa_ci.json"
          export LIVING_ARSENAL_SAVE_PATH="$SOUL_OF_HERO_SAVE_PATH"
          timeout --kill-after=5s 45s \
            /tmp/godot-bin/Godot_v4.7-stable_linux.x86_64 \
            --headless --path . res://tests/hero_team_quicklook_runtime.tscn \
            2>&1 | tee hero-team-scene-test.log
          grep -q "HERO TEAM RUNTIME SCENE TEST PASSED" hero-team-scene-test.log
          if grep -Eq '^(SCRIPT ERROR|ERROR):' hero-team-scene-test.log; then
            echo "Godot reported an engine/script error."
            exit 1
          fi

      - name: Verify exact-instance weapon and gear what-if comparisons
        shell: bash
        run: |
          set -euo pipefail
          export SOUL_OF_HERO_SAVE_PATH="user://tests/hero_equipment_preview_qa_ci.json"
          export LIVING_ARSENAL_SAVE_PATH="$SOUL_OF_HERO_SAVE_PATH"
          timeout --kill-after=5s 60s \
            /tmp/godot-bin/Godot_v4.7-stable_linux.x86_64 \
            --headless --path . --script res://tests/hero_equipment_preview_test.gd \
            2>&1 | tee hero-equipment-preview-test.log
          grep -q "HERO EQUIPMENT PREVIEW TEST PASSED" hero-equipment-preview-test.log
          if grep -Eq '^(SCRIPT ERROR|ERROR):' hero-equipment-preview-test.log; then
            echo "Godot reported an engine/script error."
            exit 1
          fi

      - name: Validate four-Hero eight-rarity skill-kit matrix
        shell: bash
        run: |
          set -euo pipefail
          timeout --kill-after=5s 60s \
            /tmp/godot-bin/Godot_v4.7-stable_linux.x86_64 \
            --headless --path . --script res://tests/hero_skill_kit_matrix_test.gd \
            2>&1 | tee hero-skill-matrix-test.log
          grep -q "H2 SKILL MATRIX TEST PASSED" hero-skill-matrix-test.log
          if grep -Eq '^(SCRIPT ERROR|ERROR):' hero-skill-matrix-test.log; then
            echo "Godot reported a skill matrix script error."
            exit 1
          fi

      - name: Capture production Hero Roster at three viewports
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install --yes xvfb libgl1-mesa-dri > /dev/null
          mkdir -p .artifacts
          for dimensions in 640x360 847x437 1280x720; do
            width="${dimensions%x*}"
            height="${dimensions#*x}"
            export SOUL_OF_HERO_SAVE_PATH="user://tests/roster_visual_${dimensions}_${GITHUB_RUN_ID}.json"
            export LIVING_ARSENAL_SAVE_PATH="$SOUL_OF_HERO_SAVE_PATH"
            xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 \
              timeout --kill-after=5s 70s \
              /tmp/godot-bin/Godot_v4.7-stable_linux.x86_64 \
              --path . --audio-driver Dummy --rendering-method gl_compatibility --rendering-driver opengl3 \
              --resolution "$dimensions" res://tests/hero_roster_visual_capture.tscn \
              -- "--expected-width=$width" "--expected-height=$height" \
              2>&1 | tee "roster_visual_${dimensions}.log"
            grep -q "HERO ROSTER VISUAL CAPTURE PASSED: ${width}x${height}" "roster_visual_${dimensions}.log"
            if grep -Eq '^(SCRIPT ERROR|ERROR):' "roster_visual_${dimensions}.log"; then
              echo "Godot reported a capture or script error at $dimensions."
              exit 1
            fi
          done

      - name: Upload Godot logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hero-library-godot-qa
          path: |
            godot-import.log
            hero-library-test.log
            hero-team-test.log
            hero-team-scene-test.log
            hero-equipment-preview-test.log
            hero-skill-matrix-test.log
            roster_visual_*.log
            .artifacts/hero_roster_*.png
          if-no-files-found: error
          include-hidden-files: true
