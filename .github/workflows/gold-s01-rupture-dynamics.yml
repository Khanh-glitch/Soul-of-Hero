name: Gold S01 source rupture dynamics
on:
  push:
    branches: [feature/vfx-lab-gate0-20261027]
    paths:
      - '.github/workflows/gold-s01-rupture-dynamics.yml'
      - 'prototypes/gold_fidelity/gold_rupture_*'
      - 'prototypes/gold_fidelity/gold_fx_dynamics.gd'
      - 'prototypes/gold_fidelity/gold_source_wave_emitter.gd'
      - 'prototypes/gold_fidelity/tests/rupture_*'
      - 'prototypes/gold_fidelity/tests/isolated_wave_emitter_smoke.gd'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gold-rupture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.0
          use-dotnet: false
          include-templates: false
      - name: Native editor import
        shell: bash
        run: |
          set -euo pipefail
          timeout 120s godot --headless --editor --path . --import --quit 2>&1 | tee /tmp/gold-import.log
          if grep -e 'SCRIPT ERROR:' -e 'Parse Error:' /tmp/gold-import.log; then exit 1; fi
      - name: Gold original physics and wave timeline
        shell: bash
        run: |
          set -euo pipefail
          timeout 60s godot --headless --path . --script res://prototypes/gold_fidelity/tests/rupture_dynamics_smoke.gd 2>&1 | tee /tmp/gold-physics.log
          grep -F 'GOLD_RUPTURE_NATIVE: PASS' /tmp/gold-physics.log
          if grep -e 'SCRIPT ERROR:' -e 'Parse Error:' /tmp/gold-physics.log; then exit 1; fi
      - name: Gold original seeded 22-object emitter
        shell: bash
        run: |
          set -euo pipefail
          timeout 60s godot --headless --path . --script res://prototypes/gold_fidelity/tests/isolated_wave_emitter_smoke.gd 2>&1 | tee /tmp/gold-emitter.log
          grep -F 'GOLD_WAVE_EMITTER: PASS' /tmp/gold-emitter.log
          if grep -e 'SCRIPT ERROR:' -e 'Parse Error:' /tmp/gold-emitter.log; then exit 1; fi
      - name: Deterministic thirteen-wave propagation and 286 live objects
        shell: bash
        run: |
          set -euo pipefail
          timeout 60s godot --headless --path . --script res://prototypes/gold_fidelity/tests/rupture_sequence_smoke.gd 2>&1 | tee /tmp/gold-sequence.log
          grep -F 'GOLD_S01_SEQUENCE: PASS' /tmp/gold-sequence.log
          if grep -e 'SCRIPT ERROR:' -e 'Parse Error:' /tmp/gold-sequence.log; then exit 1; fi
