# Recheck retained objects and textures after expanding #09's source raster.
name: ARCANA20 matched real-route retention diagnostic
on:
  workflow_dispatch:
  push:
    branches: [arena/c7b0c4e8-soul-of-hero]
    paths: ['.github/workflows/arcana20-r17-retention.yml']
permissions:
  contents: read
jobs:
  retention:
    strategy:
      fail-fast: false
      matrix:
        skill: [9]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Assemble exact owner composition and install test-only probe
        run: |
          set -euo pipefail
          git fetch --depth=1 --no-tags origin 04eacf62f1a3740a57e08691c3a9006d454aaa2c 6b801554a6af95424b4e39dd29f43c146aa13848 2cb1a3c5f093724eb9fecbdf45909ccb611f7b32 18e7afcbd576bbd9bfbcc509b2ee13216186a522 e505173edd119fdd955cf6249511b575a5468440
          python3 tools/arcana20_join/assemble.py --out "$RUNNER_TEMP/r17" --avfx-sha "$GITHUB_SHA" --a0-sha 04eacf62f1a3740a57e08691c3a9006d454aaa2c
          cp tools/arcana20_join/retention_probe.gd "$RUNNER_TEMP/r17/prototypes/arcana_fusion20/renderer/playtest/arcana20_retention_probe.gd"
          python3 - "$RUNNER_TEMP/r17" <<'PY'
          import pathlib,sys
          p=pathlib.Path(sys.argv[1]); project=p/'project.godot'; s=project.read_text(); old='run/main_scene="res://game/app/app_root.tscn"'; assert old in s
          project.write_text(s.replace(old, 'run/main_scene="res://prototypes/arcana_fusion20/renderer/playtest/arcana20_playtest.tscn"'))
          wrapper=p/'prototypes/arcana_fusion20/renderer/playtest/arcana20_playtest.gd'; s=wrapper.read_text(); old='res://prototypes/arcana_fusion20/renderer/playtest/arcana20_live_capture.gd'; assert s.count(old)==1
          wrapper.write_text(s.replace(old,'res://prototypes/arcana_fusion20/renderer/playtest/arcana20_retention_probe.gd'))
          PY
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.0
          use-dotnet: false
          include-templates: false
      - name: Import and run matched fresh-process no-FX and FX probes
        env:
          AVFX_RETENTION_SKILL: ${{ matrix.skill }}
        run: |
          set -euo pipefail
          godot --headless --path "$RUNNER_TEMP/r17" --import > "$RUNNER_TEMP/import.log" 2>&1
          if grep -Eq 'SCRIPT ERROR:|Parse Error:' "$RUNNER_TEMP/import.log"; then grep -E 'SCRIPT ERROR:|Parse Error:' "$RUNNER_TEMP/import.log" | head -10 | while IFS= read -r line; do echo "::error title=RETENTION_IMPORT::$line"; done; exit 1; fi
          # The wrapper loads the probe dynamically, so import alone does not
          # compile it. Fail at the first compiler error instead of waiting for
          # the graphical capture's timeout.
          set +e
          godot --headless --path "$RUNNER_TEMP/r17" --check-only --script res://prototypes/arcana_fusion20/renderer/playtest/arcana20_retention_probe.gd > "$RUNNER_TEMP/probe-check.log" 2>&1
          check_status=$?
          set -e
          if [ "$check_status" -ne 0 ] || grep -Eq 'SCRIPT ERROR:|Parse Error:' "$RUNNER_TEMP/probe-check.log"; then tail -15 "$RUNNER_TEMP/probe-check.log" | while IFS= read -r line; do echo "::error title=RETENTION_COMPILE::$line"; done; exit 1; fi
          mkdir -p "$RUNNER_TEMP/results"
          for mode in nofx fx; do
            nofx=0; [ "$mode" != nofx ] || nofx=1
            mkdir -p "$RUNNER_TEMP/home-$mode" "$RUNNER_TEMP/data-$mode"
            set +e
            timeout --signal=TERM --kill-after=10s 1500s xvfb-run -a -s '-screen 0 1280x720x24' env HOME="$RUNNER_TEMP/home-$mode" XDG_DATA_HOME="$RUNNER_TEMP/data-$mode" LIBGL_ALWAYS_SOFTWARE=1 AVFX_RETENTION_NO_FX="$nofx" godot --path "$RUNNER_TEMP/r17" --audio-driver Dummy --rendering-method gl_compatibility --resolution 1280x720 --user-data-dir "$RUNNER_TEMP/user-$mode" -- --avfx-live-capture > "$RUNNER_TEMP/results/$mode.log" 2>&1
            status=$?
            set -e
            grep -E 'AVFX_RETENTION_|AVFX_LIVE_FAIL|SCRIPT ERROR:|Parse Error:' "$RUNNER_TEMP/results/$mode.log" | head -10 | while IFS= read -r line; do echo "::notice title=RETENTION_CAPTURE::$line"; done || true
            if [ "$status" -ne 0 ]; then tail -20 "$RUNNER_TEMP/results/$mode.log" | while IFS= read -r line; do echo "::error title=RETENTION_FAILURE::$line"; done; exit "$status"; fi
            grep -Fq AVFX_RETENTION_PASS "$RUNNER_TEMP/results/$mode.log"
            ! grep -Eq 'AVFX_LIVE_FAIL|AVFX_RETENTION_FAIL|SCRIPT ERROR:|Parse Error:' "$RUNNER_TEMP/results/$mode.log"
            # Each process has its own XDG_DATA_HOME; Godot may ignore the
            # supplied --user-data-dir, so search the existing isolated root.
            json=$(find "$RUNNER_TEMP/data-$mode" -name retention.json -print -quit)
            if [ -z "$json" ]; then echo "::error title=RETENTION_COLLECTION::missing $mode retention.json"; exit 1; fi
            cp "$json" "$RUNNER_TEMP/results/$mode.json"
          done
          python3 tools/arcana20_join/compare_retention.py "$RUNNER_TEMP/results/nofx.json" "$RUNNER_TEMP/results/fx.json" "$RUNNER_TEMP/results/comparison.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r17-retention-${{ matrix.skill }}
          path: ${{ runner.temp }}/results/
          if-no-files-found: warn
