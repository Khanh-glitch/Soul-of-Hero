name: Gold 93 Candidate Differential (unverified generators)

# Runs the tick-by-tick original-vs-native differential against UNREGISTERED
# candidate generators (prototypes/skill_readiness/native/venom/venom_candidates.gd).
# A shard's green/red is the differential's own verdict on that candidate only.
# Verified registry shards (venom-differential in gold-93-readiness-runtime.yml)
# are not touched by this workflow.

on:
  push:
    branches:
      - arena/c7b0c4e8-soul-of-hero
    paths:
      - 'prototypes/skill_readiness/native/venom/**'
      - 'prototypes/skill_readiness/tests/gold93_venom_differential_test.gd'
      - 'docs/vfx/skill_readiness/oracle/**'
      - '.github/workflows/gold-93-readiness-candidate-diff.yml'
  workflow_dispatch:
    inputs:
      skills:
        description: 'Candidate skill ids to diff (space separated, must be in venom_candidates.gd)'
        required: false
        default: '7 8'

permissions:
  contents: read

jobs:
  candidate-differential:
    name: 'Candidate Venomwright ${{ matrix.skill }} vs original oracle'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        skill: [7, 8]
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.0
          use-dotnet: false
          include-templates: false
      - name: Import project (candidate lane)
        shell: bash
        run: |
          set -euo pipefail
          timeout 1200s godot --headless --editor --path . --import --quit 2>&1 | tee /tmp/gold93-import.log
          if grep -E 'SCRIPT ERROR:|Parse Error:' /tmp/gold93-import.log; then
            echo "::error::Godot import reported script errors"
            exit 1
          fi
      - name: Candidate differential vs original oracle
        shell: bash
        run: |
          set -uo pipefail
          LOG=/tmp/gold93-candidate-diff-${{ matrix.skill }}.log
          timeout 2400s godot --headless --path . --script res://prototypes/skill_readiness/tests/gold93_venom_differential_test.gd -- --skill=${{ matrix.skill }} --candidates 2>&1 | tee "$LOG"
          STATUS=${PIPESTATUS[0]}
          {
            echo "### Candidate venomwright:${{ matrix.skill }} (UNREGISTERED)"
            echo '```'
            grep -E '"canonical"|"parity"|"first_divergent_tick"|"first_mismatch"|"hits_|"cues_|GOLD93_VENOM_DIFFERENTIAL' "$LOG" | tail -30 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$STATUS" != "0" ] || grep -q 'GOLD93_VENOM_DIFFERENTIAL: FAIL' "$LOG"; then
            echo "::error::[candidate-${{ matrix.skill }}] differential did not reach PASS (exit $STATUS)"
            while IFS= read -r line; do echo "::error::[candidate-${{ matrix.skill }}] $line"; done < <(grep -vE '^Godot Engine v' "$LOG" | grep -E 'FAIL|SCRIPT ERROR|Parse Error|first_|original|native|event' | sed -e 's/%/%25/g' | head -30)
            exit 1
          fi
          if ! grep -q 'GOLD93_VENOM_DIFFERENTIAL: PASS' "$LOG"; then
            echo "::error::[candidate-${{ matrix.skill }}] no PASS verdict recorded"
            exit 1
          fi
          echo "CANDIDATE_PARITY: PASS ${{ matrix.skill }}"
      - name: Upload candidate logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gold93-candidate-diff-${{ matrix.skill }}
          path: /tmp/gold93-candidate-diff-${{ matrix.skill }}.log
          if-no-files-found: warn
          retention-days: 14
