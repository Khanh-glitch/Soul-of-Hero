name: PA1 Building — Real Chromium Palette Evidence
on:
  push:
    # The feature branch is the review head; the Arena session branch carries the same commits and
    # must not silently lose its browser evidence.
    branches: [feature/pa1-building-ontology-20261113, arena/de604ab6-soul-of-hero]
    paths:
      - 'web/src/game/action-readiness.ts'
      - 'web/src/game/expedition-intel.ts'
      - 'web/src/game/recycler.ts'
      - 'web/src/game/recipe-migration.ts'
      - 'web/src/game/economic-audits-m5.ts'
      - 'web/src/game/balance.v1.json'
      - 'web/src/ui/panels.tsx'
      - 'web/src/ui/SurvivorScreen.tsx'
      - 'web/e2e/pa1-deploy-custody.mjs'
      - 'web/e2e/pa1-research-visible.mjs'
      - 'web/src/ui/panels.tsx'
      - 'web/src/game/qa-sandbox.ts'
      - 'web/src/ui/Title.tsx'
      - 'web/src/game/core.ts'
      - 'web/src/game/engine.ts'
      - 'web/src/game/persist.ts'
      - 'web/tests/pa1-building-ontology.test.ts'
      - 'docs/design/VEYRA_INDUSTRIAL_ECONOMY_DECISION_LEDGER_2026-11-12.md'
      - '.github/workflows/pa1-building-ontology.yml'
      - 'web/src/game/art.ts'
      - 'web/src/game/catalog.ts'
      - 'web/src/ui/BuildBar.tsx'
      - 'web/src/ui/panels.tsx'
      - 'web/src/ui/StationConsole.tsx'
      - 'web/src/ui/ResearchFamilies.tsx'
      - 'web/tests/pa1-research-console.test.tsx'
      - 'web/tests/pa1-research-visible-gate.test.ts'
      - 'web/src/ui/common.tsx'
      - 'web/src/ui/StationConsole.tsx'
      - 'web/src/ui/Game.tsx'
      - 'web/src/index.css'
      - 'web/e2e/pa1-building-palette.mjs'
      - 'web/tests/pa1-deploy-custody.test.ts'
      - '.github/workflows/pa1-building-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
  # The failure-report step below. Run logs live on blob storage that the offline sandbox cannot
  # reach, so the manifest is echoed onto the PR instead — a red CI run stays diagnosable without
  # anyone re-running it locally.
  pull-requests: write
jobs:
  real-build-palette:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install exact dependencies
        working-directory: web
        run: npm ci
      - name: Install Chromium
        working-directory: web
        run: npx --no-install playwright install --with-deps chromium
      - name: Build pinned Web
        working-directory: web
        run: npx --no-install vite build --config vite.http.config.ts
      - name: Serve pinned build
        working-directory: web
        run: |
          npx --no-install vite preview --config vite.http.config.ts --host 127.0.0.1 --port 4173 --strictPort > /tmp/pa1-preview.log 2>&1 &
          for attempt in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/pa1-preview.log
          exit 1
      - name: Real menu, Build palette clicks and screenshots
        working-directory: web
        env:
          BUILD_SHA: ${{ github.sha }}
          GAME_URL: http://127.0.0.1:4173/
        run: node e2e/pa1-building-palette.mjs
      # Separate step, deliberately not chained with &&: the geometry palette and the Deploy custody
      # screen are different claims, and a failure must say which one moved.
      - name: Real Deploy custody (pack, not ore) and research-family panel
        working-directory: web
        env:
          BUILD_SHA: ${{ github.sha }}
          GAME_URL: http://127.0.0.1:4173/
        run: node e2e/pa1-deploy-custody.mjs
      # The research half of PA1 is a UI claim, so it is not allowed to rest on a store test: this step
      # opens the family panel in the shipped build and fails if the panel cannot be reached or read.
      - name: Real Research Table panel, reached from the title screen
        working-directory: web
        env:
          BUILD_SHA: ${{ github.sha }}
          GAME_URL: http://127.0.0.1:4173/
        run: node e2e/pa1-research-visible.mjs
      # The manifest is the evidence, so the manifest is what gets read here — not a green exit code.
      # A run whose research block does not carry per-element frames at BOTH sizes is a run that never
      # proved legibility, which is precisely the claim Control Tower held this branch for.
      - name: Publish the visibility proof
        working-directory: web
        shell: bash
        run: |
          node -e '
            const fs=require("node:fs");
            const m=JSON.parse(fs.readFileSync(process.env.MANIFEST||"./evidence/pa1-research-visible/manifest.json","utf8"));
            const r=m.research||{};
            const bad=[];
            if(r.open!==true)bad.push("panel never opened");
            if(r.tabClicked!==true)bad.push("the Technology tab was never clicked");
            for(const k of ["frames1280","frames640"]){
              const f=r[k]||[];
              if(f.length<2)bad.push(k+" has no per-element frames");
              for(const e of f){ if(!e.fits||!e.visible||e.hitTest!=="inside-pane")bad.push(k+":"+e.label+" not readable " +JSON.stringify(e)); }
            }
            if((r.families||[]).length<11)bad.push("only "+(r.families||[]).length+" of 11 families read from the screen");
            if(!/cost recorded \(5 Spares \+ 2 Iron Ingot\)/.test(r.energyRow||""))bad.push("the ENERGY cost row is not in the captured text");
            if((r.leakCheck||[]).length!==3)bad.push("leak check did not cover all three tabs");
            if(r.purchaseControls&&(r.purchaseControls.pane||r.purchaseControls.energyRow))bad.push("an unapproved family presented a purchase control");
            const rows=(r.frames1280||[]).concat(r.frames640||[]).map(e=>"| "+e.label+" | "+e.box.x+","+e.box.y+" | "+e.box.w+"x"+e.box.h+" | "+(e.fits&&e.visible?"yes":"NO")+" |").join("\n");
            const shots=fs.readdirSync("./evidence/pa1-research-visible").filter(f=>f.endsWith(".png")).map(f=>"- `web/evidence/pa1-research-visible/"+f+"`").join("\n");
            const body=["## PA1 research panel — what the browser actually painted","",
              "| element | top-left | size | inside viewport |","|---|---|---|---|",rows,"",
              "families read from the screen: "+(r.families||[]).join(", "),"",
              "ENERGY row: `"+String(r.energyRow||"").slice(0,220)+"`","",
              "screenshots:",shots,"",
              bad.length?"**PROOF INCOMPLETE:** "+bad.join(" · "):"all frames inside the viewport at 1280x720 and 640x360",
            ].join("\n");
            console.log(body);
            if(process.env.GITHUB_STEP_SUMMARY)fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,body+"\n\n");
            if(bad.length)process.exit(1);
          '
      - name: Upload render evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pa1-build-palette-${{ github.sha }}-${{ github.run_attempt }}
          path: web/evidence/
          if-no-files-found: warn
          retention-days: 30
      - name: Print failure logs
        if: failure()
        run: cat /tmp/pa1-preview.log || true
      - name: Echo the evidence manifests onto the PR
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          PR=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/pulls" --jq '.[0].number // empty')
          # A run started from the session branch is not attached to a PR; fall back to the open PR so
          # the evidence is still readable from a branch-only run instead of vanishing into a skipped step.
          [ -n "$PR" ] || PR=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --json number --jq '.[0].number // empty')
          [ -n "$PR" ] || { echo "no PR to report on; skipping"; exit 0; }
          {
            echo "## PA1 browser evidence failed on \`$SHA\`"
            echo
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            for f in web/evidence/pa1-deploy-custody/manifest.json web/evidence/pa1-building-palette/manifest.json web/evidence/pa1-research-visible/manifest.json; do
              [ -f "$f" ] || continue
              echo; echo "\`\`\`json"; echo "// $f"; head -c 5000 "$f"; echo; echo "\`\`\`"
            done
          } > /tmp/pa1-evidence-failure.md
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file /tmp/pa1-evidence-failure.md
