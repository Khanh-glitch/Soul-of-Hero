name: PA1 Building Ontology — strict source / runtime acceptance
on:
  push:
    branches: [feature/pa1-building-ontology-20261113]
    paths:
      - 'web/src/game/art.ts'
      - 'web/src/game/core.ts'
      - 'web/src/game/persist.ts'
      - 'web/src/index.css'
      - 'docs/design/VEYRA_INDUSTRIAL_ECONOMY_DECISION_LEDGER_2026-11-12.md'
      - '.github/workflows/pa1-building-browser.yml'
      - 'web/src/game/catalog.ts'
      - 'web/src/game/engine.ts'
      - 'web/src/ui/BuildBar.tsx'
      - 'web/src/ui/panels.tsx'
      - 'web/src/ui/Game.tsx'
      - 'web/tests/pa1-building-ontology.test.ts'
      - 'web/tests/territory-cabinet.test.ts'
      - '.github/workflows/pa1-building-ontology.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pa1-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install pinned Web deps
        working-directory: web
        run: npm ci
      - name: Typecheck entire Web
        working-directory: web
        run: npx --no-install tsc --noEmit
      - name: PA1 device+building transaction tests
        working-directory: web
        run: npx --no-install vitest run --fileParallelism=false src/../tests/pa1-building-ontology.test.ts
      - name: Preexisting material and territory regression
        working-directory: web
        run: npx --no-install vitest run --fileParallelism=false tests/territory-cabinet.test.ts tests/progression.test.ts tests/m-core-03.test.ts
