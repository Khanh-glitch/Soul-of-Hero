name: Venomwright Glassfang original procedural actor pixel oracle
on:
  push:
    branches: [feature/gold-venom-arcana-factory-20261028]
    paths:
      - 'prototypes/gold_pair/venom_source_pixel_layer.gd'
      - 'prototypes/gold_pair/venom_source_fang.gd'
      - 'prototypes/gold_pair/venom_source_chain.gd'
      - 'prototypes/gold_pair/venom_source_fang_canvas.gd'
      - 'prototypes/gold_pair/tests/venom_fang_canvas_smoke.gd'
      - 'prototypes/gold_pair/tests/venom_fang_source_pixel_oracle.gd'
      - '.github/workflows/venom-gold-fang-pixels.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-fang-rgba-native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.0
          use-dotnet: false
          include-templates: false
      - name: Godot import and script parser inspection
        shell: bash
        run: |
          set -euo pipefail
          timeout 145s godot --headless --editor --path . --import --quit 2>&1 | tee /tmp/venom-fang-import.log
          if grep -E 'SCRIPT ERROR:|Parse Error:' /tmp/venom-fang-import.log; then exit 1; fi
      - name: Compare original source actor shadow/body/light RGBA
        shell: bash
        run: |
          set -euo pipefail
          timeout 115s godot --headless --path . --script res://prototypes/gold_pair/tests/venom_fang_source_pixel_oracle.gd 2>&1 | tee /tmp/venom-fang-pixels.log
          grep -F 'VENOM_FANG_PIXEL: PASS / 18' /tmp/venom-fang-pixels.log
          if grep -E 'SCRIPT ERROR:|Parse Error:' /tmp/venom-fang-pixels.log; then exit 1; fi
      - name: Verify source Fang RGBA three-pass native Canvas adapter
        shell: bash
        run: |
          set -euo pipefail
          timeout 90s godot --headless --path . --script res://prototypes/gold_pair/tests/venom_fang_canvas_smoke.gd 2>&1 | tee /tmp/venom-fang-canvas.log
          grep -F 'VENOM_FANG_CANVAS: PASS' /tmp/venom-fang-canvas.log
          if grep -E 'SCRIPT ERROR:|Parse Error:' /tmp/venom-fang-canvas.log; then exit 1; fi
