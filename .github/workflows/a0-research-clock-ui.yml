name: A0 research UI and active clock
on:
  push:
    branches: [arena/dea2428e-soul-of-hero]
    paths: ['tools/ci/godot_isolated.sh', 'game/survival/**', 'game/overworld/**', 'game/autoload/**', 'data/survival/**', 'tests/survival_research_clock_ui_test.gd', 'tests/survival_economy_session_test.gd', 'tests/survival_normal_home_journey_test.gd', 'tests/survival_normal_input_gather_test.gd', 'tests/survival_foundation_test.gd', '.github/workflows/a0-research-clock-ui.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.0
          use-dotnet: false
          include-templates: false
      - name: Import
        run: |
          mkdir -p artifacts/ud_import artifacts/ud_research
          timeout 180s bash tools/ci/godot_isolated.sh --headless --path . --user-data-dir artifacts/ud_import --import > artifacts/research-import.log 2>&1
      - name: Paid fixture station, physical pointer and 30Hz/120Hz clock
        shell: bash
        run: |
          set +e
          timeout --signal=TERM --kill-after=15s 900s xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 bash tools/ci/godot_isolated.sh --path . --rendering-method gl_compatibility --rendering-driver opengl3 --audio-driver Dummy --user-data-dir artifacts/ud_research --resolution 960x540 --windowed --script res://tests/survival_research_clock_ui_test.gd > artifacts/research-clock.log 2>&1
          rc=$?
          cat artifacts/research-clock.log
          echo "::notice::research exit=$rc $(grep -E 'A0 RESEARCH|RESEARCH_CLOCK_TRACE|  FAIL  |SCRIPT ERROR|Parse Error' artifacts/research-clock.log | tail -20 | tr '\n' '~')"
          bash tools/ci/gate_log.sh artifacts/research-clock.log 'research clock' 'A0 RESEARCH CLOCK UI PASSED'
          gate=$?
          [ "$rc" -eq 0 ] && [ "$gate" -eq 0 ]
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a0-research-clock-logs
          path: artifacts/research-*.log
          if-no-files-found: warn
