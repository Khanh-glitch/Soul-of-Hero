name: GP-B A0-A3 with A1-A8 authored world native integration
on:
  push:
    branches: [integration/gameplay-gpb-a3-20261101]
  workflow_dispatch:
permissions:
  contents: read
env:
  A1_SHA: ce9d4ba2d3db153011874aa41b789fa8092be042
  A8_SHA: 71e68f9c0b7844277139a489c316acea327699f9
  GODOT_SILENCE_ROOT_WARNING: "1"
  LIBGL_ALWAYS_SOFTWARE: "1"
jobs:
  authored-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compose owner-scoped Map and POI into isolated GP-B build
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$A1_SHA" "$A8_SHA"
          python3 tools/a0/compose_owners.py --repo . --out .gpb_composition --copy-base \
            --owner a1="$A1_SHA" --owner a8="$A8_SHA"
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('.gpb_composition')
          report=json.loads((root/'composition.json').read_text())
          print('GPB_COMPOSITION_AUDIT',json.dumps({
            'base':report['base']['sha'],
            'owners':{name:v['sha'] for name,v in report['owners'].items()},
            'conflicts':report['conflicts'],
            'out_of_scope':{name:len(v) for name,v in report['refused_out_of_scope'].items()}
          }))
          assert not report['conflicts'], report['conflicts']
          for path in (
            'game/survival/world/a1_authored_world_reader.gd',
            'game/survival/world/a1_authored_world_stream.gd',
            'data/survival/world/world_plan.v1.json',
            'game/survival/world_content/scripts/native_poi_site.gd',
            'game/survival/economy/economy_service.gd',
            'game/survival/economy/a3_economy_service.gd',
            'tests/survival_a0_authored_world_route_test.gd'
          ):
            assert (root/path).is_file(),f'GPB_MISSING_OWNER_SEAT:{path}'
          PY
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.0
          use-dotnet: false
          include-templates: false
      - name: Godot native parse and import of actual composed tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          set +e
          timeout --signal=TERM --kill-after=10s 300s godot --headless --path .gpb_composition --import > artifacts/import.log 2>&1
          rc=$?
          set -e
          tail -70 artifacts/import.log
          test "$rc" -eq 0
          ! grep -Ea 'SCRIPT ERROR|Parse Error|Compilation failed' artifacts/import.log
      - name: Authored world contract must be read, not skipped or degraded
        shell: bash
        run: |
          set -euo pipefail
          set +e
          timeout --signal=TERM --kill-after=10s 180s godot --headless --path .gpb_composition \
            --script res://tests/survival_a0_authored_world_contract_test.gd -- --require-authored > artifacts/authored-contract.log 2>&1
          rc=$?
          set -e
          tail -110 artifacts/authored-contract.log
          test "$rc" -eq 0
          grep -q 'A0 AUTHORED WORLD CONTRACT PASSED' artifacts/authored-contract.log
          ! grep -Ea 'SCRIPT ERROR|Parse Error|  FAIL  |A0_AUTHORED_WORLD_BLOCKED|A0_AUTHORED_WORLD_NOT_READ' artifacts/authored-contract.log
      - name: Production-controller stream probe must really mount A1
        shell: bash
        run: |
          set -euo pipefail
          set +e
          timeout --signal=TERM --kill-after=10s 180s godot --headless --path .gpb_composition \
            --script res://tests/survival_a0_authored_stream_test.gd > artifacts/stream.log 2>&1
          rc=$?
          set -e
          tail -110 artifacts/stream.log
          test "$rc" -eq 0
          grep -q 'A0 AUTHORED STREAM COMPONENT PROBE PASSED' artifacts/stream.log
          ! grep -Ea 'SCRIPT ERROR|Parse Error|  FAIL  |NOT_APPLICABLE|BLOCKED' artifacts/stream.log
      - name: Publish source composition and native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpb-authored-map-evidence
          path: |
            artifacts/
            .gpb_composition/composition.json
            .gpb_composition/CONFLICTS.md
