name: SOH Veyra Westmouth Spawn Rejection Reasons
on:
  push:
    branches: [design/veyra-industrial-economy-20261112]
    paths:
      - 'web/src/veyra05/spawn-candidate-reasons.audit.test.ts'
      - '.github/workflows/veyra-spawn-reasons-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate-root-cause:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: true
      SOH_SPAWN_REASON_AUDIT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install exact dependencies
        working-directory: web
        run: npm ci
      - name: Trace exact 706 Westmouth candidates and sampled control windows
        working-directory: web
        run: npx --no-install vitest run --fileParallelism=false --testTimeout=600000 src/veyra05/spawn-candidate-reasons.audit.test.ts
      - name: Print rejection counts
        if: always()
        working-directory: web
        run: |
          if [ -s evidence/veyra-spawn-reasons/manifest.json ]; then
            node -e "const x=require('./evidence/veyra-spawn-reasons/manifest.json'); console.log(JSON.stringify(x.records.map(r=>({name:r.name,normal:r.normalStart,prefilter:r.prefilter,evaluated:r.candidatesEvaluated,steps:r.candidateStageCounts,fail:r.missingCombinationCounts,diagnosticUnavailable:r.diagnosticUnavailable})),null,2));"
          else
            echo '::error title=Missing diagnostic::No manifest produced'
          fi
      - name: Upload evidence regardless of verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veyra-spawn-reasons-${{ github.sha }}-${{ github.run_attempt }}
          path: web/evidence/veyra-spawn-reasons/
          if-no-files-found: warn
          retention-days: 30
