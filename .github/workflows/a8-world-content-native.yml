name: A8 native world-content pilot

on:
  pull_request:
    branches: ['feature/survival-rpg-foundation-20261029']
    paths:
      - 'game/survival/world_content/**'
      - 'data/survival/world_content/**'
      - 'tests/survival/world_content/**'
      - 'tools/survival/world_content/**'
      - 'docs/survival/world_content/**'
      - '.github/workflows/a8-world-content-native.yml'
jobs:
  godot-native:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Prepare A8 evidence directory
        run: mkdir -p .artifacts/a8-world-content
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.0
          use-dotnet: false
          include-templates: false
      - name: Validate authoring data and adversarial path cases
        run: |
          python3 tools/survival/world_content/author_site.py --check
          python3 -m unittest discover -s tests/survival/world_content -p 'test_*.py'
      - name: Import native project resources
        run: |
          set +e
          godot --headless --path . --editor --quit > .artifacts/a8-world-content/import.log 2>&1
          status=$?
          set -e
          cat .artifacts/a8-world-content/import.log
          if [ "$status" -ne 0 ]; then
            { echo '### A8 Godot import failure'; echo '```text'; tail -n 100 .artifacts/a8-world-content/import.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"
      - name: Run native physics and interaction contracts
        id: native_contract
        continue-on-error: true
        run: |
          set +e
          godot --headless --path . --script tests/survival/world_content/native_poi_contract_test.gd > .artifacts/a8-world-content/native-contract.log 2>&1
          status=$?
          set -e
          cat .artifacts/a8-world-content/native-contract.log
          if [ "$status" -ne 0 ]; then
            { echo '### A8 native contract failure'; echo '```text'; tail -n 100 .artifacts/a8-world-content/native-contract.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"
      - name: Run exterior entry, return and revisit physics
        id: native_transition
        if: always()
        continue-on-error: true
        run: |
          set +e
          godot --headless --path . --script tests/survival/world_content/native_poi_transition_test.gd > .artifacts/a8-world-content/native-transition.log 2>&1
          status=$?
          set -e
          cat .artifacts/a8-world-content/native-transition.log
          if [ "$status" -ne 0 ]; then
            { echo '### A8 transition failure'; echo '```text'; tail -n 100 .artifacts/a8-world-content/native-transition.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"
      - name: Run frame-driven journeys and capture the three current POIs
        id: native_input_journey
        if: always()
        continue-on-error: true
        run: |
          set +e
          status=0
          : > .artifacts/a8-world-content/native-input-journeys.log
          for size in 1280x720 2560x1440 3840x2160; do
            SOH_A8_CAPTURE_SUBDIR="$size" xvfb-run -a godot --path . --resolution "$size" \
              --rendering-method gl_compatibility \
              --script tests/survival/world_content/native_poi_input_journey_test.gd \
              > ".artifacts/a8-world-content/native-input-journeys-${size}.log" 2>&1
            run_status=$?
            cat ".artifacts/a8-world-content/native-input-journeys-${size}.log"
            cat ".artifacts/a8-world-content/native-input-journeys-${size}.log" >> .artifacts/a8-world-content/native-input-journeys.log
            if [ "$run_status" -ne 0 ]; then
              status=$run_status
              {
                echo "resolution=${size}"
                grep -E 'A8_POINT|ERROR: Assertion failed|A8_NATIVE_POI_INPUT_JOURNEY_(PASS|FAIL)' ".artifacts/a8-world-content/native-input-journeys-${size}.log" || true
              } >> .artifacts/a8-world-content/input-journey-failures.log
            fi
          done
          set -e
          if [ "$status" -ne 0 ]; then
            { echo '### A8 input-journey failure'; echo '```text'; tail -n 140 .artifacts/a8-world-content/input-journey-failures.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"
      - name: Run source-backed visual state and context presentation contract
        id: native_visual_presentation
        if: always()
        continue-on-error: true
        run: |
          set +e
          godot --headless --path . --script tests/survival/world_content/native_poi_visual_presentation_test.gd > .artifacts/a8-world-content/native-visual-presentation.log 2>&1
          status=$?
          set -e
          cat .artifacts/a8-world-content/native-visual-presentation.log
          if [ "$status" -ne 0 ]; then
            { echo '### A8 visual-presentation failure'; echo '```text'; tail -n 120 .artifacts/a8-world-content/native-visual-presentation.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"
      - name: Run native surface and owner-only reset contract
        id: native_surface
        if: always()
        continue-on-error: true
        run: |
          set +e
          godot --headless --path . --script tests/survival/world_content/native_poi_surface_contract_test.gd > .artifacts/a8-world-content/native-surface.log 2>&1
          status=$?
          set -e
          cat .artifacts/a8-world-content/native-surface.log
          exit "$status"
      - name: Run owner-projected Ragnarok route and endpoint physics contracts
        id: native_ragnarok
        if: always()
        continue-on-error: true
        run: |
          set +e
          godot --headless --path . --script tests/survival/world_content/native_poi_ragnarok_test.gd > .artifacts/a8-world-content/native-ragnarok.log 2>&1
          status=$?
          set -e
          cat .artifacts/a8-world-content/native-ragnarok.log
          if [ "$status" -ne 0 ]; then
            { echo '### A8 Ragnarok phase/endpoint failure'; echo '```text'; tail -n 120 .artifacts/a8-world-content/native-ragnarok.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"
      - name: Capture native scenes at 720p, 2K and 4K
        id: native_capture
        if: always()
        continue-on-error: true
        run: |
          mkdir -p .artifacts/a8-world-content
          for size in 1280x720 2560x1440 3840x2160; do
            width=${size%x*}
            height=${size#*x}
            xvfb-run -a godot --path . --resolution "$size" \
              --rendering-method gl_compatibility \
              --script tools/survival/world_content/capture_native_pilot.gd -- \
              --width="$width" --height="$height" \
              --output=".artifacts/a8-world-content/pilot-${size}.png"
          done
      - name: Publish concise native test failure excerpts
        if: always()
        continue-on-error: true
        env:
          NATIVE_CONTRACT_OUTCOME: ${{ steps.native_contract.outcome }}
          NATIVE_TRANSITION_OUTCOME: ${{ steps.native_transition.outcome }}
          NATIVE_INPUT_JOURNEY_OUTCOME: ${{ steps.native_input_journey.outcome }}
          NATIVE_VISUAL_PRESENTATION_OUTCOME: ${{ steps.native_visual_presentation.outcome }}
          NATIVE_SURFACE_OUTCOME: ${{ steps.native_surface.outcome }}
          NATIVE_RAGNAROK_OUTCOME: ${{ steps.native_ragnarok.outcome }}
        run: |
          publish_excerpt() {
            outcome="$1"
            label="$2"
            log_path="$3"
            if [ "$outcome" != success ] && [ -f "$log_path" ]; then
              if [ "$label" = input-journey ]; then
                excerpt="$(grep -E 'A8_POINT|ERROR: Assertion failed:|A8_NATIVE_POI_INPUT_JOURNEY_(PASS|FAIL)' "$log_path" | tail -n 80 | tr '\n' ' ' | tail -c 5000)"
              else
                excerpt="$(grep -E 'ERROR: Assertion failed:|SCRIPT ERROR:|A8_HERO_AXIS_RESULT|A8_HERO_ROUTE_MEASURE' "$log_path" | tail -n 60 | tr '\n' ' ' | tail -c 5000)"
              fi
              echo "::warning title=A8 ${label} failure excerpt::${excerpt}"
            fi
          }
          publish_excerpt "$NATIVE_CONTRACT_OUTCOME" "contract" .artifacts/a8-world-content/native-contract.log
          publish_excerpt "$NATIVE_TRANSITION_OUTCOME" "transition" .artifacts/a8-world-content/native-transition.log
          publish_excerpt "$NATIVE_INPUT_JOURNEY_OUTCOME" "input-journey" .artifacts/a8-world-content/native-input-journeys.log
          publish_excerpt "$NATIVE_VISUAL_PRESENTATION_OUTCOME" "visual-presentation" .artifacts/a8-world-content/native-visual-presentation.log
          publish_excerpt "$NATIVE_SURFACE_OUTCOME" "surface" .artifacts/a8-world-content/native-surface.log
          publish_excerpt "$NATIVE_RAGNAROK_OUTCOME" "ragnarok" .artifacts/a8-world-content/native-ragnarok.log
      - name: Require all native evidence steps to pass
        if: always()
        env:
          NATIVE_CONTRACT_OUTCOME: ${{ steps.native_contract.outcome }}
          NATIVE_TRANSITION_OUTCOME: ${{ steps.native_transition.outcome }}
          NATIVE_INPUT_JOURNEY_OUTCOME: ${{ steps.native_input_journey.outcome }}
          NATIVE_VISUAL_PRESENTATION_OUTCOME: ${{ steps.native_visual_presentation.outcome }}
          NATIVE_SURFACE_OUTCOME: ${{ steps.native_surface.outcome }}
          NATIVE_RAGNAROK_OUTCOME: ${{ steps.native_ragnarok.outcome }}
          NATIVE_CAPTURE_OUTCOME: ${{ steps.native_capture.outcome }}
        run: |
          outcome_report="contract=$NATIVE_CONTRACT_OUTCOME transition=$NATIVE_TRANSITION_OUTCOME input_journey=$NATIVE_INPUT_JOURNEY_OUTCOME visual_presentation=$NATIVE_VISUAL_PRESENTATION_OUTCOME surface=$NATIVE_SURFACE_OUTCOME ragnarok=$NATIVE_RAGNAROK_OUTCOME capture=$NATIVE_CAPTURE_OUTCOME"
          printf '%s\n' "$outcome_report" | tee .artifacts/a8-world-content/outcomes.txt
          {
            echo '### A8 native evidence outcomes'
            echo
            echo "\`\`\`text"
            echo "$outcome_report"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$NATIVE_CONTRACT_OUTCOME" != success ] || \
            [ "$NATIVE_TRANSITION_OUTCOME" != success ] || \
            [ "$NATIVE_INPUT_JOURNEY_OUTCOME" != success ] || \
            [ "$NATIVE_VISUAL_PRESENTATION_OUTCOME" != success ] || \
            [ "$NATIVE_SURFACE_OUTCOME" != success ] || \
            [ "$NATIVE_RAGNAROK_OUTCOME" != success ] || \
            [ "$NATIVE_CAPTURE_OUTCOME" != success ]; then
            echo "::error title=A8 native evidence outcomes::$outcome_report"
          fi
          test "$NATIVE_CONTRACT_OUTCOME" = success
          test "$NATIVE_TRANSITION_OUTCOME" = success
          test "$NATIVE_INPUT_JOURNEY_OUTCOME" = success
          test "$NATIVE_VISUAL_PRESENTATION_OUTCOME" = success
          test "$NATIVE_SURFACE_OUTCOME" = success
          test "$NATIVE_RAGNAROK_OUTCOME" = success
          test "$NATIVE_CAPTURE_OUTCOME" = success
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a8-native-world-content-evidence
          path: .artifacts/a8-world-content/
          if-no-files-found: warn
          retention-days: 14
