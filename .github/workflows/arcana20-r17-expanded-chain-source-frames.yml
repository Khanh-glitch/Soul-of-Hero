name: ARCANA20 expanded chain C versus native full field frames
on:
  workflow_dispatch:
  push:
    branches: [arena/c7b0c4e8-soul-of-hero]
    paths: ['.github/workflows/arcana20-r17-expanded-chain-source-frames.yml']
permissions:
  actions: read
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        light: [normal, dimmed]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: r17-expanded-full-9-${{ matrix.light }}
          run-id: 41313738760
          github-token: ${{ github.token }}
          path: capture
      - run: python3 -m pip install --quiet numpy pillow
      - name: Opening full fields
        run: python3 tools/arcana20_source_compare/surface_c09_wide.py capture 87
      - name: Development full fields
        run: python3 tools/arcana20_source_compare/surface_c09_wide.py capture 183
      - name: Midpoint full fields
        run: python3 tools/arcana20_source_compare/surface_c09_wide.py capture 247
      - name: Cascade full fields
        run: python3 tools/arcana20_source_compare/surface_c09_wide.py capture 327
