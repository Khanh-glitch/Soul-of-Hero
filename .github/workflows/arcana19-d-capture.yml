name: ARCANA 19 - D HTML reference capture (browser/WebGL)

on:
  workflow_dispatch:
  push:
    branches: [arena/c7b0c4e8-soul-of-hero]
    paths:
      - 'tools/arcana19_d_capture/**'
      - '.github/workflows/arcana19-d-capture.yml'

permissions:
  contents: read

jobs:
  d-capture:
    name: Capture Constellation Engine frames from original D HTML
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright Chromium
        working-directory: tools/arcana19_d_capture
        run: |
          npm install
          npx playwright install --with-deps chromium
      - name: Capture reference frames (deterministic virtual 60 Hz clock)
        working-directory: tools/arcana19_d_capture
        run: node capture.mjs
      - name: Upload browser source evidence (not SOH compositing)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arcana19-d-browser-evidence
          path: prototypes/arcana_fusion20/renderer/evidence_out/d-browser/
          if-no-files-found: error
