name: ARCANA20 isolated source-field quick diagnostic
on:
  workflow_dispatch:
    inputs:
      r31_lab:
        description: Build only the offline R31 visual direction lab from tracked captures
        type: boolean
        default: false
  push:
    branches: [arena/c7b0c4e8-soul-of-hero]
    paths:
      - 'prototypes/arcana_fusion20/renderer/**'
      - '!prototypes/arcana_fusion20/renderer/**/*.md'
      - '.github/workflows/arcana20-source-quick.yml'
permissions:
  contents: read
jobs:
  source-quick:
    if: ${{ !inputs.r31_lab }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.0
          use-dotnet: false
          include-templates: false
      - name: Import source project
        run: godot --headless --path . --import > import.log 2>&1 && ! grep -Eq 'SCRIPT ERROR:|Parse Error:' import.log
      - name: Run source-field regression independently
        run: |
          set -o pipefail
          timeout 420s godot --headless --path . --script res://prototypes/arcana_fusion20/renderer/arcana20_source_pass_test.gd 2>&1 | tee source.log
          grep -Fq 'ARCANA20_SOURCE_PASS_RESULT PASS' source.log
          ! grep -Eq 'SCRIPT ERROR:|Parse Error:|SOURCE_PASS_FAIL' source.log
      - name: Report native source errors and results
        if: always()
        run: |
          for file in import.log source.log; do
            if test -f "$file"; then
              grep -E 'SCRIPT ERROR:|Parse Error:|SOURCE_PASS_FAIL|ARCANA20_SOURCE_PASS_RESULT|C20_SETUP_COST' "$file" | tail -25 | while IFS= read -r line; do echo "::notice::$line"; done || true
            fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arcana20-source-quick-log
          path: |
            import.log
            source.log
          if-no-files-found: warn
  # One-shot cross-run uploaded-byte check: preserves the already-tested e80529c
  # build/captures, rather than generating a duplicate F capture matrix.
  verify-f-upload:
    if: ${{ contains(github.event.head_commit.message, '[verify-f-41396229547]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ARCANA_FIVE_FUSIONS_CREATOR_REVIEW
          run-id: 41396229547
          github-token: ${{ github.token }}
          path: downloaded-f
      - name: Verify downloaded bytes, provenance, files and checksums
        run: |
          set -euo pipefail
          result=$(python3 tools/arcana20_join/verify_f_download.py downloaded-f e80529cda05fc3b11697e508784306b8cb07f130)
          echo "$result"
          echo "::notice title=F_UPLOADED_ARTIFACT_VERIFIED::$result"

  r31-visual-direction-lab:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.r31_lab }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify standalone offline lab
        run: |
          set -euo pipefail
          python3 tools/arcana20_join/build_r31_lab.py "$RUNNER_TEMP/ARCANA20_R31_LAB"
          (cd "$RUNNER_TEMP/ARCANA20_R31_LAB" && sha256sum -c SHA256SUMS)
          sha256sum "$RUNNER_TEMP/ARCANA20_R31_LAB.zip" > "$RUNNER_TEMP/ARCANA20_R31_LAB.zip.sha256"
          cat "$RUNNER_TEMP/ARCANA20_R31_LAB.zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ARCANA20_R31_VISUAL_DIRECTION_LAB
          path: |
            ${{ runner.temp }}/ARCANA20_R31_LAB.zip
            ${{ runner.temp }}/ARCANA20_R31_LAB.zip.sha256
          if-no-files-found: error
          retention-days: 30
