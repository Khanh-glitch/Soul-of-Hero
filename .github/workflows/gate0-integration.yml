name: Gate 0 — Level 3 archive overlay (Godot 4.7)

# Checkpoint M3. Runs Candidate A's REAL game/main.tscn under Godot 4.7, once
# without the archive overlay and once with it, captures 1280x720 frames from
# the real viewport with the real HUD, and publishes those frames onto the
# branch so the evidence is durable rather than a CI artifact that expires.
#
# Scope: only Gate 0 files. It does not run the campaign suites and does not
# touch data/**, game/**, tests/** or the accepted Level 2 work.
#
# Deliberately NOT triggered by docs/gate0/**: this job commits the frames back
# into that folder, so a docs trigger would make every publish re-trigger itself.

on:
  push:
    branches:
      - arena/6e89e68d-soul-of-hero
      - integration/gate0-archive-art
    paths:
      - "prototypes/gate0/**"
      - "tools/gate0/**"
      - ".github/workflows/gate0-integration.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gate0-${{ github.ref }}
  cancel-in-progress: true

env:
  PINNED_LEVEL_SHA256: 5ea50e9cf37791a6283bfd9a58bd634ec8aa144e9602c5b9f40f0b4600555f54
  EVIDENCE_DIR: docs/gate0/evidence

jobs:
  render:
    name: Import, validate and render before/after
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Godot 4.7 stable
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.0
          use-dotnet: false
          include-templates: false

      - name: Materialise Candidate A's pinned Level 3
        shell: bash
        # data/** is frozen, so Gate 0 never commits a level change. The pinned
        # document travels as prototypes/gate0/level_data/ and is copied over
        # the canonical path inside this ephemeral runner only, so the game
        # boots its normal path with Candidate A's geometry. On a branch where
        # data/levels/chapter_1_level_3.json already holds that document, this
        # is a verified no-op.
        run: |
          set -euo pipefail
          mkdir -p .artifacts/gate0
          source=prototypes/gate0/level_data/chapter_1_level_3_a.json
          destination=data/levels/chapter_1_level_3.json
          before="$(sha256sum "$destination" | cut -d' ' -f1)"
          if [ "$before" != "$PINNED_LEVEL_SHA256" ]; then
            echo "data/ level is $before; copying Candidate A's pinned document in"
            cp "$source" "$destination"
          else
            echo "data/ level already is Candidate A's pinned document"
          fi
          after="$(sha256sum "$destination" | cut -d' ' -f1)"
          test "$after" = "$PINNED_LEVEL_SHA256"
          echo "level sha256 $after" | tee .artifacts/gate0/level_pin.log

      - name: Fetch Candidate B's art commit
        shell: bash
        # The checkout is shallow; the provenance check reads Candidate B's blobs
        # straight out of git, so that one commit has to be present.
        run: |
          set -euo pipefail
          git fetch --depth 1 origin e7cad36f8f21e746abefe44ac6cfa54db9a378e6
          git cat-file -t e7cad36f8f21e746abefe44ac6cfa54db9a378e6

      - name: Verify provenance and authoring determinism
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow
          # B's art must still be byte-identical to the audition blobs
          python3 tools/gate0/write_source_manifest.py --check \
            | tee .artifacts/gate0/source_manifest.log
          # the placement table must validate against Candidate A's geometry
          python3 tools/gate0/author_overlay.py \
            --level data/levels/chapter_1_level_3.json \
            | tee .artifacts/gate0/author.log
          # ...and regenerating it must not change a single byte
          git diff --exit-code -- prototypes/gate0/overlay_level3_archive.json
          python3 tools/gate0/author_overlay.py \
            --check --level data/levels/chapter_1_level_3.json \
            | tee .artifacts/gate0/author_check.log

      - name: Import project resources
        shell: bash
        run: |
          set -euo pipefail
          godot --version | tee .artifacts/gate0/godot_version.log
          timeout --signal=TERM --kill-after=10s 300s \
            godot --headless --audio-driver Dummy --editor --path . --import --quit \
            2>&1 | tee .artifacts/gate0/import.log

      - name: Render BEFORE (Candidate A's Level 3, no overlay)
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install --yes xvfb libgl1-mesa-dri >/dev/null
          export SOUL_OF_HERO_SAVE_PATH="user://gate0_before_${GITHUB_RUN_ID}.json"
          xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 \
            timeout --signal=TERM --kill-after=10s 420s godot \
            --path . --audio-driver Dummy --rendering-method gl_compatibility \
            --rendering-driver opengl3 --resolution 1280x720 \
            res://prototypes/gate0/capture_gate0.tscn \
            2>&1 | tee .artifacts/gate0/before.log
          grep -q "GATE0 CAPTURE TEST PASSED" .artifacts/gate0/before.log
          ls -l .artifacts/gate0/before_*.png

      - name: Render AFTER (same level + Candidate B's archive overlay)
        shell: bash
        run: |
          set -euo pipefail
          export SOUL_OF_HERO_SAVE_PATH="user://gate0_after_${GITHUB_RUN_ID}.json"
          xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 \
            timeout --signal=TERM --kill-after=10s 420s godot \
            --path . --audio-driver Dummy --rendering-method gl_compatibility \
            --rendering-driver opengl3 --resolution 1280x720 \
            res://prototypes/gate0/capture_gate0.tscn -- --overlay \
            2>&1 | tee .artifacts/gate0/after.log
          grep -q "GATE0 CAPTURE TEST PASSED" .artifacts/gate0/after.log
          if grep -Eq "^SCRIPT ERROR:" .artifacts/gate0/after.log; then
            echo "::error::Godot reported a script error during the overlay run"
            exit 1
          fi
          ls -l .artifacts/gate0/after_*.png

      - name: Fetch the published frames at a commit SHA
        if: always()
        shell: bash
        # Exercises the same URLs a reviewer will use, so "durable" is proven
        # rather than asserted.
        continue-on-error: true
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          url="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${sha}/docs/gate0/evidence/after_spawn.png"
          echo "probing $url"
          curl -fsSL --max-time 30 -o /tmp/probe.png "$url" && ls -l /tmp/probe.png \
            | tee .artifacts/gate0/durability_probe.log || \
            echo "no published frame yet at $sha (expected on the first run)"

      - name: Publish the frames and logs onto the branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR/logs"
          shopt -s nullglob
          for shot in .artifacts/gate0/before_*.png .artifacts/gate0/after_*.png; do
            cp "$shot" "$EVIDENCE_DIR/"
          done
          shopt -u nullglob
          rm -f "$EVIDENCE_DIR"/*.import
          # Cut the comparison sheets and 4x close-ups from exactly the frames
          # being committed in this same commit, so a reviewer never compares a
          # sheet against frames from a different run (Godot's animation state
          # differs by a frame or two between runs).
          python3 tools/gate0/make_evidence_sheets.py | tee .artifacts/gate0/sheets.log
          for log in .artifacts/gate0/*.log; do
            cp "$log" "$EVIDENCE_DIR/logs/$(basename "${log%.log}").txt"
          done
          ls -l "$EVIDENCE_DIR" || true
          git config user.name "gate0-capture-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "$EVIDENCE_DIR"
          if git diff --cached --quiet; then
            echo "no new frames"
            exit 0
          fi
          git commit -m "ci(gate0): publish Godot 4.7 before/after frames [skip ci]"
          git push

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate0-logs
          path: .artifacts/gate0/
          retention-days: 14
