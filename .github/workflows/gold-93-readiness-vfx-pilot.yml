name: Gold 93 VFX pilot (Venomwright 006 and 010, native frames vs recorded GOLD hashes)
on:
  push:
    paths:
      - 'prototypes/skill_readiness/pilot/**'
      - 'prototypes/skill_readiness/native/venom/**'
      - 'docs/vfx/skill_readiness/oracle/venomwright_006.json'
      - 'docs/vfx/skill_readiness/oracle/venomwright_010.json'
      - '.github/workflows/gold-93-readiness-vfx-pilot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pilot-headless:
    name: pilot-headless (skill ${{ matrix.skill }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        skill: [6, 10]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.0
          use-dotnet: false
          include-templates: false
      - name: Import project (Godot 4.7)
        shell: bash
        run: |
          set -uo pipefail
          timeout 300s godot --headless --editor --path . --import --quit 2>&1 | tee /tmp/pilot-import.log
          if grep -E 'SCRIPT ERROR:|Parse Error:' /tmp/pilot-import.log; then
            echo "::error::[vfx-pilot] parse error during import"; exit 1
          fi
      - name: Run pilot acceptance (both skills, full timeline, GOLD hash sync, cleanup)
        shell: bash
        run: |
          OUT="$RUNNER_TEMP/venom-pilot-${{ matrix.skill }}"
          mkdir -p "$OUT"
          export VENOM_PILOT_OUT="$OUT"
          export VENOM_PILOT_SKILLS="${{ matrix.skill }}"
          set +e
          timeout 1500s godot --headless --path . --script res://prototypes/skill_readiness/pilot/tests/venom_pilot_headless_test.gd > /tmp/pilot-run.log 2>&1
          echo $? > /tmp/pilot-run.status
          set -e
          STATUS=$(cat /tmp/pilot-run.status)
          echo "godot exit status $STATUS; log lines $(wc -l < /tmp/pilot-run.log)"
          test "$STATUS" = "0" && grep -q 'GOLD93_VENOM_PILOT: PASS' /tmp/pilot-run.log && ! grep -qE 'SCRIPT ERROR:|Parse Error:' /tmp/pilot-run.log
      - name: Presentation unit gates (coverage raster and map darkening)
        if: matrix.skill == 6
        shell: bash
        run: |
          set +e
          timeout 300s godot --headless --path . --script res://prototypes/skill_readiness/pilot/tests/venom_presentation_unit_test.gd > /tmp/pilot-unit.log 2>&1
          STATUS=$?
          set -e
          grep -E 'GOLD93_VENOM_PRESENTATION_UNIT' /tmp/pilot-unit.log | head -20 | sed -e 's/%/%25/g' | while IFS= read -r line; do echo "::notice title=vfx-pilot unit::$line"; done
          if [ "$STATUS" != "0" ] || ! grep -q 'GOLD93_VENOM_PRESENTATION_UNIT: PASS' /tmp/pilot-unit.log || grep -qE 'SCRIPT ERROR:|Parse Error:' /tmp/pilot-unit.log; then
            python3 prototypes/skill_readiness/pilot/tools/pilot_log_digest.py /tmp/pilot-unit.log "vfx-pilot unit status=$STATUS"
            exit 1
          fi
      - name: Demo scene smoke (venom_pilot_demo.tscn, 240 frames, headless)
        if: matrix.skill == 6
        shell: bash
        run: |
          set +e
          timeout 300s godot --headless --path . --quit-after 240 res://prototypes/skill_readiness/pilot/venom_pilot_demo.tscn > /tmp/pilot-demo.log 2>&1
          STATUS=$?
          set -e
          echo "::notice title=vfx-pilot demo::demo scene exit status $STATUS"
          if [ "$STATUS" != "0" ] || grep -qE 'SCRIPT ERROR:|Parse Error:' /tmp/pilot-demo.log; then
            python3 prototypes/skill_readiness/pilot/tools/pilot_log_digest.py /tmp/pilot-demo.log "vfx-pilot demo smoke status=$STATUS"
            exit 1
          fi
      - name: Pilot verdicts and failure digest
        if: always()
        shell: bash
        run: |
          echo "::notice title=vfx-pilot status::godot exit status $(cat /tmp/pilot-run.status 2>/dev/null || echo missing)"
          grep -E 'GOLD93_VENOM_PILOT' /tmp/pilot-run.log 2>/dev/null | head -20 | sed -e 's/%/%25/g' | while IFS= read -r line; do echo "::notice title=vfx-pilot verdict::$line"; done
          if [ "$(cat /tmp/pilot-run.status 2>/dev/null)" != "0" ] || ! grep -q 'GOLD93_VENOM_PILOT: PASS' /tmp/pilot-run.log 2>/dev/null; then
            python3 prototypes/skill_readiness/pilot/tools/pilot_log_digest.py /tmp/pilot-run.log "vfx-pilot failure digest"
            exit 1
          fi
      - name: Upload native frames and manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: venom-pilot-frames-${{ matrix.skill }}
          path: ${{ runner.temp }}/venom-pilot-${{ matrix.skill }}
          if-no-files-found: warn
          retention-days: 14
  pilot-real-map:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout immutable Chapter 1 Level 2 (no mutation)
        uses: actions/checkout@v4
        with:
          ref: f9fb8d4b7490a2579426bd5c4ee4667704d3a05e
          path: real-map
          persist-credentials: false
      - name: Checkout pilot code at this SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: vfx-only
          persist-credentials: false
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.0
          use-dotnet: false
          include-templates: false
      - name: Overlay pilot and native Venomwright modules into the disposable map checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C real-map rev-parse HEAD)" = f9fb8d4b7490a2579426bd5c4ee4667704d3a05e
          test -f real-map/tests/chapter_1_campaign_level_visual_capture.gd
          test -f real-map/game/characters/knight/knight.tscn
          mkdir -p real-map/prototypes/skill_readiness/pilot real-map/prototypes/skill_readiness/native/venom
          cp -a vfx-only/prototypes/skill_readiness/pilot/. real-map/prototypes/skill_readiness/pilot/
          cp -a vfx-only/prototypes/skill_readiness/native/venom/. real-map/prototypes/skill_readiness/native/venom/
          if ! git -C real-map diff --quiet HEAD -- game/ data/ assets/ project.godot; then
            echo "Tracked production map or gameplay files modified"; exit 1
          fi
      - name: Import production map and pilot modules
        shell: bash
        run: |
          set -uo pipefail
          timeout 300s godot --headless --editor --path real-map --import --quit 2>&1 | tee /tmp/pilot-real-import.log
          if grep -E 'SCRIPT ERROR:|Parse Error:' /tmp/pilot-real-import.log; then echo "::error::[vfx-pilot-map] parse error during import"; exit 1; fi
      - name: Run native Venomwright 006 live on Chapter 1 Level 2
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p real-map/.artifacts/venom_real_map
          set +e
          timeout 4800s xvfb-run -a -s '-screen 0 1280x720x24' env LIBGL_ALWAYS_SOFTWARE=1 godot --audio-driver Dummy --path real-map --rendering-method gl_compatibility --resolution 1280x720 res://prototypes/skill_readiness/pilot/real_map/venom_pilot_real_map.tscn 2>&1 | tee /tmp/pilot-real-map.log
          STATUS=${PIPESTATUS[0]}
          set -e
          echo "::notice title=vfx-pilot-map status::godot exit status $STATUS"
          grep -E 'GOLD93_VENOM_REAL_MAP|CHAPTER 1 CAMPAIGN' /tmp/pilot-real-map.log | head -20 | sed -e 's/%/%25/g' | while IFS= read -r line; do echo "::notice title=vfx-pilot-map verdict::$line"; done
          if [ "$STATUS" != "0" ] || ! grep -q 'GOLD93_VENOM_REAL_MAP: PASS' /tmp/pilot-real-map.log || grep -qE 'SCRIPT ERROR:|Parse Error:|Shader compilation failed' /tmp/pilot-real-map.log; then
            python3 vfx-only/prototypes/skill_readiness/pilot/tools/pilot_log_digest.py /tmp/pilot-real-map.log "vfx-pilot-map status=$STATUS"
            exit 1
          fi
          test -s real-map/.artifacts/venom_real_map/l2_baseline_no_vfx.png
          for f in s006_gold_isolated_impact_t0025 s006_legacy_additive_impact_t0025 s006_coverage_impact_t0025 s006_coverage_darkened_impact_t0025 s010_coverage_darkened_peak_t0715 s010_coverage_darkened_aftermath_t0840; do
            test -s "real-map/.artifacts/venom_real_map/$f.png"
          done
          test -s real-map/.artifacts/venom_real_map/ab_index.json
          test -s real-map/.artifacts/venom_real_map/s006_gold_original_UNAVAILABLE.txt
          if ! git -C real-map diff --quiet HEAD -- game/ data/ assets/ project.godot; then echo "Tracked map altered"; exit 1; fi
      - name: Upload real-map pilot frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: venom-pilot-real-map-frames
          path: |
            real-map/.artifacts/venom_real_map/*.png
            real-map/.artifacts/venom_real_map/*.json
            real-map/.artifacts/venom_real_map/*.txt
            /tmp/pilot-real-map.log
          if-no-files-found: warn
          retention-days: 14
