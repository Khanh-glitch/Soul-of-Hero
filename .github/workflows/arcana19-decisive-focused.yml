name: ARCANA19 decisive boundary focused QA
on:
  push:
    branches: ['arena/c7b0c4e8-soul-of-hero']
    paths:
      - '.github/workflows/arcana19-decisive-focused.yml'
      - 'prototypes/arcana20_web_review/integration/primary-web-19-decisive/primary-19-decisive.patch'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-primary-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 3b37ae90601dee098066cbc4cf465552f1eb6f04
          path: primary
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact primary patch
        run: |
          cd primary
          git apply --check ../prototypes/arcana20_web_review/integration/primary-web-19-decisive/primary-19-decisive.patch
          git apply ../prototypes/arcana20_web_review/integration/primary-web-19-decisive/primary-19-decisive.patch
      - name: Install, typecheck, tests and build
        working-directory: primary/web
        run: |
          npm ci
          npx tsc --noEmit
          npm test
          npm run build
          npx playwright install --with-deps chromium
      - name: Focused real-game and source boundary QA
        working-directory: primary/web
        run: |
          set -euo pipefail
          npm run dev -- --host 127.0.0.1 --port 4194 > /tmp/arcana19-vite.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          node -e 'let n=0;let t=setInterval(async()=>{try{let r=await fetch("http://127.0.0.1:4194/");if(r.ok){clearInterval(t);process.exit(0)}}catch{}if(++n>60){clearInterval(t);process.exit(1)}},500)'
          export SOH_URL=http://127.0.0.1:4194/
          node scripts/qa-arcana19-rgba8.mjs
          node scripts/qa-arcana19-lifecycle.mjs
          ARCANA_SCENE=clearing ARCANA_OUT="$RUNNER_TEMP/arcana19/clearing" node scripts/qa-arcana19-matched.mjs
          ARCANA_SCENE=occlusion ARCANA_OUT="$RUNNER_TEMP/arcana19/occlusion" node scripts/qa-arcana19-matched.mjs
          export SOURCE_HTML="$GITHUB_WORKSPACE/prototypes/arcana_fusion20/original_source/package/handoff/reference/Elemental_VFX_Lab_FIXED_Standalone.html"
          ARCANA_INPUT="$RUNNER_TEMP/arcana19/clearing" ARCANA_OUT="$RUNNER_TEMP/arcana19/boundary" node scripts/qa-arcana19-floor-boundary.mjs
          ARCANA_BOUNDARY="$RUNNER_TEMP/arcana19/boundary" node scripts/qa-arcana19-measure-boundary.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arcana19-decisive-boundary
          path: ${{ runner.temp }}/arcana19/
          if-no-files-found: ignore
          retention-days: 7
