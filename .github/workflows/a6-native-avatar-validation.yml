name: A6 native avatar validation

## Native Godot 4.7 execution for the A6 player-avatar integration.
##
## Two independent gates:
##   * `public-clone-fail-closed` proves a clean clone (no private art) fails
##     closed: the Knight is not substituted, identity still saves, no items.
##   * `private-staged-art` stages the SHA-256-locked CraftPix base sheets on the
##     runner only (never committed), then proves both identities through the
##     real menu -> New Game -> identity choice -> Home -> overworld journey,
##     including death/respawn and a second-process reload.
##   * `visual-captures` renders real 720p/1440p/2160p avatar frames under Xvfb with
##     a software GL driver and uploads them for human inspection.
##
## The survival return UI frames used to be rendered here too, which meant a blocked
## CraftPix download also blocked the only real render of that UI. They now live in
## `a6-return-ui-render.yml`, which needs public content only.

on:
  workflow_dispatch:
  push:
    branches:
      - arena/05e0328d-soul-of-hero

permissions:
  contents: read

# A newer push supersedes older queued runs of this gate so a stale commit can
# never occupy the runner queue ahead of the candidate that is being reviewed.
concurrency:
  group: a6-native-avatar-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_ARCHIVE_SHA256: "0b1a6c54c2c619c12e169fe9241edda4b81080b519451cec2984bf0d2c6cb73c"
  # Where the licensed grade-0 source archives actually live: real Git binaries on
  # the creator's asset repository, not an anonymous Drive link. The commits, blob
  # ids and digests are pinned in tools/fetch_a6_avatar_sources.sh.
  A6_ASSET_REPO: "Khanh-glitch/APEX-CHAOS"
  MALE_ARCHIVE_COMMIT: "bf11a0cecfda43beca510062bd5d9dc1a8573cc5"
  FEMALE_ARCHIVE_COMMIT: "b75dfc0ffa98c25059d67f655be14e419e63430b"
  MALE_ARCHIVE_SHA256: "b5579a3cc6006ef8c9d55c9ca0388575d75c987382b6cb504e2c7519e6c1e795"
  FEMALE_ARCHIVE_SHA256: "f704e7852273d5f0111435ae86975fa981354d699dff1f594934f6a32d9821ad"

jobs:
  public-clone-fail-closed:
    name: Public clone fails closed (no private art)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install the official Godot 4.7-stable binary (SHA-256 verified)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot"
          ARCHIVE="$RUNNER_TEMP/godot/Godot_v4.7-stable_linux.x86_64.zip"
          curl -L --fail --retry 3 --max-time 900 -o "$ARCHIVE" \
            "https://github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip"
          # Digest published by the official 4.7-stable release metadata
          # (api.github.com/repos/godotengine/godot-builds/releases/tags/4.7-stable).
          echo "${GODOT_ARCHIVE_SHA256}  ${ARCHIVE}" | sha256sum -c -
          unzip -q -o "$ARCHIVE" -d "$RUNNER_TEMP/godot"
          ENGINE="$RUNNER_TEMP/godot/Godot_v4.7-stable_linux.x86_64"
          chmod +x "$ENGINE"
          ln -sf "$ENGINE" "$RUNNER_TEMP/godot/godot"
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"
          sha256sum "$ARCHIVE" | tee "$RUNNER_TEMP/godot-archive.sha256"
          "$ENGINE" --version | tee "$RUNNER_TEMP/godot-version.txt"
          {
            echo "engine: $ENGINE"
            echo "version: $(cat "$RUNNER_TEMP/godot-version.txt")"
            echo "archive sha256: $(cat "$RUNNER_TEMP/godot-archive.sha256")"
            echo "expected sha256: ${GODOT_ARCHIVE_SHA256}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record engine version
        run: |
          mkdir -p .artifacts
          godot --version | tee .artifacts/godot-version.txt
          echo "Engine: $(cat .artifacts/godot-version.txt)" >> "$GITHUB_STEP_SUMMARY"

      - name: Confirm no private art is present in the checkout
        run: |
          test ! -e private_art/a6_avatar/avatar_art_private_runtime.json
          echo "private_art staging absent, as expected for a public clone"

      - name: Import project
        run: |
          set -uo pipefail
          godot --headless --editor --path . --import --quit 2>&1 | tail -40
          echo "import done"

      - name: Identity saves but art gate is honest (no Knight substitute)
        run: |
          set -euo pipefail
          export SOUL_OF_HERO_SAVE_PATH="user://a6_public_clone.json"
          rm -f "$HOME/.local/share/godot/app_userdata/SOUL OF HERO/a6_public_clone.json" || true
          timeout --signal=TERM --kill-after=15s 300s godot --headless --path . -- \
            --avatar-identity-test --avatar-phase=full --avatar-gender=male --avatar-expectation=blocked \
            2>&1 | tee .artifacts/fail-closed-full.log
          timeout --signal=TERM --kill-after=15s 300s godot --headless --path . -- \
            --avatar-identity-test --avatar-phase=verify --avatar-gender=male --avatar-expectation=blocked \
            2>&1 | tee .artifacts/fail-closed-verify.log
          test -z "$(git ls-files private_art)"
          grep -q "A6 AVATAR IDENTITY NATIVE TEST PASSED" .artifacts/fail-closed-full.log
          grep -q "A6 AVATAR IDENTITY NATIVE TEST PASSED" .artifacts/fail-closed-verify.log
          echo "FAIL-CLOSED GATE PASSED" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a6-fail-closed-logs
          path: .artifacts/*.log
          include-hidden-files: true

  private-staged-art:
    name: Private staged art drives both identities natively
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install the official Godot 4.7-stable binary (SHA-256 verified)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot"
          ARCHIVE="$RUNNER_TEMP/godot/Godot_v4.7-stable_linux.x86_64.zip"
          curl -L --fail --retry 3 --max-time 900 -o "$ARCHIVE" \
            "https://github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip"
          # Digest published by the official 4.7-stable release metadata
          # (api.github.com/repos/godotengine/godot-builds/releases/tags/4.7-stable).
          echo "${GODOT_ARCHIVE_SHA256}  ${ARCHIVE}" | sha256sum -c -
          unzip -q -o "$ARCHIVE" -d "$RUNNER_TEMP/godot"
          ENGINE="$RUNNER_TEMP/godot/Godot_v4.7-stable_linux.x86_64"
          chmod +x "$ENGINE"
          ln -sf "$ENGINE" "$RUNNER_TEMP/godot/godot"
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"
          sha256sum "$ARCHIVE" | tee "$RUNNER_TEMP/godot-archive.sha256"
          "$ENGINE" --version | tee "$RUNNER_TEMP/godot-version.txt"
          {
            echo "engine: $ENGINE"
            echo "version: $(cat "$RUNNER_TEMP/godot-version.txt")"
            echo "archive sha256: $(cat "$RUNNER_TEMP/godot-archive.sha256")"
            echo "expected sha256: ${GODOT_ARCHIVE_SHA256}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fetch the licensed source archives from their Git refs
        run: |
          set -euo pipefail
          # Commit, blob id, byte length and SHA-256 are all asserted by this script;
          # see tools/fetch_a6_avatar_sources.sh for the pin table and the reasoning.
          bash tools/fetch_a6_avatar_sources.sh "$RUNNER_TEMP/a6_source" \
            2>&1 | tee "$RUNNER_TEMP/a6_source/fetch.log"
          grep -q "A6 ASSET SOURCES VERIFIED" "$RUNNER_TEMP/a6_source/fetch.log"
          {
            echo "### A6 avatar source (Git, pinned)"
            grep -E "commit:|path:|blob:|sha256:" "$RUNNER_TEMP/a6_source/fetch.log"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stage the licensed base sheets privately (runner-only, never committed)
        run: |
          set -euo pipefail
          python3 tools/stage_a6_avatar_art.py \
            --male-zip "$RUNNER_TEMP/a6_source/male.zip" \
            --female-zip "$RUNNER_TEMP/a6_source/female.zip"
          rm -f "$RUNNER_TEMP/a6_source"/*.zip

      - name: Import project with the staged sheets
        run: |
          set -uo pipefail
          godot --headless --editor --path . --import --quit 2>&1 | tail -40
          echo "import done"

      - name: Male journey, death/respawn and separate-process reload
        run: |
          set -euo pipefail
          mkdir -p .artifacts
          export SOUL_OF_HERO_SAVE_PATH="user://a6_male.json"
          timeout --signal=TERM --kill-after=15s 420s godot --headless --path . -- \
            --avatar-identity-test --avatar-phase=full --avatar-gender=male --avatar-expectation=ready \
            2>&1 | tee .artifacts/male-full.log
          timeout --signal=TERM --kill-after=15s 420s godot --headless --path . -- \
            --avatar-identity-test --avatar-phase=verify --avatar-gender=male --avatar-expectation=ready \
            2>&1 | tee .artifacts/male-verify.log
          grep -q "NATIVE TEST PASSED" .artifacts/male-full.log
          grep -q "NATIVE TEST PASSED" .artifacts/male-verify.log

      - name: Female journey, death/respawn and separate-process reload
        run: |
          set -euo pipefail
          export SOUL_OF_HERO_SAVE_PATH="user://a6_female.json"
          timeout --signal=TERM --kill-after=15s 420s godot --headless --path . -- \
            --avatar-identity-test --avatar-phase=full --avatar-gender=female --avatar-expectation=ready \
            2>&1 | tee .artifacts/female-full.log
          timeout --signal=TERM --kill-after=15s 420s godot --headless --path . -- \
            --avatar-identity-test --avatar-phase=verify --avatar-gender=female --avatar-expectation=ready \
            2>&1 | tee .artifacts/female-verify.log
          grep -q "NATIVE TEST PASSED" .artifacts/female-full.log
          grep -q "NATIVE TEST PASSED" .artifacts/female-verify.log

      - name: A0 menu journey (the identity assertions gate this step)
        run: |
          set -uo pipefail
          mkdir -p .artifacts
          export SOUL_OF_HERO_SAVE_PATH="user://a6_menu_regression.json"
          set +e
          timeout --signal=TERM --kill-after=15s 300s godot --headless --path . -- \
            --startup-profile-choice-test 2>&1 | tee .artifacts/startup-profile-choice.log
          result=${PIPESTATUS[0]}
          set -e
          echo "startup profile choice exit: ${result}"
          # The identity step must be green. A0's own "fresh profile has Sword
          # only" assertion is red on the untouched base commit 51225718 (it
          # expects two reserve slots while SOUL_TEAM_RESERVE_CAPACITY is 1), so
          # it is reported instead of being hidden or blamed on this workstream.
          if grep -qE "STARTUP PROFILE CHOICE FAIL: (New Game asks for the player identity|the authored identity step|both authored identities|no identity is recorded|choosing an identity|the chosen identity is stored|the stored identity matches)" .artifacts/startup-profile-choice.log; then
            echo "::error::the player identity step regressed in the A0 menu journey"
            exit 1
          fi
          if [ "${result}" -ne 0 ]; then
            echo "PRE-EXISTING A0 MENU FAILURE (exit ${result}): identity assertions passed" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Report avatar evidence summary
        if: always()
        run: |
          {
            echo "### A6 native avatar evidence"
            echo "- engine: $(git rev-parse --short HEAD) / $(cat .artifacts/*.log 2>/dev/null | grep -m1 -i 'Godot Engine v' || echo unknown)"
            for log in .artifacts/*.log; do
              echo "- ${log}: $(grep -c 'PASSED' "$log" || true) pass marker(s)"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a6-native-logs
          path: .artifacts/*.log

  visual-captures:
    name: Real renders at 720p / 1440p / 2160p
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install the official Godot 4.7-stable binary (SHA-256 verified)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot"
          ARCHIVE="$RUNNER_TEMP/godot/Godot_v4.7-stable_linux.x86_64.zip"
          curl -L --fail --retry 3 --max-time 900 -o "$ARCHIVE" \
            "https://github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip"
          # Digest published by the official 4.7-stable release metadata
          # (api.github.com/repos/godotengine/godot-builds/releases/tags/4.7-stable).
          echo "${GODOT_ARCHIVE_SHA256}  ${ARCHIVE}" | sha256sum -c -
          unzip -q -o "$ARCHIVE" -d "$RUNNER_TEMP/godot"
          ENGINE="$RUNNER_TEMP/godot/Godot_v4.7-stable_linux.x86_64"
          chmod +x "$ENGINE"
          ln -sf "$ENGINE" "$RUNNER_TEMP/godot/godot"
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"
          sha256sum "$ARCHIVE" | tee "$RUNNER_TEMP/godot-archive.sha256"
          "$ENGINE" --version | tee "$RUNNER_TEMP/godot-version.txt"
          {
            echo "engine: $ENGINE"
            echo "version: $(cat "$RUNNER_TEMP/godot-version.txt")"
            echo "archive sha256: $(cat "$RUNNER_TEMP/godot-archive.sha256")"
            echo "expected sha256: ${GODOT_ARCHIVE_SHA256}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install a display server and software GL
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri libglx-mesa0 mesa-utils

      - name: Fetch the licensed source archives from their Git refs
        run: |
          set -euo pipefail
          # Commit, blob id, byte length and SHA-256 are all asserted by this script;
          # see tools/fetch_a6_avatar_sources.sh for the pin table and the reasoning.
          bash tools/fetch_a6_avatar_sources.sh "$RUNNER_TEMP/a6_source" \
            2>&1 | tee "$RUNNER_TEMP/a6_source/fetch.log"
          grep -q "A6 ASSET SOURCES VERIFIED" "$RUNNER_TEMP/a6_source/fetch.log"
          {
            echo "### A6 avatar source (Git, pinned)"
            grep -E "commit:|path:|blob:|sha256:" "$RUNNER_TEMP/a6_source/fetch.log"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stage the licensed base sheets privately (runner-only, never committed)
        run: |
          set -euo pipefail
          python3 tools/stage_a6_avatar_art.py \
            --male-zip "$RUNNER_TEMP/a6_source/male.zip" \
            --female-zip "$RUNNER_TEMP/a6_source/female.zip"
          rm -f "$RUNNER_TEMP/a6_source"/*.zip

      - name: Import project with the staged sheets
        run: |
          godot --headless --editor --path . --import --quit 2>&1 | tail -20

      - name: Render 1280x720 captures
        run: |
          set -uo pipefail
          mkdir -p .artifacts/captures-1280x720
          export SOUL_OF_HERO_SAVE_PATH="user://a6_capture_720.json"
          set +e
          timeout --signal=TERM --kill-after=20s 420s xvfb-run --auto-servernum -s "-screen 0 1280x720x24" \
            env LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe \
            godot --path . --resolution 1280x720 --rendering-driver opengl3 -- \
            --avatar-visual-capture --avatar-gender=male \
            --capture-dir="$PWD/.artifacts/captures-1280x720" --capture-tag=male_720p \
            2>&1 | tee .artifacts/capture-720p.log
          result=${PIPESTATUS[0]}
          set -e
          echo "720p capture exit: ${result}"
          exit "${result}"

      - name: Render the second-process Continue frames (720p, same profile)
        run: |
          set -uo pipefail
          export SOUL_OF_HERO_SAVE_PATH="user://a6_capture_720.json"
          set +e
          timeout --signal=TERM --kill-after=20s 420s xvfb-run --auto-servernum -s "-screen 0 1280x720x24" \
            env LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe \
            godot --path . --resolution 1280x720 --rendering-driver opengl3 -- \
            --avatar-visual-capture --avatar-phase=continue --avatar-gender=male \
            --capture-dir="$PWD/.artifacts/captures-1280x720" --capture-tag=male_720p_continue \
            2>&1 | tee .artifacts/capture-720p-continue.log
          result=${PIPESTATUS[0]}
          set -e
          echo "720p continue capture exit: ${result}"
          exit "${result}"

      - name: Render female journey at 720p
        run: |
          set -uo pipefail
          export SOUL_OF_HERO_SAVE_PATH="user://a6_capture_720_female.json"
          set +e
          timeout --signal=TERM --kill-after=20s 420s xvfb-run --auto-servernum -s "-screen 0 1280x720x24" \
            env LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe \
            godot --path . --resolution 1280x720 --rendering-driver opengl3 -- \
            --avatar-visual-capture --avatar-gender=female \
            --capture-dir="$PWD/.artifacts/captures-1280x720" --capture-tag=female_720p \
            2>&1 | tee .artifacts/capture-720p-female.log
          result=${PIPESTATUS[0]}
          set -e
          echo "720p female capture exit: ${result}"
          exit "${result}"

      - name: Render the female second-process Continue frames
        run: |
          set -uo pipefail
          export SOUL_OF_HERO_SAVE_PATH="user://a6_capture_720_female.json"
          set +e
          timeout --signal=TERM --kill-after=20s 420s xvfb-run --auto-servernum -s "-screen 0 1280x720x24" \
            env LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe \
            godot --path . --resolution 1280x720 --rendering-driver opengl3 -- \
            --avatar-visual-capture --avatar-phase=continue --avatar-gender=female \
            --capture-dir="$PWD/.artifacts/captures-1280x720" --capture-tag=female_720p_continue \
            2>&1 | tee .artifacts/capture-720p-female-continue.log
          result=${PIPESTATUS[0]}
          set -e
          echo "720p female continue capture exit: ${result}"
          exit "${result}"

      - name: Render 2560x1440 captures
        run: |
          set -uo pipefail
          mkdir -p .artifacts/captures-2560x1440
          export SOUL_OF_HERO_SAVE_PATH="user://a6_capture_1440.json"
          set +e
          timeout --signal=TERM --kill-after=20s 420s xvfb-run --auto-servernum -s "-screen 0 2560x1440x24" \
            env LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe \
            godot --path . --resolution 2560x1440 --rendering-driver opengl3 -- \
            --avatar-visual-capture --avatar-gender=female \
            --capture-dir="$PWD/.artifacts/captures-2560x1440" --capture-tag=female_1440p \
            2>&1 | tee .artifacts/capture-1440p.log
          result=${PIPESTATUS[0]}
          set -e
          echo "1440p capture exit: ${result}"
          exit "${result}"

      - name: Render 3840x2160 captures
        run: |
          set -uo pipefail
          mkdir -p .artifacts/captures-3840x2160
          export SOUL_OF_HERO_SAVE_PATH="user://a6_capture_2160.json"
          set +e
          timeout --signal=TERM --kill-after=20s 420s xvfb-run --auto-servernum -s "-screen 0 3840x2160x24" \
            env LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe \
            godot --path . --resolution 3840x2160 --rendering-driver opengl3 -- \
            --avatar-visual-capture --avatar-gender=male \
            --capture-dir="$PWD/.artifacts/captures-3840x2160" --capture-tag=male_2160p \
            2>&1 | tee .artifacts/capture-2160p.log
          result=${PIPESTATUS[0]}
          set -e
          echo "2160p capture exit: ${result}"
          exit "${result}"

      - name: Assert every capture has the resolution it claims
        run: |
          python3 - <<'PY'
          import pathlib, struct, sys
          expected = {"1280x720": (1280, 720), "2560x1440": (2560, 1440), "3840x2160": (3840, 2160)}
          failures = []
          count = 0
          for folder, want in expected.items():
              for png in sorted(pathlib.Path(".artifacts").glob(f"captures-{folder}/*.png")):
                  data = png.read_bytes()[:24]
                  if data[:8] != b"\x89PNG\r\n\x1a\n":
                      failures.append(f"{png}: not a PNG")
                      continue
                  size = struct.unpack(">II", data[16:24])
                  count += 1
                  if size != want:
                      failures.append(f"{png}: {size[0]}x{size[1]} != {want[0]}x{want[1]}")
          print(f"checked {count} frames")
          for failure in failures:
              print(f"FAIL {failure}")
          sys.exit(1 if failures or count == 0 else 0)
          PY

      - name: Summarise captures
        if: always()
        run: |
          python3 - <<'PY'
          import pathlib, struct
          root = pathlib.Path(".artifacts")
          # `captures-*/**.png` is not a glob: `**` may only stand in for a whole
          # path component, and Python raises ValueError on it. The captures sit one
          # level down, so a single-level pattern is both correct and precise.
          for png in sorted(root.glob("captures-*/*.png")):
              data = png.read_bytes()[:24]
              w, h = struct.unpack(">II", data[16:24]) if data[:8] == b"\x89PNG\r\n\x1a\n" else (0, 0)
              print(f"{png} {w}x{h} {png.stat().st_size} bytes")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a6-native-captures
          path: .artifacts/captures-*/**
          include-hidden-files: true
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a6-capture-logs
          path: .artifacts/capture-*.log
          include-hidden-files: true

  survival-return-ui:
    name: Survival return UI (season, guidance, digest, record)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install the official Godot 4.7-stable binary (SHA-256 verified)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot"
          ARCHIVE="$RUNNER_TEMP/godot/Godot_v4.7-stable_linux.x86_64.zip"
          curl -L --fail --retry 3 --max-time 900 -o "$ARCHIVE" \
            "https://github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip"
          echo "${GODOT_ARCHIVE_SHA256}  ${ARCHIVE}" | sha256sum -c -
          unzip -q -o "$ARCHIVE" -d "$RUNNER_TEMP/godot"
          ENGINE="$RUNNER_TEMP/godot/Godot_v4.7-stable_linux.x86_64"
          chmod +x "$ENGINE"
          ln -sf "$ENGINE" "$RUNNER_TEMP/godot/godot"
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"
          "$ENGINE" --version | tee "$RUNNER_TEMP/godot-version.txt"

      - name: Run the return UI native gate
        run: |
          set -euo pipefail
          mkdir -p .artifacts
          bash tools/run_a6_return_ui_gate.sh "$RUNNER_TEMP/godot/godot" 2>&1 | tee .artifacts/a6-return-ui-gate.log
          grep -q "A6 RETURN UI NATIVE PASSED" .artifacts/a6-return-ui-gate.log
          echo "A6 RETURN UI GATE PASSED" >> "$GITHUB_STEP_SUMMARY"

      - name: The capture harness refuses to fake a render without a display
        run: |
          set -euo pipefail
          set +e
          godot --headless --path . res://tests/survival/ui/a6_return_ui_capture.tscn > .artifacts/headless-capture.log 2>&1
          status=$?
          set -e
          cat .artifacts/headless-capture.log
          test "$status" -eq 2
          grep -q "RENDERER REQUIRED" .artifacts/headless-capture.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a6-return-ui-logs
          path: .artifacts/*.log
          include-hidden-files: true
