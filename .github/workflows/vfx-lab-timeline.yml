name: VFX Lab Gate 0 — Native Timeline Smoke
on:
  push:
    branches:
      - "feature/vfx-lab-gate0-20261027"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  timeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.0
          use-dotnet: false
          include-templates: false
      - name: Import existing Godot project
        shell: bash
        run: |
          set -euo pipefail
          godot --version
          timeout 120s godot --headless --editor --path . --import --quit 2>&1 | tee import.log
          if grep -E 'SCRIPT ERROR:|Parse Error:' import.log; then exit 1; fi
      - name: Deterministic cue/timeline smoke
        shell: bash
        run: |
          set -euo pipefail
          timeout 45s godot --headless --path . --script res://prototypes/vfx_lab/tests/timeline_smoke.gd 2>&1 | tee timeline.log
          grep -F "VFX_LAB_TIMELINE: PASS" timeline.log
          if grep -E 'SCRIPT ERROR:|Parse Error:' timeline.log; then exit 1; fi
