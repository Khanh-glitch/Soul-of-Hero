name: Gate 1 — Archive architectural native Godot 4.7
on:
  push:
    branches:
      - integration/level3-archive-redesign
    paths:
      - "tools/gate1/author_redesign.py"
      - "tools/gate1/make_evidence_sheets.py"
      - "prototypes/gate1/archive_redesign.gd"
      - "prototypes/gate1/archive_redesign.tscn"
      - "prototypes/gate1/capture_gate1.gd"
      - "prototypes/gate1/capture_gate1.tscn"
      - ".github/workflows/gate1-runtime.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gate1-native
  cancel-in-progress: true
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.0
          use-dotnet: false
          include-templates: false
      - name: Derive reversible trial architecture and validate entities
        run: |
          set -euo pipefail
          mkdir -p .artifacts/gate1 docs/gate1/evidence/logs
          python3 tools/gate1/author_redesign.py | tee .artifacts/gate1/author.log
          python3 tools/gate1/author_redesign.py --check | tee .artifacts/gate1/author_check.log
          cp prototypes/gate0/level_data/chapter_1_level_3_a.json data/levels/chapter_1_level_3.json
      - name: Import Godot 4.7
        run: |
          set -euo pipefail
          godot --version | tee .artifacts/gate1/version.log
          timeout 300s godot --headless --audio-driver Dummy --editor --path . --import --quit 2>&1 | tee .artifacts/gate1/import.log
      - name: Install Xvfb Mesa
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes xvfb libgl1-mesa-dri >/dev/null
      - name: Capture original A Level 3 with HUD
        run: |
          set -euo pipefail
          export SOUL_OF_HERO_SAVE_PATH="user://g1_before_$GITHUB_RUN_ID.json"
          xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 timeout 420s godot --path . \
            --audio-driver Dummy --rendering-method gl_compatibility --rendering-driver opengl3 \
            --resolution 1280x720 res://prototypes/gate1/capture_gate1.tscn \
            2>&1 | tee .artifacts/gate1/before.log
          grep -q "GATE1 CAPTURE TEST PASSED" .artifacts/gate1/before.log
      - name: Capture redesigned annex with live Knight collision and HUD
        run: |
          set -euo pipefail
          cp prototypes/gate1/level_data/chapter_1_level_3_trial.json data/levels/chapter_1_level_3.json
          export SOUL_OF_HERO_SAVE_PATH="user://g1_after_$GITHUB_RUN_ID.json"
          xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 timeout 420s godot --path . \
            --audio-driver Dummy --rendering-method gl_compatibility --rendering-driver opengl3 \
            --resolution 1280x720 res://prototypes/gate1/capture_gate1.tscn -- --overlay \
            2>&1 | tee .artifacts/gate1/after.log
          grep -q "GATE1 CAPTURE TEST PASSED" .artifacts/gate1/after.log
          if grep -Eq "^SCRIPT ERROR:" .artifacts/gate1/after.log; then exit 1; fi
          test -f .artifacts/gate1/after_sanctuary.png
      - name: Persist native frames and log errors
        if: always()
        run: |
          set -euo pipefail
          mkdir -p docs/gate1/evidence/logs
          shopt -s nullglob
          for frame in .artifacts/gate1/*.png; do cp "$frame" docs/gate1/evidence/; done
          for logfile in .artifacts/gate1/*.log; do
            cp "$logfile" "docs/gate1/evidence/logs/$(basename "$logfile" .log).txt"
          done
          shopt -u nullglob
          if [ -f .artifacts/gate1/after_sanctuary.png ]; then
            python3 -m pip install --quiet pillow
            python3 tools/gate1/make_evidence_sheets.py | tee docs/gate1/evidence/logs/sheets.txt
          fi
          git config user.name "gate1-capture-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/gate1/evidence prototypes/gate1/level_data prototypes/gate1/visual_placement.json
          if ! git diff --cached --quiet; then
            git commit -m "ci(gate1): publish native Godot redesigned archive evidence [skip ci]"
            git push
          fi
