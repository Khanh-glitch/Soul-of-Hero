name: A0 ambiguous save write follow-up
on:
  push:
    branches: [arena/dea2428e-soul-of-hero]
    paths: ['game/autoload/save_service.gd', 'tests/survival_save_ambiguous_write_test.gd', '.github/workflows/a0-save-ambiguous-write.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.0
          use-dotnet: false
          include-templates: false
      - name: Import and exercise real SaveService boundaries
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p artifacts/ud_import artifacts/ud_ambiguous
          timeout 180s godot --headless --path . --user-data-dir artifacts/ud_import --import > artifacts/ambiguous-import.log 2>&1 || exit $?
          timeout 120s godot --headless --path . --user-data-dir artifacts/ud_ambiguous --script res://tests/survival_save_ambiguous_write_test.gd -- --survival-save-fault-test > artifacts/ambiguous.log 2>&1
          rc=$?
          cat artifacts/ambiguous.log
          echo "::notice::ambiguous-write exit=$rc $(grep -E 'AMBIGUOUS_WRITE_TRACE|A0 AMBIGUOUS WRITE|  FAIL  |SCRIPT ERROR|Parse Error' artifacts/ambiguous.log | tail -15 | tr '\n' '~')"
          bash tools/ci/gate_log.sh artifacts/ambiguous.log 'ambiguous write' 'A0 AMBIGUOUS WRITE PASSED'
          gate=$?
          [ "$rc" -eq 0 ] && [ "$gate" -eq 0 ]
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a0-ambiguous-write-logs
          path: artifacts/ambiguous*.log
          if-no-files-found: warn
