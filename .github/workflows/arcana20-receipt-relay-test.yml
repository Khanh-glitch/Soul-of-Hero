name: ARCANA20 provisional isolated receipt relay
on:
  workflow_dispatch:
  push:
    branches: [arena/c7b0c4e8-soul-of-hero]
    paths:
      - '.github/workflows/arcana20-receipt-relay-test.yml'
      - 'prototypes/arcana_fusion20/renderer/owner_adapters/**'
permissions:
  contents: read
jobs:
  fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.0
          use-dotnet: false
          include-templates: false
      - name: Import and test synthetic fixtures only
        run: |
          set -o pipefail
          godot --headless --path . --import 2>&1 | tee import.log
          grep -E 'SCRIPT ERROR|Parse Error' import.log | head -20 | while IFS= read -r x; do echo "::notice title=RECEIPT_IMPORT::$x"; done || true
          ! grep -Eq 'SCRIPT ERROR|Parse Error' import.log
          set +e
          godot --headless --path . --script res://prototypes/arcana_fusion20/renderer/owner_adapters/receipt_relay_test.gd 2>&1 | tee result.log
          result=${PIPESTATUS[0]}
          set -e
          grep -E 'RECEIPT_FIXTURE|SCRIPT ERROR|Parse Error|ERROR:' result.log | head -20 | while IFS= read -r x; do echo "::notice title=RECEIPT_FIXTURE::$x"; done || true
          if [ "$result" -ne 0 ]; then echo "::error::Fixture exit $result"; exit "$result"; fi
          grep -Fq RECEIPT_FIXTURE_PASS result.log
          ! grep -Eq 'RECEIPT_FIXTURE_FAIL|SCRIPT ERROR|Parse Error' result.log
