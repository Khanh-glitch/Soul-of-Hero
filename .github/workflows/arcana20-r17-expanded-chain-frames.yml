name: ARCANA20 R18 controlled chain frame review
on:
  workflow_dispatch:
  push:
    branches: [arena/c7b0c4e8-soul-of-hero]
    paths: ['.github/workflows/arcana20-r17-expanded-chain-frames.yml']
permissions:
  actions: read
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        light: [normal, dimmed]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: r18-controlled-chain-9-${{ matrix.light }}
          run-id: 41315747505
          github-token: ${{ github.token }}
          path: capture
      - run: python3 -m pip install --quiet pillow numpy
      - name: Recover paired full-cast encoding
        run: |
          set +e
          python3 tools/arcana20_join/compare_controlled_chain.py capture > "$RUNNER_TEMP/controlled-encode.log" 2>&1
          status=$?
          tail -8 "$RUNNER_TEMP/controlled-encode.log" | while IFS= read -r line; do echo "::notice title=R18_ENCODE::$line"; done
          echo "::notice title=R18_ENCODE_STATUS::$status"
      - uses: actions/upload-artifact@v4
        with:
          name: r18-controlled-encoded-${{ matrix.light }}
          path: capture/controlled/
      - name: Compare restore drift at two decisive phases
        run: |
          python3 - <<'PY2'
          import json,pathlib
          from PIL import Image,ImageChops
          p=pathlib.Path('capture');t=json.loads((p/'timeline.json').read_text());frames=[f for f in t['frames'] if 'controlled_files' in f]
          if not frames: raise SystemExit('no controlled frames')
          mismatches=[]
          for frame in frames:
              a,b,c=[Image.open(p/name).convert('RGB') for name in frame['controlled_files']]
              drift=ImageChops.difference(a,c)
              if drift.getbbox(): mismatches.append({'tick':frame['controlled_tick'],'bbox':drift.getbbox(),'extrema':drift.getextrema()})
          rows={'frames':len(frames),'mismatch_count':len(mismatches),'mismatch_examples':mismatches[:4]}
          print('::notice title=R18_DRIFT::'+json.dumps(rows,separators=(',',':')))
          PY2
      - name: Midpoint baseline
        run: python3 tools/arcana20_join/surface_controlled_chain.py capture 247 0 baseline
      - name: Midpoint foreground
        run: python3 tools/arcana20_join/surface_controlled_chain.py capture 247 1 foreground
      - name: Midpoint restored
        run: python3 tools/arcana20_join/surface_controlled_chain.py capture 247 2 restored
      - name: Cascade baseline
        run: python3 tools/arcana20_join/surface_controlled_chain.py capture 327 0 baseline
      - name: Cascade foreground
        run: python3 tools/arcana20_join/surface_controlled_chain.py capture 327 1 foreground
