name: SOH Veyra Gold UI integration
on:
  pull_request:
    paths:
      - 'web/src/ui/**'
      - 'web/tools/verify-gold-ui.mjs'
      - '.github/workflows/veyra-gold-ui-integration.yml'
  push:
    branches: [integration/veyra-gold-uiux-20261110]
jobs:
  gameplay-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run typecheck:tests
      - run: npx --no-install vitest run src/ui/gold-ui.test.ts
      - run: npx --no-install vitest run --testTimeout=240000 --maxWorkers=2
      - run: npm run build
      - name: Verify real creature atlases accompany singlefile
        run: |
          test -s dist/index.html
          test -d dist/sprites/creatures
          count=$(find dist/sprites/creatures -type f -name '*.png' | wc -l)
          echo "Bundled creature sprite atlases: $count"
          test "$count" -ge 18
      - name: Upload playable Veyra Gold site INCLUDING runtime PNGs
        uses: actions/upload-artifact@v4
        with:
          name: soh-veyra-gold-site-${{ github.sha }}
          path: web/dist/
          if-no-files-found: error
  composed-browser:
    # Playwright 1.55 supports Ubuntu 24.04; ubuntu-latest currently routes to 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx --no-install playwright install --with-deps chromium
      - name: Real Veyra Gold UI browser at 640 and 1280
        run: node tools/verify-gold-ui.mjs
      - name: Upload Chromium screenshots and metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gold-ui-composed-${{ github.sha }}
          path: web/evidence/gold-ui-composed/
          if-no-files-found: warn
