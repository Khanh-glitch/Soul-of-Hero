name: ARCANA20 C16 selected living membranes source diagnostic
on:
  workflow_dispatch:
  push:
    branches: [arena/c7b0c4e8-soul-of-hero]
    paths:
      - 'tools/arcana20_source_compare/c16_membranes_reference.ts'
      - 'tools/arcana20_source_compare/compare_c16_membranes.py'
      - 'prototypes/arcana_fusion20/renderer/c16_membranes_source_compare.gd'
      - 'prototypes/arcana_fusion20/renderer/source_c/c_math.gd'
      - 'prototypes/arcana_fusion20/renderer/source_c/c_worldseed_membranes.gd'
      - 'prototypes/arcana_fusion20/renderer/source_c/c_kit.gd'
      - 'prototypes/arcana_fusion20/renderer/source_c/c_frame.gd'
      - '.github/workflows/arcana20-c16-membranes-compare.yml'
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.0
          use-dotnet: false
          include-templates: false
      - name: Install comparison tools
        run: |
          npm install --prefix "$RUNNER_TEMP/c16-node" esbuild@0.25.12
          python3 -m pip install --quiet pillow numpy
      - name: Capture original C16 membranes
        run: |
          set -o pipefail
          godot --headless --path . --import > import.log 2>&1
          ! grep -Eq 'SCRIPT ERROR:|Parse Error:' import.log
          mkdir -p artifacts/arcana20-c16-membranes-source
          "$RUNNER_TEMP/c16-node/node_modules/.bin/esbuild" tools/arcana20_source_compare/c16_membranes_reference.ts --bundle --platform=node --format=esm --outfile="$RUNNER_TEMP/c16-ref.mjs"
          node "$RUNNER_TEMP/c16-ref.mjs" artifacts/arcana20-c16-membranes-source
      - name: Capture native selected C16 membranes
        run: |
          set -o pipefail
          timeout 600s godot --headless --path . --script res://prototypes/arcana_fusion20/renderer/c16_membranes_source_compare.gd 2>&1 | tee native.log
          grep -Fq 'C16_MEMBRANES_CAPTURE_COMPLETE' native.log
          ! grep -Eq 'SCRIPT ERROR:|Parse Error:' native.log
      - name: Measure authored coverage and color errors
        run: |
          set -o pipefail
          python3 tools/arcana20_source_compare/compare_c16_membranes.py artifacts/arcana20-c16-membranes-source | tee comparison.log
          sed 's/^/::notice::/' comparison.log
      - name: Surface paired source and native light crops
        if: always()
        run: python3 tools/arcana20_source_compare/surface_c16_membranes.py artifacts/arcana20-c16-membranes-source
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arcana20-c16-original-membranes
          path: |
            artifacts/arcana20-c16-membranes-source/
            import.log
            native.log
            comparison.log
          if-no-files-found: warn
