name: ARCANA20 inspect JOIN diagnostic
on:
  workflow_dispatch:
  push:
    branches: [arena/c7b0c4e8-soul-of-hero]
    paths: ['.github/workflows/arcana20-join-triage.yml']
permissions:
  actions: read
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: arcana20-overworld-join-diagnostic
          run-id: 41225009855
          github-token: ${{ github.token }}
          path: review
      - name: Log tail and failure context
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=next(Path('review').rglob('join.log'),None)
          if not p: raise SystemExit('join.log missing')
          lines=p.read_text(errors='replace').splitlines()
          keys=('JOIN_FAIL','SCRIPT ERROR','ERROR:', 'SHADER', 'ARCANA20_JOIN_DIAGNOSTIC')
          hits=[i for i,l in enumerate(lines) if any(k in l for k in keys)]
          for i in hits[-12:]:
              msg=' | '.join(lines[max(0,i-1):i+6]).replace('%','%25').replace('\n',' ')
              print('::notice::JOIN_CONTEXT '+msg[:3600])
          for l in lines:
              if any(x in l for x in ('full visible real HUD', 'A20 mapped real-ground', 'A20 additive debris', 'scene transition', 'route change', 'overworld-to-Home', 'A16', 'C16', 'early completion', 'full lifecycle naturally', 'full visual sequence', 'natural visual completion', 'ARCANA20_JOIN_DIAGNOSTIC')): print('::notice title=KEY_JOIN::'+l.replace('%','%25'))
          ok=[l for l in lines if l.startswith('JOIN_OK') or l.startswith('JOIN_FAIL')]
          print('::notice title=JOIN_ALL::'+ ' | '.join(ok)[:3800].replace('%','%25'))
          leaks=[l for l in lines if any(k in l for k in ('Leaked instance:', 'Resource still in use:', 'ObjectDB instances leaked', 'resources still in use'))]
          for n in range(0,len(leaks),8):
              print('::notice title=LEAK_DETAILS_%02d::'%n + ' | '.join(leaks[n:n+8])[:3700].replace('%','%25'))
          print('::notice::JOIN_END '+ ' | '.join(lines[-12:])[:3600].replace('%','%25'))
          print('::notice::JOIN_FILES '+str([str(p) for p in Path('review').rglob('*') if p.is_file()])[:3500])
          PY
      - name: Expose real-world stills for diagnostic inspection
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          import base64,io
          from pathlib import Path
          from PIL import Image
          files=['world_before','world_02_tick180','world_02_camera_plus_40_20','world_10_tick180','world_17_tick180','world_17_camera_plus_40_20','real_overworld_receipt']
          root=next(Path('review').rglob('arcana20-join'))
          for name in files:
              p=root/(name+'.png')
              if not p.exists(): raise SystemExit('missing '+str(p))
              with Image.open(p) as im:
                  im.thumbnail((240,135),Image.Resampling.NEAREST)
                  im=im.convert('RGB').quantize(colors=16,method=Image.Quantize.MEDIANCUT)
                  while True:
                      f=io.BytesIO(); im.save(f,format='PNG',optimize=True)
                      data=base64.b64encode(f.getvalue()).decode('ascii')
                      if len(data)<=3900: break
                      if im.width<=80: raise SystemExit('thumbnail too large: '+name)
                      im=im.resize((int(im.width*.85),int(im.height*.85)),Image.Resampling.NEAREST)
                  print(f'::notice title=JOIN_IMAGE_{name}::{data}',flush=True)
          PY
      - name: Inspect source B impact crop
        run: |
          python3 - <<'PY'
          import base64, io, pathlib
          from PIL import Image,ImageChops
          root=next(pathlib.Path('review').rglob('arcana20-join'))
          a=Image.open(root/'world_before.png').convert('RGB')
          b=Image.open(root/'world_02_tick180.png').convert('RGB')
          box=ImageChops.difference(a,b).getbbox()
          if not box: raise SystemExit('no visible change')
          cx=(box[0]+box[2])//2; cy=(box[1]+box[3])//2
          crop=(max(0,cx-110),max(0,cy-110),min(b.width,cx+110),min(b.height,cy+110))
          f=io.BytesIO(); b.crop(crop).quantize(colors=32).save(f,format='PNG',optimize=True)
          data=base64.b64encode(f.getvalue()).decode(); chunks=[data[i:i+3500] for i in range(0,len(data),3500)]
          if len(chunks)>9: raise SystemExit('crop too large')
          for i,c in enumerate(chunks): print(f'::notice title=B_CROP_{i:02d}_OF_{len(chunks):02d}::{c}',flush=True)
          print('bounding box',box,'crop',crop,'resolution',b.size)
          PY
      - name: Inspect source C impact crop
        run: |
          python3 - <<'PY'
          import base64, io, pathlib
          from PIL import Image,ImageChops
          root=next(pathlib.Path('review').rglob('arcana20-join'))
          a=Image.open(root/'world_before.png').convert('RGB')
          b=Image.open(root/'world_17_tick180.png').convert('RGB')
          box=ImageChops.difference(a,b).getbbox()
          if not box: raise SystemExit('no visible change')
          cx=(box[0]+box[2])//2; cy=(box[1]+box[3])//2
          crop=(max(0,cx-110),max(0,cy-110),min(b.width,cx+110),min(b.height,cy+110))
          f=io.BytesIO(); b.crop(crop).quantize(colors=32).save(f,format='PNG',optimize=True)
          data=base64.b64encode(f.getvalue()).decode(); chunks=[data[i:i+3500] for i in range(0,len(data),3500)]
          if len(chunks)>9: raise SystemExit('crop too large')
          for i,c in enumerate(chunks): print(f'::notice title=C_CROP_{i:02d}_OF_{len(chunks):02d}::{c}',flush=True)
          print('bounding box',box,'crop',crop,'resolution',b.size)
          PY
      - name: Surface Worldseed lifecycle checks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          lines=next(Path('review').rglob('join.log')).read_text(errors='replace').splitlines()
          selected=[line for line in lines if line.startswith(('JOIN_OK','JOIN_FAIL')) and ('A16' in line or 'C16' in line)]
          for line in selected:
              print('::notice title=WORLDSEED_LIFECYCLE::'+line.replace('%','%25'))
          if len(selected)<10: raise SystemExit('missing Worldseed lifecycle assertions')
          PY
      - name: Expose real-world Worldseed bloom crop
        run: |
          python3 - <<'PY'
          import base64,io,pathlib
          from PIL import Image,ImageChops
          root=next(pathlib.Path('review').rglob('arcana20-join'))
          before=Image.open(root/'world_before.png').convert('RGB')
          image=Image.open(root/'fusion_16_candidate_tick330.png').convert('RGB')
          box=ImageChops.difference(before,image).getbbox()
          if not box: raise SystemExit('Worldseed did not change actual world image')
          cx=(box[0]+box[2])//2;cy=(box[1]+box[3])//2
          crop=(max(0,cx-180),max(0,cy-150),min(image.width,cx+180),min(image.height,cy+150))
          output=io.BytesIO();image.crop(crop).quantize(colors=64).save(output,format='PNG',optimize=True)
          data=base64.b64encode(output.getvalue()).decode();chunks=[data[i:i+3500] for i in range(0,len(data),3500)]
          if len(chunks)>30:raise SystemExit('Worldseed crop too large')
          for i,c in enumerate(chunks):print(f'::notice title=WORLDSEED_CROP_{i:02d}_OF_{len(chunks):02d}::{c}',flush=True)
          print('worldseed_difference_bbox',box,'crop',crop,'physical_resolution',image.size)
          PY
