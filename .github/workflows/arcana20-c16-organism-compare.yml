name: ARCANA20 C16 layered organism source diagnostic
on:
  workflow_dispatch:
  push:
    branches: [arena/c7b0c4e8-soul-of-hero]
    paths:
      - 'tools/arcana20_source_compare/c16_organism_reference.ts'
      - 'tools/arcana20_source_compare/compare_c16_organism.py'
      - 'tools/arcana20_source_compare/surface_c16_organism.py'
      - 'prototypes/arcana_fusion20/renderer/c16_organism_source_compare.gd'
      - 'prototypes/arcana_fusion20/renderer/c16_organism_optimization_test.gd'
      - 'prototypes/arcana_fusion20/renderer/test_reference/c16_organism_unoptimized.gd'
      - 'prototypes/arcana_fusion20/renderer/source_c/c_math.gd'
      - 'prototypes/arcana_fusion20/renderer/source_c/c_worldseed_organism.gd'
      - 'prototypes/arcana_fusion20/renderer/source_c/c_kit.gd'
      - 'prototypes/arcana_fusion20/renderer/source_c/c_frame.gd'
      - '.github/workflows/arcana20-c16-organism-compare.yml'
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.0
          use-dotnet: false
          include-templates: false
      - name: Install comparison tools
        run: |
          npm install --prefix "$RUNNER_TEMP/c16-node" esbuild@0.25.12
          python3 -m pip install --quiet pillow numpy
      - name: Capture original C16 organism
        run: |
          set -o pipefail
          godot --headless --path . --import > import.log 2>&1
          ! grep -Eq 'SCRIPT ERROR:|Parse Error:' import.log
          mkdir -p artifacts/arcana20-c16-organism-source
          "$RUNNER_TEMP/c16-node/node_modules/.bin/esbuild" tools/arcana20_source_compare/c16_organism_reference.ts --bundle --platform=node --format=esm --outfile="$RUNNER_TEMP/c16-ref.mjs"
          node "$RUNNER_TEMP/c16-ref.mjs" artifacts/arcana20-c16-organism-source
      - name: Capture native selected C16 organism
        run: |
          set -o pipefail
          timeout 600s godot --headless --path . --script res://prototypes/arcana_fusion20/renderer/c16_organism_source_compare.gd 2>&1 | tee native.log
          grep -Fq 'C16_ORGANISM_CAPTURE_COMPLETE' native.log
          ! grep -Eq 'SCRIPT ERROR:|Parse Error:' native.log
      - name: Compare exact optimized fields and timings
        run: |
          set -o pipefail
          timeout 600s godot --headless --path . --script res://prototypes/arcana_fusion20/renderer/c16_organism_optimization_test.gd 2>&1 | tee optimization.log
          grep -Fq 'C16_OPT_COMPLETE' optimization.log
          grep -Fq 'C16_OPT_SWEEP_COMPLETE ticks=430 range=150..579' optimization.log
          grep 'C16_OPT_SWEEP_COMPLETE' optimization.log | sed 's/^/::notice title=C16_OPT_SWEEP::/'
          ! grep -Eq 'SCRIPT ERROR:|Parse Error:|C16_OPT_MISMATCH' optimization.log
          grep -E 'C16_OPT_EXACT tick=(180|300|381|456|510|558) ' optimization.log | sed 's/^/::notice title=C16_OPT::/'
      - name: Measure authored coverage and color errors
        run: |
          set -o pipefail
          python3 tools/arcana20_source_compare/compare_c16_organism.py artifacts/arcana20-c16-organism-source | tee comparison.log
          sed 's/^/::notice::/' comparison.log
      - name: Surface C16 source/native ink crops
        if: always()
        run: |
          if test -f artifacts/arcana20-c16-organism-source/native_381.png; then
            python3 tools/arcana20_source_compare/surface_c16_organism.py artifacts/arcana20-c16-organism-source
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arcana20-c16-original-organism
          path: |
            artifacts/arcana20-c16-organism-source/
            import.log
            native.log
            comparison.log
            optimization.log
          if-no-files-found: warn
