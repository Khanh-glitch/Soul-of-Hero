name: A0 normal entry, home and separate-process restart
on:
  push:
    branches: [arena/dea2428e-soul-of-hero]
    paths: ['tests/survival_normal_entry_home_restart_test.gd', 'tests/survival_normal_home_journey_test.gd', 'tests/survival_normal_input_gather_test.gd', 'tests/survival_foundation_test.gd', 'game/app/**', 'game/ui/screens/home/**', 'game/ui/screens/title/**', 'game/ui/screens/hub/**', 'game/survival/**', 'game/overworld/**', 'game/characters/knight/**', 'game/autoload/**', '.github/workflows/a0-normal-entry-home-restart.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-entry-restart:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.0
          use-dotnet: false
          include-templates: false
      - name: Import
        run: |
          mkdir -p artifacts/ud_import artifacts/ud_entry
          timeout 180s godot --headless --path . --user-data-dir artifacts/ud_import --import > artifacts/entry-import.log 2>&1
      - name: New profile through actual menus and full home journey
        shell: bash
        run: |
          set +e
          timeout --signal=TERM --kill-after=15s 1200s xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 godot --path . --rendering-method gl_compatibility --rendering-driver opengl3 --audio-driver Dummy --user-data-dir artifacts/ud_entry --resolution 1280x720 --windowed --script res://tests/survival_normal_entry_home_restart_test.gd > artifacts/entry-first.log 2>&1
          rc=$?
          cat artifacts/entry-first.log
          echo "::notice::entry process 1 exit=$rc $(grep -E '^ENTRY_HOME_|^NORMAL ENTRY|  FAIL  |SCRIPT ERROR|Parse Error' artifacts/entry-first.log | tail -16 | tr '\n' '~')"
          grep "^A0_SAVE_DIFF " artifacts/entry-first.log | while IFS= read -r line; do echo "::notice::$line"; done
          bash tools/ci/gate_log.sh artifacts/entry-first.log 'A0 entry home' 'NORMAL ENTRY HOME RESTART PASSED'
          gate=$?
          [ "$rc" -eq 0 ] && [ "$gate" -eq 0 ]
      - name: Independent new Godot process and actual save recovery
        shell: bash
        run: |
          set +e
          timeout --signal=TERM --kill-after=15s 240s xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 godot --path . --rendering-method gl_compatibility --rendering-driver opengl3 --audio-driver Dummy --user-data-dir artifacts/ud_entry --resolution 1280x720 --windowed --script res://tests/survival_normal_entry_home_restart_test.gd -- --verify-separate-process > artifacts/entry-second.log 2>&1
          rc=$?
          cat artifacts/entry-second.log
          echo "::notice::entry process 2 exit=$rc $(grep -E '^ENTRY_HOME_|^NORMAL ENTRY|  FAIL  |SCRIPT ERROR|Parse Error' artifacts/entry-second.log | tail -16 | tr '\n' '~')"
          grep "^A0_SAVE_DIFF " artifacts/entry-second.log | while IFS= read -r line; do echo "::notice::$line"; done
          bash tools/ci/gate_log.sh artifacts/entry-second.log 'A0 independent restart' 'NORMAL ENTRY HOME RESTART PASSED'
          gate=$?
          [ "$rc" -eq 0 ] && [ "$gate" -eq 0 ]
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: normal-entry-home-restart-logs
          path: artifacts/entry-*.log
