  godot-round12-composed-runtime-native:
    name: A1+A0+A6 EXACT-SHA RUNTIME CONTRACT / ${{ matrix.profile }} (ISOLATED)
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: reproduction
            a0_sha: 62f6a32d08d319bfdcd28235786558f54f49b420
            a6_sha: 6d71410a370df805f8b29a018b61380d6c233b65
          - profile: forward-86ac20ba-6518c098
            a0_sha: 86ac20ba6ad6e80e964ef15af8f1fe48f11ee020
            a6_sha: 6518c09835a273ac1e7b91dc5e6712d6a4c3863e
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      A1_REPRO_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      A0_REPRO_SHA: ${{ matrix.a0_sha }}
      A6_REPRO_SHA: ${{ matrix.a6_sha }}
      COMPOSE_PROFILE: ${{ matrix.profile }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compose exact A1 head with reproduction A0/A6 through A0 owner fences
        run: |
          set -euo pipefail
          mkdir -p artifacts/a1-round12-composed
          printf '%s\n' "$A1_REPRO_SHA" "$A0_REPRO_SHA" "$A6_REPRO_SHA" | tee artifacts/a1-round12-composed/exact-owner-shas.txt
          git fetch --no-tags origin "$A1_REPRO_SHA" "$A0_REPRO_SHA" "$A6_REPRO_SHA"
          git worktree add --detach "$RUNNER_TEMP/a0-repro" "$A0_REPRO_SHA"
          python3 "$RUNNER_TEMP/a0-repro/tools/a0/compose_owners.py" \
            --repo "$RUNNER_TEMP/a0-repro" --out "$GITHUB_WORKSPACE/.composition" --copy-base \
            --base-ref "$A0_REPRO_SHA" --owner a1="$A1_REPRO_SHA" --owner a6="$A6_REPRO_SHA"
          python3 "$RUNNER_TEMP/a0-repro/tools/a0/check_composition.py" .composition \
            | tee artifacts/a1-round12-composed/composition-seats.log
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, subprocess
          root = pathlib.Path('.composition')
          report = json.loads((root / 'composition.json').read_text())
          assert report['base']['sha'] == os.environ['A0_REPRO_SHA']
          assert report['owners']['a1']['sha'] == os.environ['A1_REPRO_SHA']
          assert report['owners']['a6']['sha'] == os.environ['A6_REPRO_SHA']
          assert not [c for c in report['conflicts'] if not c.get('resolved')], report['conflicts']
          def git_bytes(sha, path):
              return subprocess.check_output(['git', 'show', f'{sha}:{path}'])
          a1_paths = subprocess.check_output([
              'git', 'ls-tree', '-r', '--name-only', os.environ['A1_REPRO_SHA'], '--',
              'data/survival/world', 'game/survival/world'], text=True).splitlines()
          a1_paths.append('tests/survival/world/round12_deep_world_native_test.gd')
          for path in a1_paths:
              assert (root / path).is_file(), f'A1_OWNER_FILE_ABSENT:{path}'
              assert (root / path).read_bytes() == git_bytes(os.environ['A1_REPRO_SHA'], path), f'A1_OWNER_FILE_DRIFT:{path}'
          assert len(a1_paths) >= 190, len(a1_paths)
          required_copied = {
              'data/survival/world/a1_round12_runtime_contract.v1.json',
              'data/survival/world/a1_round12_spawn_index.v1.json',
              'game/survival/world/a1_authored_world_reader.gd',
              'game/survival/world/a1_authored_world_stream.gd',
              'game/survival/world/a1_runtime_compatibility.gd',
              'tests/survival/world/round12_deep_world_native_test.gd',
          }
          assert required_copied.issubset(set(report['copied']['a1'])), report['copied']['a1']
          manifest_text = re.sub(r'^\s*#.*$', '', (root / 'tools/a0/ownership.json').read_text(), flags=re.M)
          manifest = json.loads(manifest_text)
          rulings = manifest.get('rulings', {})
          for owner, rows in report['copied'].items():
              scopes = report['owners'][owner]['scopes']
              for path in rows:
                  in_scope = any(path == scope.rstrip('/') or path.startswith(scope) for scope in scopes)
                  ruling = rulings.get(path, {})
                  accepted = ruling.get('kind') == 'accept_owner' and ruling.get('owner') == owner
                  assert in_scope or accepted, f'OUT_OF_SCOPE_SOURCE_MUTATION:{owner}:{path}'
          pathlib.Path('artifacts/a1-round12-composed/owner-file-validation.json').write_text(json.dumps({
              'ok': True, 'a1_exact_files': len(a1_paths), 'required_copied': sorted(required_copied),
              'copied': report['copied'], 'out_of_scope_source_mutation': False,
          }, indent=2, sort_keys=True) + '\n')
          provenance = {
              'fixture_knight_script': {'owner': 'a0', 'sha': os.environ['A0_REPRO_SHA'],
                  'path': 'game/characters/knight/knight.gd'},
              'knight_scene': {'owner': 'a6', 'sha': os.environ['A6_REPRO_SHA'],
                  'path': 'game/characters/knight/knight.tscn'},
              'legacy_world': {'owner': 'a0', 'sha': os.environ['A0_REPRO_SHA'],
                  'path': 'game/overworld/overworld_world.gd'},
              'legacy_traversability': {'owner': 'a0', 'sha': os.environ['A0_REPRO_SHA'],
                  'path': 'game/overworld/overworld_traversability.gd'},
              'project_settings': {'owner': 'a0', 'sha': os.environ['A0_REPRO_SHA'],
                  'path': 'project.godot'},
          }
          for name, row in provenance.items():
              expected = hashlib.sha256(git_bytes(row['sha'], row['path'])).hexdigest()
              actual = hashlib.sha256((root / row['path']).read_bytes()).hexdigest()
              assert actual == expected, (name, actual, expected)
              row['sha256'] = actual
          controller = root / 'game/overworld/chapter1_overworld.gd'
          merged = root / 'tools/a0/merges/chapter1_overworld.gd.merged'
          assert controller.read_bytes() == merged.read_bytes()
          provenance['legacy_controller'] = {'owner': 'a0_reviewed_merge',
              'sha256': hashlib.sha256(controller.read_bytes()).hexdigest()}
          pathlib.Path('artifacts/a1-round12-composed/runtime-provenance.json').write_text(
              json.dumps(provenance, indent=2, sort_keys=True) + '\n')
          PY
          git -C .composition init -q
          git -C .composition add -A
          composed_tree=$(git -C .composition write-tree)
          python3 - "$composed_tree" <<'PY'
          import json, os, pathlib, sys
          value = {
              'schema': 'soh.a1.composed_source_identity.v1',
              'composed_tree_sha1': sys.argv[1], 'algorithm': 'git write-tree over A0 composer output before Godot import',
              'base_a0': os.environ['A0_REPRO_SHA'], 'owner_a1': os.environ['A1_REPRO_SHA'],
              'owner_a6': os.environ['A6_REPRO_SHA'], 'profile': os.environ['COMPOSE_PROFILE'],
              'scope': 'A0+A1+A6 source composition; isolated A1 native fixture only; not production activation',
          }
          pathlib.Path('artifacts/a1-round12-composed/composed-source.json').write_text(
              json.dumps(value, indent=2, sort_keys=True) + '\n')
          print('COMPOSED_SOURCE', json.dumps(value, sort_keys=True))
          PY
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.0
