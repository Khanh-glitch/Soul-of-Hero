          python3 tools/survival/worldgen/compile_round12_runtime.py --check \
            --out "$GITHUB_WORKSPACE/artifacts/a1-round12-composed/round12_native_inputs.json" \
            | tee "$GITHUB_WORKSPACE/artifacts/a1-round12-composed/compile.log"
      - name: Import exact composed project for the isolated A1 native fixture
        run: |
