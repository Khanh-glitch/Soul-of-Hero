          mkdir -p artifacts/ud_a1_round12_composed_import
          timeout --signal=TERM --kill-after=10s 300s godot --headless \
            --path .composition --user-data-dir artifacts/ud_a1_round12_composed_import \
            --import >artifacts/a1-round12-composed/godot-import.log 2>&1
          rc=$?
          echo "composed Round 12 import exit_code=$rc"
          tail -60 artifacts/a1-round12-composed/godot-import.log
          exit $rc
      - name: Measure composed Round 12 drive and capture budget
        run: |
