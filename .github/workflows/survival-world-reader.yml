          budget=$(python3 -c "import json; print(json.load(open('artifacts/a1-round12-composed/native_budget.json'))['timeout_seconds'])")
          echo "Measured composed Round 12 full-run timeout: ${budget}s"
          mkdir -p artifacts/a1-round12-composed/full artifacts/ud_a1_round12_composed
          timeout --signal=TERM --kill-after=15s "${budget}s" xvfb-run -a -s "-screen 0 3840x2160x24" env LIBGL_ALWAYS_SOFTWARE=1 \
            godot --path .composition --rendering-method gl_compatibility --rendering-driver opengl3 --audio-driver Dummy \
            --user-data-dir artifacts/ud_a1_round12_composed --windowed --fixed-fps 60 \
            --script res://tests/survival/world/round12_deep_world_native_test.gd -- \
            --inputs="$GITHUB_WORKSPACE/artifacts/a1-round12-composed/round12_native_inputs.json" \
            --out-root="$GITHUB_WORKSPACE/artifacts/a1-round12-composed/full" \
            --resolutions=1280x720,2560x1440,3840x2160 \
            >artifacts/a1-round12-composed/full/godot-round12.log 2>&1
          rc=$?
          echo "composed Round 12 full fixture exit_code=$rc"
          cat artifacts/a1-round12-composed/full/godot-round12.log
          exit $rc
      - name: Composed native integrity / interface / provenance anti-vacuity gate
        if: always()
        run: |
          log=artifacts/a1-round12-composed/full/godot-round12.log
          [ -f "$log" ] || { echo "::error::no composed Round 12 full log"; exit 1; }
          ! grep -q 'SCRIPT ERROR' "$log"
          checks=$(grep -cE '^A1_R12 (PASS|FAIL): ' "$log" || true)
          captures=$(grep -c 'nonblank native source capture' "$log" || true)
          echo "composed Round 12 assertions=${checks}; captures=${captures}"
          [ "${checks:-0}" -ge 230 ] && [ "${captures:-0}" -ge 69 ]
          grep -q 'A1 ROUND12 NATIVE FIXTURE PASSED' "$log"
          grep -q 'strict reader and live stream configure' "$log"
          grep -q 'real Hero and legacy runtime semantic interfaces pass' "$log"
          grep -q 'D051 consumer scene override requires physical behavior, never Knight visual/script identity' "$log"
          grep -q 'no-teleport inset -> salvage -> Quarry -> Orchard -> Mill -> inset return' "$log"
          grep -q 'reloaded dynamic detour physical return' "$log"
          for named in \
            'fail-closed plan_identity -> runtime_plan_hash' \
            'fail-closed chunk_integrity -> source_chunk_hash' \
            'fail-closed a8_source_identity -> dependency_hash:a8_quarry' \
            'fail-closed legacy_tile_art_integrity -> dependency_hash:legacy_tiles_texture' \
            'fail-closed spawn_index_semantics -> spawn_cells_hash' \
            'fail-closed spawn_index_binding -> spawn_index_stale' \
            'fail-closed player_shape_interface -> runtime_interface:PLAYER_BODY_SHAPE_SIZE' \
            'fail-closed legacy_world_interface -> runtime_interface:LEGACY_WORLD_METHOD_IS_WALKABLE'; do
            grep -q "$named" "$log" || { echo "::error::missing negative control: $named"; exit 1; }
          done
          python3 - <<'PY'
          import hashlib, json, pathlib
          report=json.load(open('artifacts/a1-round12-composed/full/round12_native_report.json'))
          provenance=json.load(open('artifacts/a1-round12-composed/runtime-provenance.json'))
          observed=report['runtime_observed_sha256']
          for key, row in provenance.items():
              assert observed[key]['sha256'] == row['sha256'], (key, observed[key], row)
          assert len(report['runtime_negative_controls']) == 8
          assert all(row['pass'] and row['refused'] for row in report['runtime_negative_controls'])
          assert report['source_report']['ok'] and report['source_report']['verified_chunks'] == 192
          assert report['source_report']['runtime_compatibility']['interfaces']['player']['identity_policy'] == 'PHYSICAL_INTERFACE_ONLY_NO_VISUAL_OR_SCRIPT_IDENTITY'
          assert len(report['journeys']) == 37 and all(row['ok'] for row in report['journeys'])
          assert report['dispositions']['PRODUCTION_MOUNTED']=='NOT_TESTED'
          assert report['dispositions']['PLAYER_PLAYABLE']=='NOT_TESTED'
          PY
      - name: Validate composed native report and capture bytes independently
        if: always()
        run: |
          [ -f artifacts/a1-round12-composed/full/round12_native_report.json ] || { echo "::error::missing composed Round 12 report"; exit 1; }
          python3 tools/survival/worldgen/validate_round12_native.py \
            --report artifacts/a1-round12-composed/full/round12_native_report.json \
            --inputs artifacts/a1-round12-composed/round12_native_inputs.json \
            --budget artifacts/a1-round12-composed/native_budget.json \
            --out artifacts/a1-round12-composed/full/native_validation.json
      - name: Upload exact-SHA composed Round 12 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a1-round12-composed-runtime-native-evidence-${{ matrix.profile }}
          path: |
            artifacts/a1-round12-composed/
            .composition/composition.json
            .composition/CONFLICTS.md
          if-no-files-found: warn
          retention-days: 14
      - name: Mirror exact-SHA composed evidence as Git blobs
        if: always()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/ci/mirror_native_evidence.py --root artifacts/a1-round12-composed
