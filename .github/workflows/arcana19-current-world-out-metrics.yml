name: ARCANA19 current-world OUT image delta diagnostics
on:
  workflow_dispatch:
  push:
    branches: [arena/c7b0c4e8-soul-of-hero]
    paths:
      - 'prototypes/arcana_fusion20/renderer/arcana20_d19_out_world_metrics.py'
      - '.github/workflows/arcana19-current-world-out-metrics.yml'
permissions:
  actions: read
  contents: read
jobs:
  image-delta:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: arcana20-current-phase-sweep-16-normal
          run-id: 41241455013
          github-token: ${{ github.token }}
          path: phase
      - run: python3 -m pip install --quiet pillow numpy
      - name: Measure actual-world frame deltas from no-cast baseline
        run: |
          set -o pipefail
          python3 prototypes/arcana_fusion20/renderer/arcana20_d19_out_world_metrics.py phase | tee metrics.log
          sed 's/^/::notice title=D19_WORLD_OUT::/' metrics.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arcana19-world-out-image-deltas
          path: metrics.log
