name: ARCANA Fusion20 Renderer - Native 20-skill lifecycle gate

on:
  workflow_dispatch:
  push:
    branches: [arena/c7b0c4e8-soul-of-hero]
    paths:
      - 'prototypes/arcana_fusion20/renderer/**'
      - '.github/workflows/arcana-fusion20-renderer.yml'
      - 'tools/arcana20_review/**'

permissions:
  contents: read

jobs:
  renderer-lifecycle:
    name: 20 canonical IDs cast/contact/finish/cancel on Godot 4.7
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.0
          use-dotnet: false
          include-templates: false
      - name: Import project
        shell: bash
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=10s 240s \
            godot --headless --path . --import 2>&1 | tee import.log
      - name: Godot check-only per renderer script
        shell: bash
        run: |
          : > checkonly.log
          while IFS= read -r f; do
            rc=0
            timeout 60s godot --headless --path . --check-only --script "res://$f" > checkone.log 2>&1 || rc=$?
            if [ "$rc" -ne 0 ] || grep -Eq 'SCRIPT ERROR|Parse Error|ERROR:' checkone.log; then
              echo "CHECKFAIL $f (exit $rc)" >> checkonly.log
              head -12 checkone.log | sed "s|^|$f :: |" >> checkonly.log
            fi
          done < <(find prototypes/arcana_fusion20/renderer -name '*.gd' | sort)
          head -9 checkonly.log | while IFS= read -r l; do echo "::error::$l"; done || true
          if [ -s checkonly.log ]; then
            echo 'check-only compile errors present — failing job' >&2
            exit 1
          fi
      - name: Renderer lifecycle test (all 20 skills)
        shell: bash
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=10s 180s \
            godot --headless --path . --script \
              res://prototypes/arcana_fusion20/renderer/arcana20_renderer_test.gd \
            2>&1 | tee renderer-test.log
          grep -Fq 'ARCANA20_RENDER_RESULT PASS' renderer-test.log
          grep -E 'SCRIPT ERROR:|Parse Error:|ERROR:' renderer-test.log | head -8 | while IFS= read -r l; do echo "::error::$l"; done || true
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|ARCANA20_RENDER_FAIL' renderer-test.log; then
            echo 'renderer parse/runtime/assertion failure' >&2
            exit 1
          fi
      - name: Upload parity evidence (heatmaps + native frames)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arcana20-parity-evidence
          path: prototypes/arcana_fusion20/renderer/evidence_out/
          if-no-files-found: ignore
      - name: All-20 visual capture (contact sheets + anim frames)
        shell: bash
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=10s 1200s \
            godot --headless --path . --script \
              res://prototypes/arcana_fusion20/renderer/arcana20_capture.gd \
            2>&1 | tee capture.log
          grep -Fq 'ARCANA20_CAPTURE_RESULT PASS' capture.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|ARCANA20_CAPTURE_FAIL' capture.log; then
            echo 'capture failure' >&2
            exit 1
          fi
      - name: Build animated previews (GIF) from capture frames
        shell: bash
        run: |
          python3 -m pip install --quiet pillow
          python3 - << 'PYEOF'
          import glob, os
          from PIL import Image
          base = 'prototypes/arcana_fusion20/renderer/evidence_out/review'
          for d in sorted(glob.glob(base + '/skill_*/anim')):
              frames = sorted(glob.glob(d + '/f_*.png'))
              if not frames:
                  continue
              imgs = [Image.open(f).convert('RGBA') for f in frames]
              out = os.path.join(os.path.dirname(d), 'preview.gif')
              imgs[0].save(out, save_all=True, append_images=imgs[1:], duration=400, loop=0)
              print('gif', out, len(imgs))
          PYEOF
      - name: Expose source contact-sheet thumbnails for review
        if: always()
        run: |
          python3 -m pip install --quiet pillow
          python3 tools/arcana20_review/emit_thumbnails.py source
      - name: D source/native RGB spatial diagnostics (not a parity gate)
        if: always()
        shell: bash
        run: |
          if compgen -G 'prototypes/arcana_fusion20/renderer/evidence_out/review/skill_19/native_t*.png' > /dev/null; then
            python3 -m pip install --quiet pillow
            python3 tools/arcana19_d_capture/compare.py | tee d-compare.log
            while IFS= read -r l; do echo "::notice::$l"; done < d-compare.log
          else
            echo 'No D native captures produced; comparison remains unmeasured.'
          fi
      - name: Upload all-20 visual review package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arcana20-visual-review
          path: prototypes/arcana_fusion20/renderer/evidence_out/review/
          if-no-files-found: ignore
