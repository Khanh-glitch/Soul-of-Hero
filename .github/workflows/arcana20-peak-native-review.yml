name: ARCANA20 all-20 native peak review surfaces
on:
  workflow_dispatch:
  push:
    branches: [arena/c7b0c4e8-soul-of-hero]
    paths: ['.github/workflows/arcana20-peak-native-review.yml']
permissions:
  contents: read
  actions: read
jobs:
  peaks:
    strategy:
      fail-fast: false
      matrix:
        lighting: [normal, dimmed]
        first: [1, 6, 11, 16]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FIRST: ${{ matrix.first }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: arcana20-current-phase-sweep-${{ matrix.first }}-${{ matrix.lighting }}
          run-id: 41270259664
          github-token: ${{ github.token }}
          path: captures
      - run: python3 -m pip install --quiet pillow
      - name: Surface native catalog peak offset 0
        run: python3 prototypes/arcana_fusion20/renderer/arcana20_peak_review_surface.py captures $((FIRST + 0))
      - name: Surface native catalog peak offset 1
        run: python3 prototypes/arcana_fusion20/renderer/arcana20_peak_review_surface.py captures $((FIRST + 1))
      - name: Surface native catalog peak offset 2
        run: python3 prototypes/arcana_fusion20/renderer/arcana20_peak_review_surface.py captures $((FIRST + 2))
      - name: Surface native catalog peak offset 3
        run: python3 prototypes/arcana_fusion20/renderer/arcana20_peak_review_surface.py captures $((FIRST + 3))
      - name: Surface native catalog peak offset 4
        run: python3 prototypes/arcana_fusion20/renderer/arcana20_peak_review_surface.py captures $((FIRST + 4))
