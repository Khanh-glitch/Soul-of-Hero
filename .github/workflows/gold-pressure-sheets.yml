name: Hairline Gold 14-sheet source port
on:
  push:
    branches: [feature/vfx-lab-gate0-20261027]
    paths:
      - '.github/workflows/gold-pressure-sheets.yml'
      - 'prototypes/gold_fidelity/*plate*'
      - 'prototypes/gold_fidelity/*ground*'
      - 'prototypes/gold_fidelity/hairline_*'
      - 'prototypes/gold_fidelity/tests/*plate*'
      - 'prototypes/gold_fidelity/tests/hairline_*'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sheet-port:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.0
          use-dotnet: false
          include-templates: false
      - name: Parse and import
        shell: bash
        run: |
          set -euo pipefail
          timeout 120s godot --headless --editor --path . --import --quit 2>&1 | tee /tmp/import.log
          if grep -E 'SCRIPT ERROR:|Parse Error:' /tmp/import.log; then exit 1; fi
      - name: Numerical original-source parity of 14-sheet geometry
        shell: bash
        run: |
          set -euo pipefail
          timeout 60s godot --headless --path . --script res://prototypes/gold_fidelity/tests/plate_source_geometry_test.gd 2>&1 | tee /tmp/geometry.log
          grep -F 'GOLD_PLATE_GEOMETRY: PASS' /tmp/geometry.log
          if grep -E 'SCRIPT ERROR:|Parse Error:' /tmp/geometry.log; then exit 1; fi
      - name: Rebuild the actual gold source courtyard, exact 518400 RGBA bytes
        shell: bash
        run: |
          set -euo pipefail
          timeout 75s godot --headless --path . --script res://prototypes/gold_fidelity/tests/hairline_source_floor_test.gd 2>&1 | tee /tmp/gold-floor.log
          grep -F 'GOLD_SOURCE_FLOOR: PASS' /tmp/gold-floor.log
          if grep -E 'SCRIPT ERROR:|Parse Error:' /tmp/gold-floor.log; then exit 1; fi
      - name: Compare native ground writes with source TypeScript pixel hashes
        shell: bash
        run: |
          set -euo pipefail
          timeout 60s godot --headless --path . --script res://prototypes/gold_fidelity/tests/hairline_ground_source_test.gd 2>&1 | tee /tmp/ground.log
          grep -F 'GOLD_GROUND_SOURCE_CPU: PASS' /tmp/ground.log
          if grep -E 'SCRIPT ERROR:|Parse Error:' /tmp/ground.log; then exit 1; fi
      - name: Shader compile and native plate capture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts/gold_fidelity
          timeout 90s xvfb-run -a -s '-screen 0 1280x720x24' env LIBGL_ALWAYS_SOFTWARE=1 godot --audio-driver Dummy --path . --rendering-method gl_compatibility --script res://prototypes/gold_fidelity/tests/plate_native_capture.gd 2>&1 | tee /tmp/plates.log
          grep -F 'GOLD_PRESSURE_SHEETS_NATIVE: PASS' /tmp/plates.log
          if grep -Ei 'SCRIPT ERROR:|Parse Error:|Shader compilation failed|Shader error:' /tmp/plates.log; then exit 1; fi
      - name: Render native gold ground plus sheets plus segment at two phases
        shell: bash
        run: |
          set -euo pipefail
          timeout 120s xvfb-run -a -s '-screen 0 1280x720x24' env LIBGL_ALWAYS_SOFTWARE=1 godot --audio-driver Dummy --path . --rendering-method gl_compatibility --script res://prototypes/gold_fidelity/tests/hairline_component_scene_capture.gd 2>&1 | tee /tmp/composite.log
          grep -F 'GOLD_SOURCE_COMPOSITE: PASS 2 native snapshots' /tmp/composite.log
          if grep -Ei 'SCRIPT ERROR:|Parse Error:|Shader compilation failed|Shader error:' /tmp/composite.log; then exit 1; fi
      - name: Upload unretouched native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hairline-gold-source-14-sheets
          path: |
            .artifacts/gold_fidelity/hairline_14_source_plates.png
            .artifacts/gold_fidelity/hairline_ground_plates_146.png
            .artifacts/gold_fidelity/hairline_ground_rupture_270.png
          if-no-files-found: warn
