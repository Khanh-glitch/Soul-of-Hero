name: ARCANA20 current-A0 overworld JOIN diagnostics
on:
  workflow_dispatch:
  push:
    branches: [arena/c7b0c4e8-soul-of-hero]
    paths:
      - 'prototypes/arcana_fusion20/renderer/**'
      - '!prototypes/arcana_fusion20/renderer/**/*.md'
      - 'tools/arcana20_join/**'
      - '.github/workflows/arcana20-current-overworld-join.yml'
permissions:
  contents: read
jobs:
  isolated-join:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Fetch immutable owner objects
        run: |
          git fetch --depth=1 --no-tags origin e5529c13335d5da8272d7b9d2cfb74897dcaf7e2 6b801554a6af95424b4e39dd29f43c146aa13848 2cb1a3c5f093724eb9fecbdf45909ccb611f7b32 18e7afcbd576bbd9bfbcc509b2ee13216186a522 e505173edd119fdd955cf6249511b575a5468440
      - name: Assemble isolated JOIN QA without a merge or checkout
        run: python3 tools/arcana20_join/assemble.py --out "$RUNNER_TEMP/arcana20-join" --avfx-sha "$GITHUB_SHA" --a0-sha e5529c13335d5da8272d7b9d2cfb74897dcaf7e2
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.0
          use-dotnet: false
          include-templates: false
      - name: Import pinned composition
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/arcana20-join/artifacts"
          timeout --signal=TERM --kill-after=10s 300s godot --headless --path "$RUNNER_TEMP/arcana20-join" --import 2>&1 | tee "$RUNNER_TEMP/arcana20-join/artifacts/join-import.log"
          ! grep -Eq 'SCRIPT ERROR:|Parse Error:' "$RUNNER_TEMP/arcana20-join/artifacts/join-import.log"
      - name: Isolated no-AVFX overworld leak baseline
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 300s xvfb-run -a -s '-screen 0 1280x720x24' env LIBGL_ALWAYS_SOFTWARE=1 ARCANA20_BASELINE_ONLY=1 \
            godot --verbose --path "$RUNNER_TEMP/arcana20-join" --rendering-method gl_compatibility --audio-driver Dummy --resolution 1280x720 --windowed \
            --user-data-dir "$RUNNER_TEMP/arcana20-baseline-user" --script res://prototypes/arcana_fusion20/renderer/arcana20_overworld_join_test.gd \
            2>&1 | tee "$RUNNER_TEMP/arcana20-join/artifacts/baseline.log"
          grep -Fq 'ARCANA20_JOIN_DIAGNOSTIC PASS' "$RUNNER_TEMP/arcana20-join/artifacts/baseline.log"
          ! grep -Eq 'SCRIPT ERROR:|Parse Error:|JOIN_FAIL' "$RUNNER_TEMP/arcana20-join/artifacts/baseline.log"
      - name: Normal AppRoot entry and real-world C diagnostic
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 1200s xvfb-run -a -s '-screen 0 1280x720x24' env LIBGL_ALWAYS_SOFTWARE=1 \
            godot --verbose --path "$RUNNER_TEMP/arcana20-join" --rendering-method gl_compatibility --audio-driver Dummy --resolution 1280x720 --windowed \
            --user-data-dir "$RUNNER_TEMP/arcana20-join-user" --script res://prototypes/arcana_fusion20/renderer/arcana20_overworld_join_test.gd \
            2>&1 | tee "$RUNNER_TEMP/arcana20-join/artifacts/join.log"
          grep -Fq 'ARCANA20_JOIN_DIAGNOSTIC PASS' "$RUNNER_TEMP/arcana20-join/artifacts/join.log"
          ! grep -Eq 'SCRIPT ERROR:|Parse Error:|Shader compilation failed|JOIN_FAIL' "$RUNNER_TEMP/arcana20-join/artifacts/join.log"
      - name: Surface C16 living-growth world assertions
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/arcana20-join/artifacts/join.log"; then
            grep -E 'JOIN_(OK|FAIL).*C16 (living membranes active|original membranes independently|original cellular organism|original leaflets|original core|original organism, leaflets and core selected)' "$RUNNER_TEMP/arcana20-join/artifacts/join.log" | sed 's/^/::notice title=C16_WORLD_GROWTH::/' || true
          fi
      - name: Surface paired C16 living-growth world crops
        if: always()
        run: |
          dir="$RUNNER_TEMP/arcana20-join/artifacts/arcana20-join"
          if test -f "$dir/fusion_16_living_membranes_with_a.png" && test -f "$dir/fusion_16_a_without_c_living_membranes.png"; then
            python3 -m pip install --quiet pillow numpy
            python3 prototypes/arcana_fusion20/renderer/arcana20_surface_worldseed.py "$dir"
          fi
      - name: Surface real-world baseline for C16 organism trial
        if: always()
        run: |
          dir="$RUNNER_TEMP/arcana20-join/artifacts/arcana20-join"
          if test -f "$dir/fusion_16_trial_without_organism.png" && test -f "$dir/fusion_16_trial_with_organism.png"; then
            python3 prototypes/arcana_fusion20/renderer/arcana20_surface_worldseed.py "$dir" organism without_organism
          fi
      - name: Surface original C16 organism on the real world
        if: always()
        run: |
          dir="$RUNNER_TEMP/arcana20-join/artifacts/arcana20-join"
          if test -f "$dir/fusion_16_trial_without_organism.png" && test -f "$dir/fusion_16_trial_with_organism.png"; then
            python3 prototypes/arcana_fusion20/renderer/arcana20_surface_worldseed.py "$dir" organism with_organism
          fi
      - name: Summarize findings
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/arcana20-join/artifacts/baseline.log"; then
            grep -E 'JOIN_BASELINE|ObjectDB instances were leaked|resources still in use|Resource still in use:' "$RUNNER_TEMP/arcana20-join/artifacts/baseline.log" | while IFS= read -r line; do echo "::notice title=NO_FX_BASELINE::$line"; done || true
          fi
          if test -f "$RUNNER_TEMP/arcana20-join/artifacts/join.log"; then
            grep -E 'JOIN_(OK|FAIL|WORLD)|ARCANA20_JOIN_DIAGNOSTIC|SCRIPT ERROR|Parse Error|SHADER ERROR' "$RUNNER_TEMP/arcana20-join/artifacts/join.log" | tail -30 | while IFS= read -r line; do echo "::notice::$line"; done || true
            grep -E 'Leaked instance:|Resource still in use:|ObjectDB instances were leaked|resources still in use' "$RUNNER_TEMP/arcana20-join/artifacts/join.log" | head -15 | while IFS= read -r line; do echo "::warning title=JOIN_SHUTDOWN_LEAK::$line"; done || true
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arcana20-current-overworld-join-diagnostic
          path: |
            ${{ runner.temp }}/arcana20-join/arcana20_join_manifest.json
            ${{ runner.temp }}/arcana20-join/artifacts/
          if-no-files-found: warn
