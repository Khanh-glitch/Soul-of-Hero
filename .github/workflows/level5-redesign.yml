name: Level 5 — Blood Crucible redesign (native Godot 4.7)
on:
  push:
    branches:
      - arena/6e89e68d-soul-of-hero
    paths:
      - "tools/level5/**"
      - "tools/captures/level5_blood_crucible_capture.*"
      - "data/levels/chapter_1_level_5.json"
      - "prototypes/level5/**"
      - "docs/level-design/level5-redesign/**"
      - ".github/workflows/level5-redesign.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: level5-redesign
  cancel-in-progress: true

# Failure policy: every step that produces evidence is allowed to fail, so a red
# run is still debuggable and still publishes whatever it managed to capture.
# Honesty is enforced at the two gates at the bottom, which are the only steps
# that can turn the job red:
#   * "Acceptance gate"  — every frozen suite must have printed PASSED.
#   * "Evidence gate"    — all twelve native frames, the pairs, the 4x crops, the
#                          comparison sheet and both route traces must exist, and
#                          both capture logs must report a completed pass.
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.0
          use-dotnet: false
          include-templates: false

      - name: Authoring authority is byte-reproducible and satisfies the map contract
        run: |
          set -euo pipefail
          mkdir -p .artifacts/level5 docs/level-design/level5-redesign/evidence/logs
          python3 tools/level5/author.py --validate | tee .artifacts/level5/validate.log
          python3 tools/level5/author.py --check | tee .artifacts/level5/check.log
          python3 tools/level5/author.py --stats | tee .artifacts/level5/stats.log
          sha256sum data/levels/chapter_1_level_5.json prototypes/level5/baseline/chapter_1_level_5.json \
            | tee .artifacts/level5/pins.log
          # The pinned baseline must still be the tree-of-record file, unedited.
          git show a1ae892:data/levels/chapter_1_level_5.json \
            | sha256sum | tee .artifacts/level5/baseline_from_history.log
          baseline_sha="$(cut -d' ' -f1 .artifacts/level5/baseline_from_history.log)"
          grep -q "prototypes/level5/baseline/chapter_1_level_5.json" .artifacts/level5/pins.log
          grep -q "$baseline_sha" .artifacts/level5/pins.log
          # Levels 1-4 and 6 must be untouched by this change.
          git diff --stat a1ae892 -- data/levels/crypt_entrance.json \
            data/levels/chapter_1_level_1.json data/levels/chapter_1_level_2.json \
            data/levels/chapter_1_level_3.json data/levels/chapter_1_level_4.json \
            data/levels/chapter_1_level_6.json | tee .artifacts/level5/unrelated_drift.log
          test ! -s .artifacts/level5/unrelated_drift.log

      - name: Import the project and compile-check the review harness
        run: |
          set -euo pipefail
          godot --version | tee .artifacts/level5/version.log
          timeout 420s godot --headless --audio-driver Dummy --editor --path . --import --quit \
            2>&1 | tee .artifacts/level5/import.log
          # Run the harness scene, not `--check-only --script`: the script form
          # compiles without the project autoloads, so AppFlow/SaveService read
          # as "Identifier not found" even when the game itself is fine.
          timeout 300s godot --headless --audio-driver Dummy --path . \
            res://tools/captures/level5_blood_crucible_capture.tscn -- --check \
            2>&1 | tee .artifacts/level5/parsecheck.log
          grep -q "LEVEL5 HARNESS CHECK OK" .artifacts/level5/parsecheck.log

      - name: Install Xvfb and Mesa
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes xvfb libgl1-mesa-dri fonts-dejavu-core >/dev/null

      - name: Frozen acceptance suites against the redesign
        continue-on-error: true
        run: |
          # GitHub runs `bash -e`, so tolerated failures are made explicit
          # instead of aborting the evidence pass half way through.
          set +e
          rc=0
          # SceneTree scripts: these only read data documents and pure rule
          # modules, so `--script` is the honest runner for them.
          for suite in \
            "chapter_1_map_design_test.gd" \
            "chapter_1_campaign_map_design_test.gd" \
            "chapter_1_level_5_miniboss_test.gd" \
            "level_5_archer_pickup_test.gd"; do
            name="${suite%.gd}"
            timeout 600s godot --headless --path . --script "res://tests/${suite}" \
              > ".artifacts/level5/${name}.log" 2>&1 || rc=1
            grep -hE "PASSED|FAILED|FAIL" ".artifacts/level5/${name}.log" | tail -3 || true
          done
          # These two boot the real scene graph (Knight, interactables, autoloads),
          # so they must run their scene, exactly as integration-godot-acceptance
          # runs them. `--script` compiles without autoloads and is not a valid
          # invocation for them.
          for scene in \
            "chapter_1_level_5_live_loot_regression" \
            "chapter_1_collision_route_test"; do
            timeout 600s godot --headless --path . "res://tests/${scene}.tscn" \
              > ".artifacts/level5/${scene}.log" 2>&1 || rc=1
            grep -hE "PASSED|FAILED|FAIL|COLLISION ROUTE" ".artifacts/level5/${scene}.log" | tail -8 || true
          done
          exit $rc

      - name: Balance matrix diagnostic (Hero projection, not a Level 5 suite)
        continue-on-error: true
        run: |
          # chapter_1_balance_matrix_test asserts on the Hero stat projection and
          # the tempo model. It never reads a level document, so it cannot be
          # satisfied or broken by this redesign -- and it is already red on this
          # branch. Run it twice: once over this tree, once over the pinned
          # baseline tree in a detached worktree. The Acceptance gate accepts the
          # failure only if both runs fail identically, which proves it predates
          # the redesign. Nothing here relaxes an expectation.
          set +e
          timeout 600s godot --headless --path . --script res://tests/chapter_1_balance_matrix_test.gd \
            > .artifacts/level5/chapter_1_balance_matrix_test.log 2>&1
          grep -hE "FAIL|PASSED|FAILED" .artifacts/level5/chapter_1_balance_matrix_test.log | tail -6
          pin_dir="$(mktemp -d)"
          git worktree add --detach "$pin_dir" a1ae892 >/dev/null 2>&1
          timeout 900s godot --headless --editor --path "$pin_dir" --import --quit \
            > .artifacts/level5/balance_matrix_pin_import.log 2>&1
          timeout 600s godot --headless --path "$pin_dir" --script res://tests/chapter_1_balance_matrix_test.gd \
            > .artifacts/level5/chapter_1_balance_matrix_at_pin.log 2>&1
          grep -hE "FAIL|PASSED|FAILED" .artifacts/level5/chapter_1_balance_matrix_at_pin.log | tail -6
          git worktree remove --force "$pin_dir" >/dev/null 2>&1

      - name: Capture the pinned baseline (BEFORE)
        continue-on-error: true
        run: |
          set +eo pipefail
          cp prototypes/level5/baseline/chapter_1_level_5.json data/levels/chapter_1_level_5.json
          sha256sum data/levels/chapter_1_level_5.json | tee .artifacts/level5/before_pin.log
          export SOUL_OF_HERO_SAVE_PATH="user://l5_before_$GITHUB_RUN_ID.json"
          xvfb-run -a -s "-screen 0 1280x720x24" env LIBGL_ALWAYS_SOFTWARE=1 \
            timeout 1800s godot --path . --audio-driver Dummy \
            --rendering-method gl_compatibility --rendering-driver opengl3 \
            --resolution 1280x720 res://tools/captures/level5_blood_crucible_capture.tscn \
            -- --out-dir=res://.artifacts/level5/before --tag=before \
            2>&1 | tee .artifacts/level5/capture_before.log
          grep -c "LEVEL5 REVIEW STATION" .artifacts/level5/capture_before.log || true

      - name: Capture the redesign (AFTER)
        continue-on-error: true
        run: |
          set +eo pipefail
          # The redesign is *authored*, not checked in as a second copy. The
          # BEFORE step deliberately left the pinned baseline in the working
          # copy, so the order is: record that state, re-author the redesign,
          # then prove the result is the committed file byte for byte. The
          # frames can therefore never belong to a different map.
          sha256sum data/levels/chapter_1_level_5.json \
            | tee .artifacts/level5/after_before_author_pin.log
          python3 tools/level5/author.py --write \
            | tee .artifacts/level5/author_write.log
          python3 tools/level5/author.py --check \
            | tee .artifacts/level5/check_after_author.log
          git diff --exit-code -- data/levels/chapter_1_level_5.json \
            | tee .artifacts/level5/after_map_diff.log || true
          sha256sum data/levels/chapter_1_level_5.json | tee .artifacts/level5/after_pin.log
          export SOUL_OF_HERO_SAVE_PATH="user://l5_after_$GITHUB_RUN_ID.json"
          xvfb-run -a -s "-screen 0 1280x720x24" env LIBGL_ALWAYS_SOFTWARE=1 \
            timeout 1800s godot --path . --audio-driver Dummy \
            --rendering-method gl_compatibility --rendering-driver opengl3 \
            --resolution 1280x720 res://tools/captures/level5_blood_crucible_capture.tscn \
            -- --out-dir=res://.artifacts/level5/after --tag=after \
            2>&1 | tee .artifacts/level5/capture_after.log
          grep -c "LEVEL5 REVIEW STATION" .artifacts/level5/capture_after.log || true

      - name: Campaign capture through AppFlow (slot 5, mid and end)
        continue-on-error: true
        run: |
          set +eo pipefail
          for point in mid end; do
            export SOUL_OF_HERO_SAVE_PATH="user://l5_campaign_${point}_$GITHUB_RUN_ID.json"
            xvfb-run -a -s "-screen 0 1280x720x24" env LIBGL_ALWAYS_SOFTWARE=1 \
              timeout 900s godot --path . --audio-driver Dummy \
              --rendering-method gl_compatibility --rendering-driver opengl3 \
              --resolution 1280x720 res://tests/chapter_1_campaign_level_visual_capture.tscn \
              -- --level-slot=5 --capture-point=${point} \
              > ".artifacts/level5/campaign_${point}.log" 2>&1
            grep -hE "CAPTURE|PASSED|FAILED" ".artifacts/level5/campaign_${point}.log" | tail -4 || true
          done

      - name: Build the review evidence sheets
        continue-on-error: true
        run: |
          set +eo pipefail
          mkdir -p docs/level-design/level5-redesign/{before,after,comparisons,evidence/logs,evidence/crops}
          cp .artifacts/level5/before/*.png docs/level-design/level5-redesign/before/ || true
          cp .artifacts/level5/after/*.png docs/level-design/level5-redesign/after/ || true
          # Slot-5 campaign frames are the real AppFlow playtest views.
          cp .artifacts/chapter_1_level_05_*.png docs/level-design/level5-redesign/evidence/ || true
          python3 -m pip install --quiet pillow
          python3 tools/level5/evidence.py | tee .artifacts/level5/evidence.log
          godot --version > docs/level-design/level5-redesign/evidence/toolchain.txt
          git rev-parse HEAD >> docs/level-design/level5-redesign/evidence/toolchain.txt
          sha256sum data/levels/chapter_1_level_5.json prototypes/level5/baseline/chapter_1_level_5.json \
            >> docs/level-design/level5-redesign/evidence/toolchain.txt

      - name: Acceptance gate
        run: |
          set -uo pipefail
          rc=0
          # In-scope Level 5 acceptance suites. Each one is matched on the exact
          # success line it prints *and* on its check count, so a suite that
          # silently runs fewer checks cannot pass, and each must also be free of
          # failure lines.
          check_suite() {
            local suite="$1"
            local expected="$2"
            local logfile=".artifacts/level5/${suite}.log"
            if [ ! -f "$logfile" ]; then
              echo "MISSING suite log: $suite"
              rc=1
              return
            fi
            if grep -qF "$expected" "$logfile" && ! grep -q "ERROR: FAIL" "$logfile"; then
              echo "PASSED $suite — $expected"
            else
              echo "FAILED $suite — expected: $expected"
              grep -hE "FAIL|ERROR" "$logfile" | head -10 || true
              rc=1
            fi
          }
          check_suite chapter_1_map_design_test "CHAPTER 1 MAP DESIGN 837/837"
          check_suite chapter_1_campaign_map_design_test "CAMPAIGN MAP DESIGN PASSED"
          check_suite chapter_1_level_5_miniboss_test "LEVEL 5 ARCHER MINIBOSS TEST PASSED - 77 checks"
          check_suite level_5_archer_pickup_test "LEVEL 5 ARCHER PICKUP TEST PASSED - 59 checks"
          check_suite chapter_1_level_5_live_loot_regression "LEVEL 5 LIVE LOOT PASSED - 22 checks"
          check_suite collision_route "COLLISION ROUTE TEST PASSED - 161 checks across ten live maps"
          # Out-of-scope diagnostic. The balance matrix asserts on the Hero stat
          # projection and never reads a level document, and it is red on this
          # branch before the redesign. It may only be carried as a known
          # pre-existing failure while the pinned baseline tree a1ae892 fails it
          # with the identical failure set; anything else is a real regression.
          balance_now=".artifacts/level5/chapter_1_balance_matrix_test.log"
          balance_pin=".artifacts/level5/chapter_1_balance_matrix_at_pin.log"
          pin_sha="$(cat .artifacts/level5/pins.log | grep -c 'level5/baseline' || true)"
          if [ "$pin_sha" != "1" ]; then
            echo "MISSING pinned baseline hash for the balance-matrix proof"
            rc=1
          fi
          if grep -q "BALANCE MATRIX TEST PASSED" "$balance_now" 2>/dev/null; then
            echo "PASSED chapter_1_balance_matrix_test"
          else
            now_fails="$(grep -o 'FAIL  .*' "$balance_now" 2>/dev/null | sort -u)"
            pin_fails="$(grep -o 'FAIL  .*' "$balance_pin" 2>/dev/null | sort -u)"
            if [ -n "$now_fails" ] && [ -n "$pin_fails" ] && [ "$now_fails" = "$pin_fails" ]; then
              echo "PRE-EXISTING chapter_1_balance_matrix_test (identical at pinned baseline a1ae892):"
              echo "$now_fails"
            else
              echo "FAILED chapter_1_balance_matrix_test (differs from the pinned baseline)"
              echo "  now: ${now_fails:-<none>}"
              echo "  pin: ${pin_fails:-<none>}"
              rc=1
            fi
          fi
          exit $rc

      - name: Evidence gate
        if: always()
        run: |
          set -uo pipefail
          rc=0
          for tag in before after; do
            if ! grep -q "LEVEL5 REVIEW CAPTURE DONE: tag=${tag}" ".artifacts/level5/capture_${tag}.log"; then
              echo "MISSING completed ${tag} pass"
              rc=1
            fi
            for station in f1_spawn f1_camp f2_court f2_checkpoint f3_approach f3_archer; do
              test -f "docs/level-design/level5-redesign/${tag}/${tag}_${station}.png" \
                || { echo "MISSING ${tag} frame: ${station}"; rc=1; }
            done
          done
          for station in f1_spawn f1_camp f2_court f2_checkpoint f3_approach f3_archer; do
            test -f "docs/level-design/level5-redesign/comparisons/pair_${station}.png" \
              || { echo "MISSING pair: ${station}"; rc=1; }
            test -f "docs/level-design/level5-redesign/evidence/crops/crop4x_${station}.png" \
              || { echo "MISSING 4x crop: ${station}"; rc=1; }
          done
          test -f docs/level-design/level5-redesign/comparisons/comparison_sheet.png \
            || { echo "MISSING comparison sheet"; rc=1; }
          test -f docs/level-design/level5-redesign/evidence/route_trace_after.png \
            || { echo "MISSING after route trace"; rc=1; }
          test -f docs/level-design/level5-redesign/evidence/route_trace_before.png \
            || { echo "MISSING before route trace"; rc=1; }
          exit $rc

      - name: Persist native frames, logs and the source pin
        if: always()
        run: |
          # Deliberately forgiving: a red run must still publish its own logs and
          # whatever frames it produced, or the failure is undebuggable.
          set -uo pipefail
          mkdir -p docs/level-design/level5-redesign/evidence/logs
          shopt -s nullglob
          for logfile in .artifacts/level5/*.log; do
            cp "$logfile" "docs/level-design/level5-redesign/evidence/logs/$(basename "$logfile" .log).txt"
          done
          shopt -u nullglob
          git config user.name "level5-capture-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/level-design/level5-redesign
          if ! git diff --cached --quiet; then
            git commit -m "ci(level5): publish native Blood Crucible review evidence [skip ci]"
            git push
          fi
