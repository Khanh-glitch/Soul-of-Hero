name: WMP04 Real Asset Art Audition
on:
  push:
    branches: [arena/2e3cfbd2-soul-of-hero]
    paths:
      - 'veyra-world-master/v4/art/AUDITION_01_REAL_ASSETS.html'
      - 'veyra-world-master/v4/art/test_board.mjs'
      - '.github/workflows/wmp04-art-audition.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audition-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: world_lab/package-lock.json
      - name: Install pinned browser test dependencies
        run: npm ci --prefix world_lab
      - name: Test standalone source-backed 640x360 art audition
        run: node veyra-world-master/v4/art/test_board.mjs
      - name: Publish audited browser evidence as download artifact
        uses: actions/upload-artifact@v4
        with:
          name: WMP04-ART-AUDITION-01
          path: |
            veyra-world-master/v4/art/AUDITION_01_REAL_ASSETS.html
            veyra-world-master/v4/art/evidence/
          retention-days: 30
      - name: Commit screenshots for creator and Control Tower visual review
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add veyra-world-master/v4/art/evidence/
          if ! git diff --cached --quiet; then
            git commit -m "evidence(map): 5 real-source WMP04 art audition browser captures"
            git push origin HEAD:arena/2e3cfbd2-soul-of-hero
          fi
