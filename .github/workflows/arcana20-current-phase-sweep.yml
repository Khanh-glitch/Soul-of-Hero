name: ARCANA20 current-A0 all-20 overworld multi-phase capture
on:
  workflow_dispatch:
  push:
    branches: [arena/c7b0c4e8-soul-of-hero]
    paths: ['.github/workflows/arcana20-current-phase-sweep.yml', 'prototypes/arcana_fusion20/renderer/source_a/a_redesign_spells.gd', 'prototypes/arcana_fusion20/renderer/source_a/a_redesign_spells2.gd', 'prototypes/arcana_fusion20/renderer/source_c/c_frame.gd', 'prototypes/arcana_fusion20/renderer/source_c/c_thunderloom.gd', 'prototypes/arcana_fusion20/renderer/source_c/c_event_horizon.gd', 'prototypes/arcana_fusion20/renderer/world_pass/c_stage_blackout.gd', 'prototypes/arcana_fusion20/renderer/world_pass/c_stage_blackout.gdshader', 'prototypes/arcana_fusion20/renderer/world_pass/c_stage_world.gd', 'prototypes/arcana_fusion20/renderer/world_pass/c_stage_world.gdshader', 'prototypes/arcana_fusion20/renderer/world_pass/world_pass_mount.gd', 'prototypes/arcana_fusion20/renderer/source_c/c_worldseed_fusion.gd', 'prototypes/arcana_fusion20/renderer/source_c/c_worldseed_membranes.gd', 'prototypes/arcana_fusion20/renderer/source_c/c_worldseed_debris.gd', 'prototypes/arcana_fusion20/renderer/source_c/c_worldseed_organism.gd', 'prototypes/arcana_fusion20/renderer/source_c/c_worldseed_leaflets.gd', 'prototypes/arcana_fusion20/renderer/source_c/c_worldseed_core.gd', 'prototypes/arcana_fusion20/renderer/source_d/d_constellation_engine.gd', 'prototypes/arcana_fusion20/renderer/source_d/d_source_player.gd', 'prototypes/arcana_fusion20/renderer/world_pass/d_world_composite.gdshader', 'prototypes/arcana_fusion20/renderer/arcana20_overworld_join_test.gd', 'prototypes/arcana_fusion20/renderer/arcana20_surface_d19_out.py']
permissions:
  contents: write
jobs:
  phases:
    if: ${{ !contains(github.event.head_commit.message, '[r29-n]') }}
    strategy:
      fail-fast: false
      matrix:
        first: ${{ fromJSON((contains(github.event.head_commit.message, '[d19-isolate]') || contains(github.event.head_commit.message, '[r29-visual]')) && '[19]' || '[1,6,11,16]') }}
        lighting: [normal, dimmed]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Assemble isolated current owner composition
        run: |
          git fetch --depth=1 --no-tags origin 04eacf62f1a3740a57e08691c3a9006d454aaa2c 6b801554a6af95424b4e39dd29f43c146aa13848 2cb1a3c5f093724eb9fecbdf45909ccb611f7b32 18e7afcbd576bbd9bfbcc509b2ee13216186a522 e505173edd119fdd955cf6249511b575a5468440
          python3 tools/arcana20_join/assemble.py --out "$RUNNER_TEMP/arcana20-phases" --avfx-sha "$GITHUB_SHA" --a0-sha 04eacf62f1a3740a57e08691c3a9006d454aaa2c
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.0
          use-dotnet: false
          include-templates: false
      - name: Import disposable project
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/arcana20-phases/artifacts"
          timeout 300s godot --headless --path "$RUNNER_TEMP/arcana20-phases" --import 2>&1 | tee "$RUNNER_TEMP/arcana20-phases/artifacts/import.log"
          ! grep -Eq 'SCRIPT ERROR:|Parse Error:' "$RUNNER_TEMP/arcana20-phases/artifacts/import.log"
      - name: Capture six catalog-relative moments with actual world tint and experimental post
        env:
          FIRST: ${{ matrix.first }}
          ARCANA20_PHASE_LIGHT: ${{ matrix.lighting }}
          ARCANA20_PHASE_LAST: ${{ matrix.first == 19 && '19' || '0' }}
          ARCANA20_D19_ISOLATION: ${{ matrix.first == 19 && '1' || '0' }}
          ARCANA20_D19_LAYERS: ${{ matrix.first == 19 && '1' || '0' }}
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=10s 2100s xvfb-run -a -s '-screen 0 1280x720x24' env LIBGL_ALWAYS_SOFTWARE=1 ARCANA20_PHASE_FIRST="$FIRST" \
            godot --verbose --path "$RUNNER_TEMP/arcana20-phases" --rendering-method gl_compatibility --audio-driver Dummy --resolution 1280x720 --windowed \
            --user-data-dir "$RUNNER_TEMP/arcana20-phases-user" --script res://prototypes/arcana_fusion20/renderer/arcana20_overworld_join_test.gd \
            2>&1 | tee "$RUNNER_TEMP/arcana20-phases/artifacts/phases.log"
          grep -Fq 'ARCANA20_JOIN_DIAGNOSTIC PASS' "$RUNNER_TEMP/arcana20-phases/artifacts/phases.log"
          ! grep -Eq 'SCRIPT ERROR:|Parse Error:|Shader compilation failed|JOIN_FAIL' "$RUNNER_TEMP/arcana20-phases/artifacts/phases.log"
      - name: Install D19 OUT crop tools
        if: matrix.first == 16 && matrix.lighting == 'normal'
        run: python3 -m pip install --quiet pillow numpy
      - name: Surface actual D19 OUT start crop
        if: matrix.first == 16 && matrix.lighting == 'normal'
        run: python3 prototypes/arcana_fusion20/renderer/arcana20_surface_d19_out.py "$RUNNER_TEMP/arcana20-phases/artifacts/arcana20-join" start
      - name: Surface actual D19 OUT withdraw crop
        if: matrix.first == 16 && matrix.lighting == 'normal'
        run: python3 prototypes/arcana_fusion20/renderer/arcana20_surface_d19_out.py "$RUNNER_TEMP/arcana20-phases/artifacts/arcana20-join" withdraw
      - name: Surface actual D19 OUT converge crop
        if: matrix.first == 16 && matrix.lighting == 'normal'
        run: python3 prototypes/arcana_fusion20/renderer/arcana20_surface_d19_out.py "$RUNNER_TEMP/arcana20-phases/artifacts/arcana20-join" converge
      - name: Surface actual D19 OUT last crop
        if: matrix.first == 16 && matrix.lighting == 'normal'
        run: python3 prototypes/arcana_fusion20/renderer/arcana20_surface_d19_out.py "$RUNNER_TEMP/arcana20-phases/artifacts/arcana20-join" last
      - name: Produce matched native-size D19 isolation evidence
        if: matrix.first == 19
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow numpy
          python3 tools/arcana20_join/surface_d19_isolation.py "$RUNNER_TEMP/arcana20-phases/artifacts/arcana20-join" "$RUNNER_TEMP/d19-review" "$RUNNER_TEMP/arcana20-phases/artifacts/phases.log"
          (cd "$RUNNER_TEMP/d19-review" && zip -q "$RUNNER_TEMP/d19-isolation.zip" ./*)
          python3 - "$RUNNER_TEMP/d19-isolation.zip" "$RUNNER_TEMP/blob.json" <<'PY'
          import base64,json,pathlib,sys
          pathlib.Path(sys.argv[2]).write_text(json.dumps({'content':base64.b64encode(pathlib.Path(sys.argv[1]).read_bytes()).decode(),'encoding':'base64'}))
          PY
          blob=$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/blobs" --input "$RUNNER_TEMP/blob.json" --jq .sha)
          echo "::notice title=D19_ISOLATION_ZIP_BLOB::$blob"
      - name: Upload matched D19 1x crops and metrics
        if: matrix.first == 19
        uses: actions/upload-artifact@v4
        with:
          name: d19-isolation-native-${{ matrix.lighting }}
          path: ${{ runner.temp }}/d19-review/
          if-no-files-found: error
      - name: Surface phase and duration evidence
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/arcana20-phases/artifacts/phases.log"; then
            grep -E 'JOIN_PHASE|JOIN_FAIL|SCRIPT ERROR|Parse Error|ARCANA20_JOIN_DIAGNOSTIC' "$RUNNER_TEMP/arcana20-phases/artifacts/phases.log" | head -20 | while IFS= read -r line; do echo "::notice::$line"; done || true
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arcana20-current-phase-sweep-${{ matrix.first }}-${{ matrix.lighting }}
          path: |
            ${{ runner.temp }}/arcana20-phases/arcana20_join_manifest.json
            ${{ runner.temp }}/arcana20-phases/artifacts/
          if-no-files-found: warn
