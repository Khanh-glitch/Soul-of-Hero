name: ARCANA20 current-A0 all-20 overworld multi-phase capture
on:
  workflow_dispatch:
  push:
    branches: [arena/c7b0c4e8-soul-of-hero]
    paths: ['.github/workflows/arcana20-current-phase-sweep.yml']
permissions:
  contents: read
jobs:
  phases:
    strategy:
      fail-fast: false
      matrix:
        first: [1, 6, 11, 16]
        lighting: [normal, dimmed]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assemble isolated current owner composition
        run: |
          git fetch --no-tags origin be81b58cfc5b7ba0207804797e31019aaffecf47 6b801554a6af95424b4e39dd29f43c146aa13848 2cb1a3c5f093724eb9fecbdf45909ccb611f7b32 18e7afcbd576bbd9bfbcc509b2ee13216186a522 e505173edd119fdd955cf6249511b575a5468440
          python3 tools/arcana20_join/assemble.py --out "$RUNNER_TEMP/arcana20-phases" --avfx-sha "$GITHUB_SHA" --a0-sha be81b58cfc5b7ba0207804797e31019aaffecf47
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.0
          use-dotnet: false
          include-templates: false
      - name: Import disposable project
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/arcana20-phases/artifacts"
          timeout 300s godot --headless --path "$RUNNER_TEMP/arcana20-phases" --import 2>&1 | tee "$RUNNER_TEMP/arcana20-phases/artifacts/import.log"
          ! grep -Eq 'SCRIPT ERROR:|Parse Error:' "$RUNNER_TEMP/arcana20-phases/artifacts/import.log"
      - name: Capture six catalog-relative moments with actual world tint and experimental post
        env:
          FIRST: ${{ matrix.first }}
          ARCANA20_PHASE_LIGHT: ${{ matrix.lighting }}
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=10s 2100s xvfb-run -a -s '-screen 0 1280x720x24' env LIBGL_ALWAYS_SOFTWARE=1 ARCANA20_PHASE_FIRST="$FIRST" \
            godot --verbose --path "$RUNNER_TEMP/arcana20-phases" --rendering-method gl_compatibility --audio-driver Dummy --resolution 1280x720 --windowed \
            --user-data-dir "$RUNNER_TEMP/arcana20-phases-user" --script res://prototypes/arcana_fusion20/renderer/arcana20_overworld_join_test.gd \
            2>&1 | tee "$RUNNER_TEMP/arcana20-phases/artifacts/phases.log"
          grep -Fq 'ARCANA20_JOIN_DIAGNOSTIC PASS' "$RUNNER_TEMP/arcana20-phases/artifacts/phases.log"
          ! grep -Eq 'SCRIPT ERROR:|Parse Error:|Shader compilation failed|JOIN_FAIL' "$RUNNER_TEMP/arcana20-phases/artifacts/phases.log"
      - name: Surface phase and duration evidence
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/arcana20-phases/artifacts/phases.log"; then
            grep -E 'JOIN_PHASE|JOIN_FAIL|SCRIPT ERROR|Parse Error|ARCANA20_JOIN_DIAGNOSTIC' "$RUNNER_TEMP/arcana20-phases/artifacts/phases.log" | head -20 | while IFS= read -r line; do echo "::notice::$line"; done || true
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arcana20-current-phase-sweep-${{ matrix.first }}-${{ matrix.lighting }}
          path: |
            ${{ runner.temp }}/arcana20-phases/arcana20_join_manifest.json
            ${{ runner.temp }}/arcana20-phases/artifacts/
          if-no-files-found: warn
