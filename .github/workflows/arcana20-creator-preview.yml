          PY
          if [ "$(stat -c %s "$motion/short-motion-720p.mp4")" -le 8000000 ] && blob=$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/blobs" --input "$RUNNER_TEMP/motion-blob.json" --jq .sha); then
