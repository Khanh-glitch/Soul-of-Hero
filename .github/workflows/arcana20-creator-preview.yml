          git fetch --depth=1 --no-tags origin 8c260d9d595d33f96bc333d860851dcaaae12cac 04eacf62f1a3740a57e08691c3a9006d454aaa2c 6b801554a6af95424b4e39dd29f43c146aa13848 2cb1a3c5f093724eb9fecbdf45909ccb611f7b32 18e7afcbd576bbd9bfbcc509b2ee13216186a522 e505173edd119fdd955cf6249511b575a5468440
          python3 tools/arcana20_join/assemble.py --out "$RUNNER_TEMP/old-project" --avfx-sha 8c260d9d595d33f96bc333d860851dcaaae12cac --a0-sha 04eacf62f1a3740a57e08691c3a9006d454aaa2c
          cp prototypes/arcana_fusion20/renderer/playtest/arcana20_thorn_matrix_capture.gd "$RUNNER_TEMP/old-project/prototypes/arcana_fusion20/renderer/playtest/arcana20_thorn_matrix_capture.gd"
          python3 - "$RUNNER_TEMP/old-project/project.godot" <<'PY'
