    # Newest art receives live moving-world full-cast capture; the earlier
    # all-20 single-enemy and multi-enemy matrix runs remain separate evidence.
    needs: build
    # Only publish generated, bounded visual evidence as detached Git blobs;
    # the agent reviews and commits them on the owned branch. No ref writes.
    permissions:
      contents: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(contains(github.event.head_commit.message, '[r29-roots-only]') && '[{"skill":13,"lighting":"normal","variant":"N13","lock":"0"},{"skill":13,"lighting":"dimmed","variant":"N13","lock":"0"}]' || contains(github.event.head_commit.message, '[r29-nature-sky-event]') && '[{"skill":12,"lighting":"normal","variant":"N12","lock":"0"},{"skill":12,"lighting":"dimmed","variant":"N12","lock":"0"},{"skill":14,"lighting":"normal","variant":"N14","lock":"0"},{"skill":14,"lighting":"dimmed","variant":"N14","lock":"0"},{"skill":18,"lighting":"normal","variant":"N18","lock":"0"},{"skill":18,"lighting":"dimmed","variant":"N18","lock":"0"}]' || contains(github.event.head_commit.message, '[r29-sky-only]') && '[{"skill":12,"lighting":"normal","variant":"N12","lock":"0"},{"skill":12,"lighting":"dimmed","variant":"N12","lock":"0"}]' || contains(github.event.head_commit.message, '[r29-event-only]') && '[{"skill":18,"lighting":"normal","variant":"N18","lock":"0"},{"skill":18,"lighting":"dimmed","variant":"N18","lock":"0"}]' || contains(github.event.head_commit.message, '[r29-blade-only]') && '[{"skill":4,"lighting":"normal","variant":"N04","lock":"0"},{"skill":4,"lighting":"dimmed","variant":"N04","lock":"0"}]' || contains(github.event.head_commit.message, '[r29-fluid-event]') && '[{"skill":6,"lighting":"normal","variant":"N06","lock":"0"},{"skill":6,"lighting":"dimmed","variant":"N06","lock":"0"},{"skill":14,"lighting":"normal","variant":"N14","lock":"0"},{"skill":14,"lighting":"dimmed","variant":"N14","lock":"0"},{"skill":18,"lighting":"normal","variant":"N18","lock":"0"},{"skill":18,"lighting":"dimmed","variant":"N18","lock":"0"}]' || contains(github.event.head_commit.message, '[r29-blade-roots]') && '[{"skill":4,"lighting":"normal","variant":"N04","lock":"0"},{"skill":4,"lighting":"dimmed","variant":"N04","lock":"0"},{"skill":13,"lighting":"normal","variant":"N13","lock":"0"},{"skill":13,"lighting":"dimmed","variant":"N13","lock":"0"}]' || contains(github.eve