            --user-data-dir "$RUNNER_TEMP/before-user" -- --avfx-live-capture 2>&1 | tee "$RUNNER_TEMP/before.log"
          grep -Fq 'AVFX_THORN_MATRIX_PASS cases=1' "$RUNNER_TEMP/before.log"
