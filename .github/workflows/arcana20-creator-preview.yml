ck":"0","camera":"follow"}]' || contains(github.event.head_commit.message, '[r26-f]') && '[{"skill":1,"lighting":"normal","variant":"F01","lock":"0","camera":"follow"},{"skill":1,"lighting":"dimmed","variant":"F01","lock":"0","camera":"follow"},{"skill":1,"lighting":"normal","variant":"F01MATCH","lock":"0","camera":"follow"},{"skill":1,"lighting":"dimmed","variant":"F01MATCH","lock":"0","camera":"follow"},{"skill":16,"lighting":"normal","variant":"F16FIX","lock":"0","camera":"fixed"},{"skill":16,"lighting":"dimmed","variant":"F16FIX","lock":"0","camera":"fixed"},{"skill":20,"lighting":"normal","variant":"F20FIX","lock":"0","camera":"fixed"},{"skill":20,"lighting":"dimmed","variant":"F20FIX","lock":"0","camera":"fixed"}]' || contains(github.event.head_commit.message, '[f-five]') && '[{"skill":1,"lighting":"normal","variant":"F01","lock":"0"},{"skill":1,"lighting":"dimmed","variant":"F01","lock":"0"},{"skill":9,"lighting":"normal","variant":"F09","lock":"0"},{"skill":9,"lighting":"dimmed","variant":"F09","lock":"0"},{"skill":11,"lighting":"normal","variant":"F11","lock":"0"},{"skill":11,"lighting":"dimmed","variant":"F11","lock":"0"},{"skill":16,"lighting":"normal","variant":"F16","lock":"0"},{"skill":16,"lighting":"dimmed","variant":"F16","lock":"0"},{"skill":20,"lighting":"normal","variant":"F20","lock":"0"},{"skill":20,"lighting":"dimmed","variant":"F20","lock":"0"},{"skill":1,"lighting":"normal","variant":"F01MATCH","lock":"0","camera":"follow"},{"skill":1,"lighting":"dimmed","variant":"F01MATCH","lock":"0","camera":"follow"},{"skill":16,"lighting":"normal","variant":"F16FIX","lock":"0","camera":"fixed"},{"skill":16,"lighting":"dimmed","variant":"F16FIX","lock":"0","camera":"fixed"},{"skill":16,"lighting":"normal","variant":"F16STEP","lock":"0","camera":"fixed"},{"skill":16,"lighting":"dimmed","variant":"F16STEP","lock":"0","camera":"fixed"},{"skill":20,"lighting":"normal","variant":"F20FIX","lock":"0","camera":"fixed"},{"skill":20,"lighting":"dimmed","variant":"F20FIX","lock":"0","camera":"fixed"}]' || contains(github.event.head_commit.message, '[f-only]') && '[{"skill":9,"lighting":"normal","variant":"F09","lock":"0"},{"skill":9,"lighting":"dimmed","variant":"F09","lock":"0"},{"skill":11,"lighting":"normal","variant":"F11","lock":"0"},{"skill":11,"lighting":"dimmed","variant":"F11","lock":"0"},{"skill":16,"lighting":"normal","variant":"F16","lock":"0"},{"skill":16,"lighting":"dimmed","variant":"F16","lock":"0"},{"skill":20,"lighting":"normal","variant":"F20","lock":"0"},{"skill":20,"lighting":"dimmed","variant":"F20","lock":"0"}]' || '[{"skill":5,"lighting":"normal","variant":"A","lock":"0"},{"skill":5,"lighting":"dimmed","variant":"A","lock":"0"},{"skill":5,"lighting":"normal","variant":"B","lock":"0"},{"skill":5,"lighting":"dimmed","variant":"B","lock":"0"},{"skill":5,"lighting":"normal","variant":"B","lock":"1"},{"skill":5,"lighting":"dimmed","variant":"B","lock":"1"},{"skill":1,"lighting":"normal","variant":"F01","lock":"0"},{"skill":1,"lighting":"dimmed","variant":"F01","lock":"0"},{"skill":2,"lighting":"normal","variant":"B02","lock":"0"},{"skill":2,"lighting":"dimmed","variant":"B02","lock":"0"},{"skill":3,"lighting":"normal","variant":"B03","lock":"0"},{"skill":3,"lighting":"dimmed","variant":"B03","lock":"0"},{"skill":7,"lighting":"normal","variant":"C07","lock":"0"},{"skill":7,"lighting":"dimmed","variant":"C07","lock":"0"},{"skill":8,"lighting":"normal","variant":"B08","lock":"0"},{"skill":8,"lighting":"dimmed","variant":"B08","lock":"0"},{"skill":10,"lighting":"normal","variant":"C10","lock":"0"},{"skill":10,"lighting":"dimmed","variant":"C10","lock":"0"},{"skill":15,"lighting":"normal","variant":"C15","lock":"0"},{"skill":15,"lighting":"dimmed","variant":"C15","lock":"0"},{"skill":17,"lighting":"normal","variant":"C17","lock":"0"},{"skill":17,"lighting":"dimmed","variant":"C17","lock":"0"},{"skill":9,"lighting":"normal","variant":"F09","lock":"0"},{"skill":9,"lighting":"dimmed","variant":"F09","lock":"0"},{"skill":11,"lighting":"normal","variant":"F11","lock":"0"},{"skill":11,"lighting":"dimmed","variant":"F11","lock":"0"},{"skill":16,"lighting":"normal","variant":"F16","lock":"0"},{"skill":16,"lighting":"dimmed","variant":"F16","lock":"0"},{"skill":20,"lighting":"normal","variant":"F20","lock":"0"},{"skill":20,"lighting":"dimmed","variant":"F20","lock":"0"}]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: SOH-AVFX-EXPERIMENTAL-NOT-PLAYTEST-READY
          path: bundle
      - name: Unpack same-run exported Linux application
        run: |
          set -euo pipefail
          zip=$(find bundle -name SOH_AVFX_EXPERIMENTAL_linux.zip -print -quit)
          test -n "$zip"
          mkdir release
          unzip -q "$zip" -d release
          chmod +x release/SOH_AVFX_Playtest.x86_64
      - name: Run actual game with moving player, Skeleton and camera
        env:
          AVFX_LIVE_SKILL: ${{ matrix.skill }}
          AVFX_LIVE_LIGHT: ${{ matrix.lighting }}
          AVFX_LIVE_SPAWN_RING: ${{ matrix.skill == 9 && '1' || '0' }}
          AVFX_CROWN_MATCHED: ${{ matrix.variant == 'F01MATCH' && '1' || '0' }}
          AVFX_FIXED_WORLD_CAMERA: ${{ (matrix.variant == 'F16FIX' || matrix.variant == 'F16STEP' || matrix.variant == 'F20FIX' || matrix.variant == 'D19FIX') && '1' || '0' }}
          AVFX_F16_STEP: ${{ matrix.variant == 'F16STEP' && '1' || '0' }}
          AVFX_LIVE_CAPTURE: '1'
          AVFX_05_VARIANT: ${{ matrix.variant }}
          AVFX_AB_LOCK: ${{ matrix.lock }}
        run: |
          set +e
          set -o pipefail
          timeout --signal=TERM --kill-after=10s 780s xvfb-run -a -s '-screen 0 1280x720x24' env LIBGL_ALWAYS_SOFTWARE=1 \
            "$GITHUB_WORKSPACE/release/SOH_AVFX_Playtest.x86_64" --audio-driver Dummy --rendering-method gl_compatibility --resolution 1280x720 \
            --user-data-dir "$RUNNER_TEMP/live-user" -- --avfx-live-capture 2>&1 | tee "$RUNNER_TEMP/live.log"
          result=${PIPESTATUS[0]}
          grep -E 'AVFX_LIVE_|SCRIPT ERROR|Parse Error|Shader compilation failed|ERROR:' "$RUNNER_TEMP/live.log" | head -20 | while IFS= read -r line; do echo "::notice title=LIVE_DIAGNOSTIC::$line"; done || true
          if [ "$result" -ne 0 ]; then echo "::error::Live capture failed exit=$result"; exit "$result"; fi
          grep -Fq 'AVFX_LIVE_PASS' "$RUNNER_TEMP/live.log" || exit 1
          ! grep -Eq 'AVFX_LIVE_FAIL|SCRIPT ERROR:|Parse Error:|Shader compilation failed' "$RUNNER_TEMP/live.log"
      - name: Collect native gameplay frames and metadata
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/live-output"
          folder=$(find "$RUNNER_TEMP" "$HOME/.local/share/godot/app_userdata" -type f -name timeline.json -path '*/avfx_live_capture/*' -print -quit 2>/dev/null || true)
          if [ -n "$folder" ]; then cp -a "$(dirname "$folder")"/. "$RUNNER_TEMP/live-output/"; else echo '::warning::No timeline.json found'; fi
      - name: Install image preview dependency
        run: python3 -m pip install --quiet pillow
      # Full viewport remains in the lossless motion artifact. Limit notices
      # so all four water beats fit within GitHub's per-job annotation cap.
      - name: Validate and surface matched F01 real-scene comparisons
        if: matrix.variant == 'F01MATCH'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/live-output" <<'PY'
          import base64,json,os,pathlib,subprocess,sys
          from PIL import Image,ImageChops,ImageStat
          p=pathlib.Path(sys.argv[1])
          for index in range(2):
              r=json.loads((p/f'crown_pair_{index}.json').read_text()); assert r['stable']
              imgs=[Image.open(p/n).convert('RGB') for n in r['files']]
              assert not ImageChops.difference(imgs[0],imgs[2]).getbbox(), 'baseline restoration differs'
              delta=ImageChops.difference(imgs[0],imgs[1]); assert delta.getbbox(), 'presentation has no visible effect'
              print('::notice title=F01_MATCH_STATE::'+json.dumps(r,separators=(',',':')))
              print('::notice title=F01_MATCH_DELTA::'+str(ImageStat.Stat(delta).mean))
              for label,img in zip(('baseline','corrected'),imgs[:2]):
                  out=p/f'crown_pair_{index}_{label}.jpg'; img.save(out,quality=93)
                  body=json.dumps({'content':base64.b64encode(out.read_bytes()).decode(),'encoding':'base64'})
                  blob=subprocess.check_output(['gh','api','--method','POST','repos/'+os.environ['GITHUB_REPOSITORY']+'/git/blobs','--input','-','--jq','.sha'],input=body.encode()).decode().strip()
                  print(f'::notice title=F01_MATCH_{index}_{label.upper()}::{blob}')
          PY
      - name: Verify every Worldseed source tip and surface diagnostic trace
        if: matrix.variant == 'F16STEP'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Surface the original trace even if the numeric validator rejects
          # it, so a failed diagnostic remains independently inspectable.
          python3 - "$RUNNER_TEMP/live-output/f16_tip_trace.json" "$RUNNER_TEMP/f16-blob.json" <<'PY'
          import base64,json,pathlib,sys
          pathlib.Path(sys.argv[2]).write_text(json.dumps({'content':base64.b64encode(pathlib.Path(sys.argv[1]).read_bytes()).decode(),'encoding':'base64'}))
          PY
          blob=$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/blobs" --input "$RUNNER_TEMP/f16-blob.json" --jq .sha)
          echo "::notice title=F16_SINGLE_TICK_TRACE_GIT_BLOB::$blob"
          if ! python3 tools/arcana20_join/inspect_worldseed_tip_trace.py "$RUNNER_TEMP/live-output/f16_tip_trace.json" > "$RUNNER_TEMP/tip-verify.log" 2>&1; then
            cat "$RUNNER_TEMP/tip-verify.log"
            echo "::error title=F16_TRACE_VALIDATION_FAILED::$(tr '\n' ' ' < "$RUNNER_TEMP/tip-verify.log")"
            exit 1
          fi
          cat "$RUNNER_TEMP/tip-verify.log"
      - name: Encode native wall-time capture
        run: |
          set -euo pipefail
          if ! command -v ffmpeg; then sudo apt-get update -qq && sudo apt-get install -y ffmpeg; fi
          python3 tools/arcana20_join/encode_live_capture.py "$RUNNER_TEMP/live-output" 2>&1 | tee "$RUNNER_TEMP/encode.log"
      - name: Make native Batch S or F01 review evidence
        if: matrix.skill != 5
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_BATCH: ${{ startsWith(matrix.variant, 'D') && 'D' || startsWith(matrix.variant, 'N') && 'N' || startsWith(matrix.variant, 'F') && 'F' || 'S' }}
        run: |
          set -euo pipefail
          review="$RUNNER_TEMP/batch-s-review"
          python3 tools/arcana20_join/batch_s_review_pack.py "$RUNNER_TEMP/live-output" "$review" "$GITHUB_SHA"
          # Put bounded 1x sheets and metadata in detached Git blobs. This is
          # a transport fallback when the artifact CDN is inaccessible; it
          # never changes a branch or labels a picture visually approved.
          for file in "$review"/sheet_*.jpg "$review"/metadata.json; do
            python3 - "$file" "$RUNNER_TEMP/git-blob.json" <<'PY'
          import base64,json,pathlib,sys
          data=base64.b64encode(pathlib.Path(sys.argv[1]).read_bytes()).decode('ascii')
          pathlib.Path(sys.argv[2]).write_text(json.dumps({'content':data,'encoding':'base64'}))
          PY
            if blob=$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/blobs" --input "$RUNNER_TEMP/git-blob.json" --jq .sha); then
              echo "::notice title=BATCH_${REVIEW_BATCH}_GIT_BLOB_$(basename "$file")::$blob"
            else
              echo "::warning::Git blob transport unavailable; use the small review artifact"
            fi
          done
      - name: Upload separate native Batch S frames and sheet
        if: matrix.skill != 5
        uses: actions/upload-artifact@v4
        with:
          name: ${{ startsWith(matrix.variant, 'D') && format('batch-d-review-{0}-{1}', matrix.variant, matrix.lighting) || startsWith(matrix.variant, 'N') && format('batch-n-review-{0}-{1}', matrix.variant, matrix.lighting) || startsWith(matrix.variant, 'F') && format('batch-f-review-{0}-{1}', matrix.variant, matrix.lighting) || format('batch-s-review-{0}-{1}', matrix.variant, matrix.lighting) }}
          path: ${{ runner.temp }}/batch-s-review/
          if-no-files-found: error
          retention-days: 14
      - name: Encode compact 720p native-cadence motion
        if: matrix.skill != 5
        run: |
          set -euo pipefail
          ffmpeg -hide_banner -loglevel error -y -f concat -safe 0 -i "$RUNNER_TEMP/live-output/frames.txt" \
            -fps_mode vfr -c:v libx264 -preset medium -crf 30 -pix_fmt yuv420p -movflags +faststart "$RUNNER_TEMP/native-review-720p.mp4"
          cp "$RUNNER_TEMP/live-output/timeline.json" "$RUNNER_TEMP/native-review-timeline.json"
      # Compact real-cadence clips can be retrieved from Git when this sandbox
      # cannot reach the artifact CDN. Detached blobs never modify a ref.
      - name: Surface bounded native-cadence motion blob
        if: matrix.skill != 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          file="$RUNNER_TEMP/native-review-720p.mp4"
          size=$(stat -c %s "$file")
          if [ "$size" -gt 8000000 ]; then
            echo "::warning::720p clip exceeds 8 MB detached-blob budget; use artifact"
            exit 0
          fi
          python3 - "$file" "$RUNNER_TEMP/motion-blob.json" <<'PY'
          import base64,json,pathlib,sys
          pathlib.Path(sys.argv[2]).write_text(json.dumps({'content':base64.b64encode(pathlib.Path(sys.argv[1]).read_bytes()).decode(),'encoding':'base64'}))
          PY
          if blob=$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/blobs" --input "$RUNNER_TEMP/motion-blob.json" --jq .sha); then
            echo "::notice title=BATCH_S_720P_GIT_BLOB::$blob"
          else
            echo "::warning::720p Git blob transport unavailable; use motion artifact"
          fi
      - name: Upload separate 720p motion and original timing
        if: matrix.skill != 5
        uses: actions/upload-artifact@v4
        with:
          name: ${{ startsWith(matrix.variant, 'D') && format('batch-d-motion-{0}-{1}', matrix.variant, matrix.lighting) || startsWith(matrix.variant, 'N') && format('batch-n-motion-{0}-{1}', matrix.variant, matrix.lighting) || startsWith(matrix.variant, 'F') && format('batch-f-motion-{0}-{1}', matrix.variant, matrix.lighting) || format('batch-s-motion-{0}-{1}', matrix.variant, matrix.lighting) }}
          path: |
            ${{ runner.temp }}/native-review-720p.mp4
            ${{ runner.temp }}/native-review-timeline.json
          if-no-files-found: error
          retention-days: 14
      # The sandbox can read GitHub check annotations but not the Actions
      # artifact blob host. Surface a tiny motion proxy so the complete cast
      # can be inspected there; the full-resolution lossless video is retained
      # unchanged in the downloadable artifact. Proxy is NOT 1x fidelity.
      - name: Surface compact full-cast motion proxy
        if: matrix.skill != 5
        run: |
          python3 - "$RUNNER_TEMP/live-output" <<'PY'
          import base64, pathlib, subprocess, sys
          root = pathlib.Path(sys.argv[1])
          videos = list(root.rglob('native-lossless.mkv'))
          if len(videos) != 1:
              raise SystemExit('expected one native-lossless.mkv')
          proxy = root / 'inspection-proxy.mp4'
          for rate in ('24k', '16k', '10k', '6k'):
              subprocess.run(['ffmpeg', '-loglevel', 'error', '-y', '-i', str(videos[0]),
                  '-vf', 'fps=4,scale=320:180:flags=neighbor', '-an', '-c:v', 'libx264',
                  '-preset', 'slow', '-b:v', rate, '-maxrate', rate, '-bufsize', '24k',
                  '-pix_fmt', 'yuv420p', '-movflags', '+faststart', str(proxy)], check=True)
              if proxy.stat().st_size <= 20500:
                  break
          if proxy.stat().st_size > 20500:
              print('::warning::Motion proxy exceeds annotation budget; inspect the full artifact instead')
          else:
              encoded = base64.b64encode(proxy.read_bytes()).decode('ascii')
              for i in range(0, len(encoded), 3500):
                  print(f'::notice title=FULL_MOTION_PROXY_{i // 3500:02d}::{encoded[i:i+3500]}')
          PY
      - name: Verify six locked native A-B comparisons
        if: matrix.lock == '1'
        run: python3 tools/arcana20_join/compare_abyssal_ab.py "$RUNNER_TEMP/live-output"
      - name: Locked original release at native scale
        if: matrix.lock == '1'
        run: python3 tools/arcana20_join/surface_abyssal_ab.py "$RUNNER_TEMP/live-output" 2 a
      - name: Locked directed release at native scale
        if: matrix.lock == '1'
        run: python3 tools/arcana20_join/surface_abyssal_ab.py "$RUNNER_TEMP/live-output" 2 b
      - name: Locked original column at native scale
        if: matrix.lock == '1'
        run: python3 tools/arcana20_join/surface_abyssal_ab.py "$RUNNER_TEMP/live-output" 3 a
      - name: Locked directed column at native scale
        if: matrix.lock == '1'
        run: python3 tools/arcana20_join/surface_abyssal_ab.py "$RUNNER_TEMP/live-output" 3 b
      # Actual source-clock beats; stills supplement, never replace full videos.
      - name: A opening and peak native detail
        if: matrix.lock == '0' && matrix.skill == 5
        run: python3 tools/arcana20_join/surface_encoded_phase.py "$RUNNER_TEMP/live-output" 0.50 a_peak
      - name: C eruption native detail
        if: matrix.lock == '0' && matrix.skill == 5
        run: python3 tools/arcana20_join/surface_encoded_phase.py "$RUNNER_TEMP/live-output" 0.58 c_release
      - name: C column native detail
        if: matrix.lock == '0' && matrix.skill == 5
        run: python3 tools/arcana20_join/surface_encoded_phase.py "$RUNNER_TEMP/live-output" 0.65 c_column
      - name: C rain and aftermath native detail
        if: matrix.lock == '0' && matrix.skill == 5
        run: python3 tools/arcana20_join/surface_encoded_phase.py "$RUNNER_TEMP/live-output" 0.78 c_rain
      # #02: actual moving-world frames across formation, flight, bite and OUT.
      - name: Wyrm emergence
        if: matrix.skill == 2
        run: python3 tools/arcana20_join/surface_encoded_phase.py "$RUNNER_TEMP/live-output" 0.12 wyrm_emerge
      - name: Wyrm travel and orbit
        if: matrix.skill == 2
        run: python3 tools/arcana20_join/surface_encoded_phase.py "$RUNNER_TEMP/live-output" 0.38 wyrm_travel
      - name: Wyrm windup
        if: matrix.skill == 2
        run: python3 tools/arcana20_join/surface_encoded_phase.py "$RUNNER_TEMP/live-output" 0.60 wyrm_windup
      - name: Wyrm bite
        if: matrix.skill == 2
        run: python3 tools/arcana20_join/surface_encoded_phase.py "$RUNNER_TEMP/live-output" 0.655 wyrm_bite
      - name: Wyrm cooling and aftermath
        if: matrix.skill == 2
        run: python3 tools/arcana20_join/surface_encoded_phase.py "$RUNNER_TEMP/live-output" 0.84 wyrm_aftermath
      # #03: ballistic approach, impact sites, connecting sigil and cooling.
      - name: Meteor approach
        if: matrix.skill == 3
        run: python3 tools/arcana20_join/surface_encoded_phase.py "$RUNNER_TEMP/live-output" 0.12 meteor_approach
      - name: Meteor impacts
        if: matrix.skill == 3
        run: python3 tools/arcana20_join/surface_encoded_phase.py "$RUNNER_TEMP/live-output" 0.35 meteor_impacts
      - name: Meteor sigil construction
        if: matrix.skill == 3
        run: python3 tools/arcana20_join/surface_encoded_phase.py "$RUNNER_TEMP/live-output" 0.68 meteor_sigil
      - name: Meteor cooling and aftermath
        if: matrix.skill == 3
        run: python3 tools/arcana20_join/surface_encoded_phase.py "$RUNNER_TEMP/live-output" 0.88 meteor_aftermath
      # #07: crystalline growth, spires, fracture and falling shards.
      - name: Basilica emergence
        if: matrix.skill == 7
        run: python3 tools/arcana20_join/surface_encoded_phase.py "$RUNNER_TEMP/live-output" 0.20 basilica_emerge
      - name: Basilica spires
        if: matrix.skill == 7
        run: python3 tools/arcana20_join/surface_encoded_phase.py "$RUNNER_TEMP/live-output" 0.43 basilica_spires
      - name: Basilica fracture
        if: matrix.skill == 7
        run: python3 tools/arcana20_join/surface_encoded_phase.py "$RUNNER_TEMP/live-output" 0.72 basilica_fracture
      - name: Basilica falling-shard aftermath
        if: matrix.skill == 7
        run: python3 tools/arcana20_join/surface_encoded_phase.py "$RUNNER_TEMP/live-output" 0.87 basilica_aftermath
      # #08: spiral opening, shaft, reversal and receding droplets.
      - name: Undertow opening
        if: matrix.skill == 8
        run: python3 tools/arcana20_join/surface_encoded_phase.py "$RUNNER_TEMP/live-output" 0.18 maw_opening
      - name: Undertow shaft
        if: matrix.skill == 8
        run: python3 tools/arcana20_join/surface_encoded_phase.py "$RUNNER_TEMP/live-output" 0.43 maw_shaft
      - name: Undertow reversal
        if: matrix.skill == 8
        run: python3 tools/arcana20_join/surface_encoded_phase.py "$RUNNER_TEMP/live-output" 0.60 maw_reversal
      - name: Undertow aftermath
        if: matrix.skill == 8
        run: python3 tools/arcana20_join/surface_encoded_phase.py "$RUNNER_TEMP/live-output" 0.83 maw_aftermath
      # Remaining S selections: separately surfaced lifecycle phases from the
      # exact same moving-world recording, in addition to the full video.
      - name: C selection opening
        if: matrix.skill == 10 || matrix.skill == 15 || matrix.skill == 17
        run: python3 tools/arcana20_join/surface_encoded_phase.py "$RUNNER_TEMP/live-output" 0.16 "${{ matrix.variant }}_opening"
      - name: C selection buildup
        if: matrix.skill == 10 || matrix.skill == 15 || matrix.skill == 17
        run: python3 tools/arcana20_join/surface_encoded_phase.py "$RUNNER_TEMP/live-output" 0.40 "${{ matrix.variant }}_buildup"
      - name: C selection climax
        if: matrix.skill == 10 || matrix.skill == 15 || matrix.skill == 17
        run: python3 tools/arcana20_join/surface_encoded_phase.py "$RUNNER_TEMP/live-output" 0.68 "${{ matrix.variant }}_climax"
      - name: C selection aftermath
        if: matrix.skill == 10 || matrix.skill == 15 || matrix.skill == 17
        run: python3 tools/arcana20_join/surface_encoded_phase.py "$RUNNER_TEMP/live-output" 0.86 "${{ matrix.variant }}_aftermath"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r20-${{ matrix.variant }}-${{ matrix.lighting }}-lock${{ matrix.lock }}
          path: |
            ${{ runner.temp }}/live-output/*.json
            ${{ runner.temp }}/live-output/*.mkv
            ${{ runner.temp }}/live-output/*.mp4
            ${{ runner.temp }}/live-output/ab_*.png
            ${{ runner.temp }}/live-output/crown_pair_*.png
            ${{ runner.temp }}/live-output/crown_pair_*.jpg
            ${{ runner.temp }}/live.log
            ${{ runner.temp }}/encode.log
          if-no-files-found: warn
  thorn-range-review:
    if: ${{ !contains(github.event.head_commit.message, '[r29-n]') && !contains(github.event.head_commit.message, '[r28-six]') && !contains(github.event.head_commit.message, '[d19-both]') && !contains(github.event.head_commit.message, '[d19-isolate]') && !contains(github.event.head_commit.message, '[all20-provisional]') && !contains(github.event.head_commit.message, '[d19-fixed]') && !contains(github.event.head_commit.message, '[d19-only]') && !contains(github.event.head_commit.message, '[n18-only]') && !contains(github.event.head_commit.message, '[n14-only]') && !contains(github.event.head_commit.message, '[n13-only]') && !contains(github.event.head_commit.message, '[n12-only]') && !contains(github.event.head_commit.message, '[n06-only]') && !contains(github.event.head_commit.message, '[n04-only]') && !contains(github.event.head_commit.message, '[r26-fixed]') && !contains(github.event.head_commit.message, '[r26-tip]') && !contains(github.event.head_commit.message, '[r26-match]') && !contains(github.event.head_commit.message, '[r26-f]') && !contains(github.event.head_commit.message, '[f-five]') && !contains(github.event.head_commit.message, '[f-only]') && !contains(github.event.head_commit.message, '[f09-only]') && !contains(github.event.head_commit.message, '[f11-only]') && !contains(github.event.head_commit.message, '[f01-only]') }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        lighting: [normal, dimmed]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: SOH-AVFX-EXPERIMENTAL-NOT-PLAYTEST-READY
          path: bundle
      - name: Unpack same-run Linux build
        run: |
          set -euo pipefail
          unzip -q "$(find bundle -name SOH_AVFX_EXPERIMENTAL_linux.zip -print -quit)" -d release
          chmod +x release/SOH_AVFX_Playtest.x86_64
      - name: Capture twelve real-world ranges and bearings and short-cast motion
        env:
          AVFX_C15_MATRIX: '1'
          AVFX_LIVE_LIGHT: ${{ matrix.lighting }}
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=10s 2100s xvfb-run -a -s '-screen 0 1280x720x24' env LIBGL_ALWAYS_SOFTWARE=1 \
            "$GITHUB_WORKSPACE/release/SOH_AVFX_Playtest.x86_64" --audio-driver Dummy --rendering-method gl_compatibility --resolution 1280x720 \
            --user-data-dir "$RUNNER_TEMP/range-user" -- --avfx-live-capture 2>&1 | tee "$RUNNER_TEMP/range.log"
          grep -Fq 'AVFX_THORN_MATRIX_PASS' "$RUNNER_TEMP/range.log"
          ! grep -Eq 'AVFX_LIVE_FAIL|SCRIPT ERROR:|Parse Error:|Shader compilation failed' "$RUNNER_TEMP/range.log"
      - name: Produce real-pixel image sheet and geometry metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow
          matrix_file=$(find "$RUNNER_TEMP" "$HOME/.local/share/godot/app_userdata" -name matrix.json -path '*/avfx_thorn_matrix/*' -print -quit 2>/dev/null)
          test -n "$matrix_file"
          echo "THORN_RAW_DIR=$(dirname "$matrix_file")" >> "$GITHUB_ENV"
          python3 tools/arcana20_join/thorn_matrix_review_pack.py "$(dirname "$matrix_file")" "$RUNNER_TEMP/range-review" "$GITHUB_SHA"
          for file in "$RUNNER_TEMP"/range-review/thorn_matrix_*.jpg "$RUNNER_TEMP"/range-review/matrix.json; do
            python3 - "$file" "$RUNNER_TEMP/git-blob.json" <<'PY'
          import base64,json,pathlib,sys
          pathlib.Path(sys.argv[2]).write_text(json.dumps({'content':base64.b64encode(pathlib.Path(sys.argv[1]).read_bytes()).decode(),'encoding':'base64'}))
          PY
            if blob=$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/blobs" --input "$RUNNER_TEMP/git-blob.json" --jq .sha); then
              echo "::notice title=THORN_RANGE_GIT_BLOB_$(basename "$file")::$blob"
            else
              echo "::warning::Git blob transport unavailable; use range artifact"
            fi
          done
      - name: Encode and surface after-fix full short-cast motion
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          motion="$THORN_RAW_DIR/short_motion"
          trap 'rc=$?; msg=$(tail -c 3000 "$RUNNER_TEMP/short-encode.log" 2>/dev/null | tr "\n" " " || true); echo "::error title=THORN_ENCODE_FAILED::exit $rc $msg"; exit "$rc"' ERR
          if ! command -v ffmpeg; then sudo apt-get update -qq && sudo apt-get install -y ffmpeg; fi
          python3 tools/arcana20_join/encode_live_capture.py "$motion" 2>&1 | tee "$RUNNER_TEMP/short-encode.log"
          ffmpeg -hide_banner -loglevel error -y -f concat -safe 0 -i "$motion/frames.txt" -fps_mode vfr -c:v libx264 -preset medium -crf 30 -pix_fmt yuv420p -movflags +faststart "$motion/short-motion-720p.mp4" 2>&1 | tee -a "$RUNNER_TEMP/short-encode.log"
          python3 - "$motion/short-motion-720p.mp4" "$RUNNER_TEMP/motion-blob.json" <<'PY'
          import base64,json,pathlib,sys
          pathlib.Path(sys.argv[2]).write_text(json.dumps({'content':base64.b64encode(pathlib.Path(sys.argv[1]).read_bytes()).decode(),'encoding':'base64'}))
          PY
          if [ "$(stat -c %s "$motion/short-motion-720p.mp4")" -le 8000000 ] && blob=$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/blobs" --input "$RUNNER_TEMP/motion-blob.json" --jq .sha); then
            echo "::notice title=THORN_AFTER_720P_GIT_BLOB::$blob"
          else
            echo "::warning::Short-cast motion Git blob unavailable; use raw range artifact"
          fi
      - name: Preserve original lossless range capture and metadata
        if: always() && env.THORN_RAW_DIR != ''
        uses: actions/upload-artifact@v4
        with:
          name: batch-s-thorn-ranges-raw-${{ matrix.lighting }}
          path: ${{ env.THORN_RAW_DIR }}/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always() && env.THORN_RAW_DIR != ''
        with:
          name: batch-s-thorn-ranges-${{ matrix.lighting }}
          path: ${{ runner.temp }}/range-review/
          if-no-files-found: error
          retention-days: 14
  thorn-before-origin:
