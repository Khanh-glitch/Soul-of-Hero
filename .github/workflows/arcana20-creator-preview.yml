          ! grep -Eq 'SCRIPT ERROR:|Parse Error:' "$RUNNER_TEMP/before-import.log"
          timeout --signal=TERM --kill-after=10s 1500s xvfb-run -a -s '-screen 0 1280x720x24' env LIBGL_ALWAYS_SOFTWARE=1 \
