  creator-f-review:
    # Bounded same-SHA package: S and #05 implementations remain in the build,
    # with their existing review records. Do not re-record accepted S footage.
    # CT authorizes five creator-review candidates with named gates, not Gold.
    if: ${{ contains(github.event.head_commit.message, '[f-five]') }}
    needs: [build, windows-current-runtime, live-motion, source-review]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: SOH-AVFX-EXPERIMENTAL-NOT-PLAYTEST-READY
          path: deliverable/build
      - uses: actions/download-artifact@v4
        with:
          pattern: batch-f-review-*
          path: deliverable/fusion-1x
      - uses: actions/download-artifact@v4
        with:
          pattern: r20-F*-lock0
          path: deliverable/fusion-full-cast
      - name: Verify five independent same-run pairs and assemble review
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow
          python3 tools/arcana20_join/test_worldseed_tip_trace.py
          # Upload-artifact preserves paths beneath the common runner.temp
          # ancestor: the manifest and release ZIPs are in different folders.
          manifest=$(find deliverable/build -name arcana20_join_manifest.json -type f -print -quit)
          checksums=$(find deliverable/build -name SHA256SUMS.txt -type f -print -quit)
          test -s "$manifest" && test -s "$checksums"
          python3 - "$manifest" "$GITHUB_SHA" <<'PY'
          import json, pathlib, sys
          manifest=json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert manifest['shas']['avfx']==sys.argv[2], manifest['shas']
          PY
          release_dir=$(dirname "$checksums")
          (cd "$release_dir" && test -s SOH_AVFX_EXPERIMENTAL_linux.zip && test -s SOH_AVFX_EXPERIMENTAL_windows.zip && sha256sum -c SHA256SUMS.txt && unzip -tq SOH_AVFX_EXPERIMENTAL_linux.zip && unzip -tq SOH_AVFX_EXPERIMENTAL_windows.zip)
          for id in F01 F09 F11 F16 F20; do
            for light in normal dimmed; do
              dir="deliverable/fusion-full-cast/r20-${id}-${light}-lock0"
              small="deliverable/fusion-1x/batch-f-review-${id}-${light}"
              timeline=$(find "$dir" -name timeline.json -type f -print -quit)
              movie=$(find "$dir" -name review.mp4 -type f -print -quit)
              test -n "$timeline" && test -s "$timeline"
              test -n "$movie" && test -s "$movie"
              test -s "$small/metadata.json"
              test "$(find "$small" -name 'sheet_*.jpg' | wc -l)" -eq 1
              python3 - "$small/metadata.json" "$GITHUB_SHA" <<'PY'
          import json, sys
          metadata=json.load(open(sys.argv[1], encoding='utf-8'))
          assert metadata['avfx_sha'] == sys.argv[2], (metadata['avfx_sha'], sys.argv[2])
          PY
            done
          done
          # Additional same-SHA diagnostic pairs: explicit frozen restoration,
          # single-tick fragment traces, and fixed-world full opening to OUT.
          for light in normal dimmed; do
            matched="deliverable/fusion-full-cast/r20-F01MATCH-${light}-lock0"
            step="deliverable/fusion-full-cast/r20-F16STEP-${light}-lock0"
            fixed20="deliverable/fusion-full-cast/r20-F20FIX-${light}-lock0"
            fixed16="deliverable/fusion-full-cast/r20-F16FIX-${light}-lock0"
            for dir in "$matched" "$step" "$fixed20" "$fixed16"; do
              test -s "$dir/live-output/timeline.json"
              test -s "$dir/live-output/review.mp4"
            done
            for index in 0 1; do
              test -s "$matched/live-output/crown_pair_${index}.json"
              for state in 0 1 2; do test -s "$matched/live-output/crown_pair_${index}_${state}.png"; done
            done
            python3 tools/arcana20_join/inspect_worldseed_tip_trace.py "$step/live-output/f16_tip_trace.json"
            python3 - "$matched/live-output" "$fixed16/live-output/timeline.json" "$fixed20/live-output/timeline.json" <<'PY'
          import json, pathlib, sys
          from PIL import Image, ImageChops
          p=pathlib.Path(sys.argv[1])
          for index in range(2):
              record=json.loads((p/f'crown_pair_{index}.json').read_text())
              assert record['stable']
              a,b,c=[Image.open(p/name).convert('RGB') for name in record['files']]
              assert not ImageChops.difference(a,c).getbbox()
              assert ImageChops.difference(a,b).getbbox()
          for filename in sys.argv[2:]:
              r=json.load(open(filename)); assert r['camera_mode']=='diagnostic_world_fixed'
              assert r['frames'][0]['source_tick_last_observed']==0, 'fixed view missed opening baseline'
          PY
          done
          # The 1x review.mp4 contains all captured frames; keep lossless
          # videos in their separately downloadable same-run Action artifacts.
          find deliverable/fusion-full-cast -type f -name '*.mkv' -delete
          cp prototypes/arcana_fusion20/renderer/playtest/HUONG_DAN_THU_NGHIEM.txt deliverable/HUONG_DAN.txt
          cp prototypes/arcana_fusion20/renderer/playtest/BATCH_S_REVIEW.txt deliverable/BATCH_S_REVIEW.txt
          cp prototypes/arcana_fusion20/renderer/playtest/BATCH_F_REVIEW.txt deliverable/BATCH_F_REVIEW.txt
          printf 'AVFX code SHA: %s\nREVIEW_CANDIDATES_WITH_CT_GATES; visual-only, not Gold or PLAYTEST_READY.\n' "$GITHUB_SHA" > deliverable/CODE_SHA.txt
          (cd deliverable && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt > "$RUNNER_TEMP/f-deliverable-checksums.log")
          (cd deliverable && zip -q -r "$RUNNER_TEMP/ARCANA_FIVE_FUSIONS_CREATOR_REVIEW.zip" .)
          (cd "$RUNNER_TEMP" && sha256sum ARCANA_FIVE_FUSIONS_CREATOR_REVIEW.zip > ARCANA_FIVE_FUSIONS_CREATOR_REVIEW.zip.sha256 && sha256sum -c ARCANA_FIVE_FUSIONS_CREATOR_REVIEW.zip.sha256 && unzip -tq ARCANA_FIVE_FUSIONS_CREATOR_REVIEW.zip)
          unzip -l "$RUNNER_TEMP/ARCANA_FIVE_FUSIONS_CREATOR_REVIEW.zip" > "$RUNNER_TEMP/f-final-contents.txt"
          for required in CODE_SHA.txt BATCH_F_REVIEW.txt BATCH_S_REVIEW.txt HUONG_DAN.txt SHA256SUMS.txt SOH_AVFX_EXPERIMENTAL_linux.zip SOH_AVFX_EXPERIMENTAL_windows.zip; do
            grep -Fq "$required" "$RUNNER_TEMP/f-final-contents.txt"
          done
          echo "::notice title=F_FINAL_ZIP_SHA256::$(cat "$RUNNER_TEMP/ARCANA_FIVE_FUSIONS_CREATOR_REVIEW.zip.sha256")"
      - uses: actions/upload-artifact@v4
        with:
          name: ARCANA_FIVE_FUSIONS_CREATOR_REVIEW
          path: |
            ${{ runner.temp }}/ARCANA_FIVE_FUSIONS_CREATOR_REVIEW.zip
            ${{ runner.temp }}/ARCANA_FIVE_FUSIONS_CREATOR_REVIEW.zip.sha256
            ${{ runner.temp }}/f-final-contents.txt
          if-no-files-found: error
          retention-days: 14

  all20-provisional:
    if: ${{ contains(github.event.head_commit.message, '[all20-provisional]') }}
    needs: [build, windows-current-runtime, live-motion]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: SOH-AVFX-EXPERIMENTAL-NOT-PLAYTEST-READY
          path: deliverable/build
      - uses: actions/download-artifact@v4
        with:
          pattern: r20-*-lock0
          path: deliverable/05-same-sha
      # Closed S/F evidence is reused, not re-recorded or relabeled as this SHA.
      - uses: actions/download-artifact@v4
        with:
          pattern: batch-s-motion-*
          path: deliverable/historical
          run-id: 41378915227
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          pattern: batch-s-review-*
          path: deliverable/historical
          run-id: 41378915227
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          pattern: batch-f-motion-*
          path: deliverable/historical
          run-id: 41396229547
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          pattern: batch-f-review-*
          path: deliverable/historical
          run-id: 41396229547
          github-token: ${{ github.token }}
      - name: Verify current builds and assemble all-20 evidence
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow
          if ! command -v ffmpeg; then sudo apt-get update -qq && sudo apt-get install -y ffmpeg; fi
          manifest=$(find deliverable/build -name arcana20_join_manifest.json -type f -print -quit)
          checksums=$(find deliverable/build -name SHA256SUMS.txt -type f -print -quit)
          test -s "$manifest" && test -s "$checksums"
          python3 - "$manifest" "$GITHUB_SHA" <<'PY'
          import json, sys
          m=json.load(open(sys.argv[1])); assert m['shas']['avfx']==sys.argv[2]
          PY
          (cd "$(dirname "$checksums")" && sha256sum -c SHA256SUMS.txt && unzip -tq SOH_AVFX_EXPERIMENTAL_linux.zip && unzip -tq SOH_AVFX_EXPERIMENTAL_windows.zip)
          python3 tools/arcana20_join/all20_provisional.py deliverable "$GITHUB_WORKSPACE" "$GITHUB_SHA"
          # Raw #05 and historical downloads include huge MKVs / duplicate
          # sheets; compact checked evidence is now in evidence/.
          rm -rf deliverable/05-same-sha deliverable/historical
          cp prototypes/arcana_fusion20/renderer/playtest/HUONG_DAN_THU_NGHIEM.txt deliverable/HUONG_DAN.txt
          cp prototypes/arcana_fusion20/renderer/playtest/ALL20_PROVISIONAL.txt deliverable/ALL20_PROVISIONAL.txt
          cp prototypes/arcana_fusion20/renderer/playtest/BATCH_S_REVIEW.txt deliverable/BATCH_S_REVIEW.txt
          cp prototypes/arcana_fusion20/renderer/playtest/BATCH_F_REVIEW.txt deliverable/BATCH_F_REVIEW.txt
          printf 'Build AVFX SHA: %s\nHistorical capture SHAs: see EVIDENCE_MANIFEST.json.\nPROVISIONAL, visual-only; not Gold or PLAYTEST_READY.\n' "$GITHUB_SHA" > deliverable/CODE_SHA.txt
          (cd deliverable && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt > "$RUNNER_TEMP/all20-check.log")
          (cd deliverable && zip -q -r "$RUNNER_TEMP/ARCANA20_ALL_CANDIDATES_PROVISIONAL.zip" .)
          (cd "$RUNNER_TEMP" && sha256sum ARCANA20_ALL_CANDIDATES_PROVISIONAL.zip > ARCANA20_ALL_CANDIDATES_PROVISIONAL.zip.sha256 && sha256sum -c ARCANA20_ALL_CANDIDATES_PROVISIONAL.zip.sha256 && unzip -tq ARCANA20_ALL_CANDIDATES_PROVISIONAL.zip)
          echo "::notice title=ALL20_ZIP_SHA256::$(cat "$RUNNER_TEMP/ARCANA20_ALL_CANDIDATES_PROVISIONAL.zip.sha256")"
      - uses: actions/upload-artifact@v4
        with:
          name: ARCANA20_ALL_CANDIDATES_PROVISIONAL
          path: |
            ${{ runner.temp }}/ARCANA20_ALL_CANDIDATES_PROVISIONAL.zip
            ${{ runner.temp }}/ARCANA20_ALL_CANDIDATES_PROVISIONAL.zip.sha256
          if-no-files-found: error
          retention-days: 14

  all20-upload-verification:
    if: ${{ contains(github.event.head_commit.message, '[all20-provisional]') }}
    needs: all20-provisional
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ARCANA20_ALL_CANDIDATES_PROVISIONAL
          path: upload
      - name: Check downloaded bytes, contained files and all 20 pairs
        run: |
          set -euo pipefail
          cd upload
          sha256sum -c ARCANA20_ALL_CANDIDATES_PROVISIONAL.zip.sha256
          unzip -tq ARCANA20_ALL_CANDIDATES_PROVISIONAL.zip
          unzip -q ARCANA20_ALL_CANDIDATES_PROVISIONAL.zip -d unpack
          cd unpack
          sha256sum -c SHA256SUMS.txt > "$RUNNER_TEMP/upload-check.log"
          python3 - "$GITHUB_SHA" <<'PY'
          import json,pathlib,sys
          p=pathlib.Path('.'); m=json.loads((p/'EVIDENCE_MANIFEST.json').read_text()); assert m['build_sha']==sys.argv[1]
          rows=m['captures']; assert len(rows)==42 and {r['skill'] for r in rows}==set(range(1,21))
          assert sum(r['skill']==5 and r['same_as_build'] for r in rows)==4
          for r in rows:
              d=p/'evidence'/f"{r['skill']:02d}_{r['variant']}_{r['light']}"
              for name in ('motion.mp4','metadata.json','sheet.jpg'): assert (d/name).stat().st_size>0
          for name in ('SOH_AVFX_EXPERIMENTAL_linux.zip','SOH_AVFX_EXPERIMENTAL_windows.zip'):
              assert len(list((p/'build').rglob(name)))==1
          print('::notice title=ALL20_UPLOAD_VERIFIED::42 native-size review videos and sheets, 20 IDs, 05 A/B, current build and checksums verified from uploaded artifact')
          PY
