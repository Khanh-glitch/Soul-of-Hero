# R20: package two #05 art directions and native-scale locked-scene review.
name: ARCANA20 R20 Abyssal Bloom A-B creator package
on:
  workflow_dispatch:
  push:
    branches: [arena/c7b0c4e8-soul-of-hero]
    paths: ['.github/workflows/arcana20-creator-preview.yml']
permissions:
  actions: read
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Assemble exact owner composition in disposable directory
        run: |
          set -euo pipefail
          git fetch --depth=1 --no-tags origin 04eacf62f1a3740a57e08691c3a9006d454aaa2c 6b801554a6af95424b4e39dd29f43c146aa13848 2cb1a3c5f093724eb9fecbdf45909ccb611f7b32 18e7afcbd576bbd9bfbcc509b2ee13216186a522 e505173edd119fdd955cf6249511b575a5468440
          python3 tools/arcana20_join/assemble.py --out "$RUNNER_TEMP/avfx-playtest" --avfx-sha "$GITHUB_SHA" --a0-sha 04eacf62f1a3740a57e08691c3a9006d454aaa2c
          python3 - "$RUNNER_TEMP/avfx-playtest/project.godot" <<'PY'
          import pathlib, sys
          p = pathlib.Path(sys.argv[1]); s = p.read_text()
          assert 'config/name="SOUL OF HERO"' in s
          s = s.replace('config/name="SOUL OF HERO"', 'config/name="SOH AVFX experimental playtest"')
          s = s.replace('run/main_scene="res://game/app/app_root.tscn"', 'run/main_scene="res://prototypes/arcana_fusion20/renderer/playtest/arcana20_playtest.tscn"')
          p.write_text(s)
          PY
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.0
          use-dotnet: false
          include-templates: true
      - name: Import disposable project
        run: |
          set -o pipefail
          timeout 300s godot --headless --editor --path "$RUNNER_TEMP/avfx-playtest" --import --quit 2>&1 | tee "$RUNNER_TEMP/import.log"
          grep -E 'SCRIPT ERROR:|Parse Error:|ERROR:' "$RUNNER_TEMP/import.log" | head -20 | while IFS= read -r line; do echo "::notice title=IMPORT_DIAGNOSTIC::$line"; done || true
          ! grep -Eq 'SCRIPT ERROR:|Parse Error:' "$RUNNER_TEMP/import.log"
      # R17 refresh includes moving #09 caster tracking, density-adapted C
      # #11 channels, tapered #04 blade, #13 bark/#14 growth, #18 visual
      # projectile release and real-enemy ring controls. Art remains unapproved.
      - name: Export self-contained Linux and Windows builds
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/avfx-playtest/export_presets.cfg" <<'PRESETS'
          [preset.0]
          name="Linux"
          platform="Linux"
          runnable=true
          export_filter="all_resources"
          include_filter="*.json,*.txt"
          exclude_filter=""
          [preset.0.options]
          binary_format/embed_pck=true
          texture_format/s3tc_bptc=true
          texture_format/etc2_astc=false
          [preset.1]
          name="Windows"
          platform="Windows Desktop"
          runnable=false
          export_filter="all_resources"
          include_filter="*.json,*.txt"
          exclude_filter=""
          [preset.1.options]
          binary_format/embed_pck=true
          texture_format/s3tc_bptc=true
          texture_format/etc2_astc=false
          codesign/enable=false
          application/modify_resources=false
          PRESETS
          mkdir -p "$RUNNER_TEMP/release/linux" "$RUNNER_TEMP/release/windows"
          godot --headless --path "$RUNNER_TEMP/avfx-playtest" --export-release Linux "$RUNNER_TEMP/release/linux/SOH_AVFX_Playtest.x86_64"
          godot --headless --path "$RUNNER_TEMP/avfx-playtest" --export-release Windows "$RUNNER_TEMP/release/windows/SOH_AVFX_Playtest.exe"
          test -s "$RUNNER_TEMP/release/linux/SOH_AVFX_Playtest.x86_64"
          test -s "$RUNNER_TEMP/release/windows/SOH_AVFX_Playtest.exe"
      - name: Launch exported Linux application and exercise real route
        run: |
          set -o pipefail
          timeout 480s xvfb-run -a -s '-screen 0 1280x720x24' env LIBGL_ALWAYS_SOFTWARE=1 "$RUNNER_TEMP/release/linux/SOH_AVFX_Playtest.x86_64" --audio-driver Dummy --rendering-method gl_compatibility --resolution 1280x720 --user-data-dir "$RUNNER_TEMP/playtest-user" -- --avfx-playtest-smoke 2>&1 | tee "$RUNNER_TEMP/playtest.log"
          grep -Fq 'AVFX_PLAYTEST_SMOKE PASS' "$RUNNER_TEMP/playtest.log"
          ! grep -Eq 'AVFX_PLAYTEST_FAIL|SCRIPT ERROR:|Parse Error:|Shader compilation failed' "$RUNNER_TEMP/playtest.log"
      - name: Package experimental builds and manifest
        run: |
          set -euo pipefail
          for os in linux windows; do
            cp prototypes/arcana_fusion20/renderer/playtest/HUONG_DAN_THU_NGHIEM.txt "$RUNNER_TEMP/release/$os/"
            cp "$RUNNER_TEMP/avfx-playtest/arcana20_join_manifest.json" "$RUNNER_TEMP/release/$os/"
            (cd "$RUNNER_TEMP/release/$os" && zip -q -r "../SOH_AVFX_EXPERIMENTAL_${os}.zip" .)
          done
          sha256sum "$RUNNER_TEMP/release/"*.zip > "$RUNNER_TEMP/release/SHA256SUMS.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SOH-AVFX-EXPERIMENTAL-NOT-PLAYTEST-READY
          path: |
            ${{ runner.temp }}/release/*.zip
            ${{ runner.temp }}/release/SHA256SUMS.txt
            ${{ runner.temp }}/avfx-playtest/arcana20_join_manifest.json
            ${{ runner.temp }}/import.log
            ${{ runner.temp }}/playtest.log
          if-no-files-found: warn
          retention-days: 14
  windows-current-runtime:
    needs: build
    # Native Windows OS executes the same-run exported candidate.
    # Headless startup verifies platform/runtime, not GPU or visual quality.
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SOH-AVFX-EXPERIMENTAL-NOT-PLAYTEST-READY
          path: bundle
      - name: Run exported Windows binary on Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Get-ChildItem -Path bundle -Filter SOH_AVFX_EXPERIMENTAL_windows.zip -Recurse | Select-Object -First 1
          if (-not $zip) { Write-Host '::error::Windows zip missing from same-run artifact'; exit 1 }
          Expand-Archive -Path $zip.FullName -DestinationPath win
          $exe = (Get-ChildItem -Path win -Filter SOH_AVFX_Playtest.exe -Recurse | Select-Object -First 1).FullName
          if (-not $exe) { throw 'Windows binary missing' }
          $out = Join-Path $env:RUNNER_TEMP 'avfx-windows-out.log'
          $err = Join-Path $env:RUNNER_TEMP 'avfx-windows-err.log'
          $save = Join-Path $env:RUNNER_TEMP 'avfx-windows-user'
          $p = Start-Process -FilePath $exe -ArgumentList @('--headless','--audio-driver','Dummy','--resolution','1280x720','--user-data-dir', $save, '--','--avfx-playtest-smoke') -RedirectStandardOutput $out -RedirectStandardError $err -PassThru
          if (-not $p.WaitForExit(420000)) { $p.Kill(); throw 'Windows smoke timed out' }
          Get-Content $out; Get-Content $err
          if ($p.ExitCode -ne 0) { throw "Windows executable exited $($p.ExitCode)" }
          if (-not (Select-String -Path $out -SimpleMatch 'AVFX_PLAYTEST_SMOKE PASS' -Quiet)) { throw 'Windows PASS marker missing' }
          if (Select-String -Path $out,$err -Pattern 'AVFX_PLAYTEST_FAIL|SCRIPT ERROR:|Parse Error:' -Quiet) { throw 'Windows runtime script error' }
          Write-Output '::notice title=WINDOWS_RUNTIME::Windows x64 exported current build ran real route and smoke; headless, no GPU or visual acceptance.'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arcana20-windows-current-runtime-logs
          path: |
            ${{ runner.temp }}/avfx-windows-out.log
            ${{ runner.temp }}/avfx-windows-err.log
          if-no-files-found: warn
  live-motion:
    # Corrected presentation timestamps are sampled before PNG write I/O.
    # Newest art receives live moving-world full-cast capture; the earlier
    # all-20 single-enemy and multi-enemy matrix runs remain separate evidence.
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - {skill: 5, lighting: normal, variant: A, lock: '0'}
          - {skill: 5, lighting: dimmed, variant: A, lock: '0'}
          - {skill: 5, lighting: normal, variant: B, lock: '0'}
          - {skill: 5, lighting: dimmed, variant: B, lock: '0'}
          - {skill: 5, lighting: normal, variant: B, lock: '1'}
          - {skill: 5, lighting: dimmed, variant: B, lock: '1'}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: SOH-AVFX-EXPERIMENTAL-NOT-PLAYTEST-READY
          path: bundle
      - name: Unpack same-run exported Linux application
        run: |
          set -euo pipefail
          zip=$(find bundle -name SOH_AVFX_EXPERIMENTAL_linux.zip -print -quit)
          test -n "$zip"
          mkdir release
          unzip -q "$zip" -d release
          chmod +x release/SOH_AVFX_Playtest.x86_64
      - name: Run actual game with moving player, Skeleton and camera
        env:
          AVFX_LIVE_SKILL: ${{ matrix.skill }}
          AVFX_LIVE_LIGHT: ${{ matrix.lighting }}
          AVFX_LIVE_CAPTURE: '1'
          AVFX_05_VARIANT: ${{ matrix.variant }}
          AVFX_AB_LOCK: ${{ matrix.lock }}
        run: |
          set +e
          set -o pipefail
          timeout --signal=TERM --kill-after=10s 780s xvfb-run -a -s '-screen 0 1280x720x24' env LIBGL_ALWAYS_SOFTWARE=1 \
            "$GITHUB_WORKSPACE/release/SOH_AVFX_Playtest.x86_64" --audio-driver Dummy --rendering-method gl_compatibility --resolution 1280x720 \
            --user-data-dir "$RUNNER_TEMP/live-user" -- --avfx-live-capture 2>&1 | tee "$RUNNER_TEMP/live.log"
          result=${PIPESTATUS[0]}
          grep -E 'AVFX_LIVE_|SCRIPT ERROR|Parse Error|Shader compilation failed|ERROR:' "$RUNNER_TEMP/live.log" | head -20 | while IFS= read -r line; do echo "::notice title=LIVE_DIAGNOSTIC::$line"; done || true
          if [ "$result" -ne 0 ]; then echo "::error::Live capture failed exit=$result"; exit "$result"; fi
          grep -Fq 'AVFX_LIVE_PASS' "$RUNNER_TEMP/live.log" || exit 1
          ! grep -Eq 'AVFX_LIVE_FAIL|SCRIPT ERROR:|Parse Error:|Shader compilation failed' "$RUNNER_TEMP/live.log"
      - name: Collect native gameplay frames and metadata
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/live-output"
          folder=$(find "$RUNNER_TEMP" "$HOME/.local/share/godot/app_userdata" -type f -name timeline.json -path '*/avfx_live_capture/*' -print -quit 2>/dev/null || true)
          if [ -n "$folder" ]; then cp -a "$(dirname "$folder")"/. "$RUNNER_TEMP/live-output/"; else echo '::warning::No timeline.json found'; fi
      - name: Install image preview dependency
        run: python3 -m pip install --quiet pillow
      # Full viewport remains in the lossless motion artifact. Limit notices
      # so all four water beats fit within GitHub's per-job annotation cap.
      - name: Encode native wall-time capture
        run: |
          set -euo pipefail
          if ! command -v ffmpeg; then sudo apt-get update -qq && sudo apt-get install -y ffmpeg; fi
          python3 tools/arcana20_join/encode_live_capture.py "$RUNNER_TEMP/live-output" 2>&1 | tee "$RUNNER_TEMP/encode.log"
      - name: Verify six locked native A-B comparisons
        if: matrix.lock == '1'
        run: python3 tools/arcana20_join/compare_abyssal_ab.py "$RUNNER_TEMP/live-output"
      - name: Locked original release at native scale
        if: matrix.lock == '1'
        run: python3 tools/arcana20_join/surface_abyssal_ab.py "$RUNNER_TEMP/live-output" 2 a
      - name: Locked directed release at native scale
        if: matrix.lock == '1'
        run: python3 tools/arcana20_join/surface_abyssal_ab.py "$RUNNER_TEMP/live-output" 2 b
      - name: Locked original column at native scale
        if: matrix.lock == '1'
        run: python3 tools/arcana20_join/surface_abyssal_ab.py "$RUNNER_TEMP/live-output" 3 a
      - name: Locked directed column at native scale
        if: matrix.lock == '1'
        run: python3 tools/arcana20_join/surface_abyssal_ab.py "$RUNNER_TEMP/live-output" 3 b
      # Actual source-clock beats; stills supplement, never replace full videos.
      - name: A opening and peak native detail
        if: matrix.lock == '0'
        run: python3 tools/arcana20_join/surface_encoded_phase.py "$RUNNER_TEMP/live-output" 0.50 a_peak
      - name: C eruption native detail
        if: matrix.lock == '0'
        run: python3 tools/arcana20_join/surface_encoded_phase.py "$RUNNER_TEMP/live-output" 0.58 c_release
      - name: C column native detail
        if: matrix.lock == '0'
        run: python3 tools/arcana20_join/surface_encoded_phase.py "$RUNNER_TEMP/live-output" 0.65 c_column
      - name: C rain and aftermath native detail
        if: matrix.lock == '0'
        run: python3 tools/arcana20_join/surface_encoded_phase.py "$RUNNER_TEMP/live-output" 0.78 c_rain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r20-${{ matrix.variant }}-${{ matrix.lighting }}-lock${{ matrix.lock }}
          path: |
            ${{ runner.temp }}/live-output/*.json
            ${{ runner.temp }}/live-output/*.mkv
            ${{ runner.temp }}/live-output/*.mp4
            ${{ runner.temp }}/live-output/ab_*.png
            ${{ runner.temp }}/live.log
            ${{ runner.temp }}/encode.log
          if-no-files-found: warn
  source-review:
    # Independent reference artifacts, pinned to their exact capture SHAs.
    # These are neutral source-only diagnostics, not a fake battlefield.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: arcana20-a05-original-native-diagnostic
          run-id: 41325084491
          github-token: ${{ github.token }}
          path: source-a
      - uses: actions/download-artifact@v4
        with:
          name: arcana20-c05-original-late-release
          run-id: 41325336921
          github-token: ${{ github.token }}
          path: source-c
      - name: Construct neutral source-field previews
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow
          mkdir source-review
          find source-a -name original_270.png -exec cp {} source-review/a_original_270.png \;
          find source-a -name native_270.png -exec cp {} source-review/a_native_270.png \;
          test -f source-review/a_original_270.png && test -f source-review/a_native_270.png
          python3 tools/arcana20_join/surface_c05_source.py source-c source-review
      - name: Original A peak source-only
        run: python3 prototypes/arcana_fusion20/renderer/c10_review_surface.py source-review a_original_270
      - name: Native A peak source-only
        run: python3 prototypes/arcana_fusion20/renderer/c10_review_surface.py source-review a_native_270
      - name: Original C release source-only
        run: python3 prototypes/arcana_fusion20/renderer/c10_review_surface.py source-review c_original_336
      - name: Native C release source-only
        run: python3 prototypes/arcana_fusion20/renderer/c10_review_surface.py source-review c_native_336
      - name: Original C column source-only
        run: python3 prototypes/arcana_fusion20/renderer/c10_review_surface.py source-review c_original_372
      - name: Native C column source-only
        run: python3 prototypes/arcana_fusion20/renderer/c10_review_surface.py source-review c_native_372
      - uses: actions/upload-artifact@v4
        with:
          name: r20-05-neutral-original-native-source-beats
          path: source-review/
  full-frame-review:
    # Surface one genuine locked full 1280x720 frame for native-scale review;
    # the artifact keeps the untouched lossless frames, not this JPEG transport.
    needs: live-motion
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: r20-B-normal-lock1
          path: locked
      - run: python3 -m pip install --quiet pillow
      - name: Prepare actual full-resolution directed eruption
        run: python3 tools/arcana20_join/surface_abyssal_full.py locked 3 b "$RUNNER_TEMP/full-chunks"
      # GitHub caps annotations per step; four groups preserve the complete
      # 1280x720 image while the untouched PNG remains in the artifact.
      - name: Full frame chunks 0-8
        run: for i in $(seq 0 8); do [ ! -f "$RUNNER_TEMP/full-chunks/$i" ] || echo "::notice title=R20_FULL_3_b_$i::$(cat "$RUNNER_TEMP/full-chunks/$i")"; done
      - name: Full frame chunks 9-17
        run: for i in $(seq 9 17); do [ ! -f "$RUNNER_TEMP/full-chunks/$i" ] || echo "::notice title=R20_FULL_3_b_$i::$(cat "$RUNNER_TEMP/full-chunks/$i")"; done
      - name: Full frame chunks 18-26
        run: for i in $(seq 18 26); do [ ! -f "$RUNNER_TEMP/full-chunks/$i" ] || echo "::notice title=R20_FULL_3_b_$i::$(cat "$RUNNER_TEMP/full-chunks/$i")"; done
      - name: Full frame chunks 27-35
        run: for i in $(seq 27 35); do [ ! -f "$RUNNER_TEMP/full-chunks/$i" ] || echo "::notice title=R20_FULL_3_b_$i::$(cat "$RUNNER_TEMP/full-chunks/$i")"; done
  creator-package:
    # One download, only when the same-run runtime and evidence jobs succeed.
    needs: [build, windows-current-runtime, live-motion, source-review, full-frame-review]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: SOH-AVFX-EXPERIMENTAL-NOT-PLAYTEST-READY
          path: deliverable/build
      - uses: actions/download-artifact@v4
        with:
          pattern: r20-*-lock*
          path: deliverable/real-world-evidence
      - uses: actions/download-artifact@v4
        with:
          name: r20-05-neutral-original-native-source-beats
          path: deliverable/source-comparisons
      - name: Include guide and exact code provenance
        run: |
          cp prototypes/arcana_fusion20/renderer/playtest/HUONG_DAN_THU_NGHIEM.txt deliverable/HUONG_DAN.txt
          printf 'AVFX code SHA: %s\nExperimental visual-only preview; not GOLD or PLAYTEST_READY.\n' "$GITHUB_SHA" > deliverable/CODE_SHA.txt
      - uses: actions/upload-artifact@v4
        with:
          name: R20-ABYSSAL-BLOOM-CREATOR-REVIEW
          path: deliverable/
          if-no-files-found: error
          retention-days: 14
