name: ARCANA20 Ashen Guillotine candidate regression and world review
on:
  workflow_dispatch:
  push:
    branches: [arena/c7b0c4e8-soul-of-hero]
    paths:
      - '.github/workflows/arcana20-a04-candidate-review.yml'
      - 'prototypes/arcana_fusion20/renderer/a04_blade_candidate_test.gd'
      - 'prototypes/arcana_fusion20/renderer/arcana20_overworld_join_test.gd'
      - 'prototypes/arcana_fusion20/renderer/source_a/a_redesign_spells.gd'
permissions:
  contents: read
jobs:
  candidate:
    strategy:
      fail-fast: false
      matrix:
        light: [normal, dimmed]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Assemble current A0 and AVFX candidates
        run: |
          git fetch --depth=1 --no-tags origin 04eacf62f1a3740a57e08691c3a9006d454aaa2c 6b801554a6af95424b4e39dd29f43c146aa13848 2cb1a3c5f093724eb9fecbdf45909ccb611f7b32 18e7afcbd576bbd9bfbcc509b2ee13216186a522 e505173edd119fdd955cf6249511b575a5468440
          python3 tools/arcana20_join/assemble.py --out "$RUNNER_TEMP/a04" --avfx-sha "$GITHUB_SHA" --a0-sha 04eacf62f1a3740a57e08691c3a9006d454aaa2c
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.0
          use-dotnet: false
          include-templates: false
      - name: Import isolated composition
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/a04/artifacts"
          godot --headless --path "$RUNNER_TEMP/a04" --import 2>&1 | tee "$RUNNER_TEMP/a04/artifacts/import.log"
          ! grep -Eq 'SCRIPT ERROR:|Parse Error:' "$RUNNER_TEMP/a04/artifacts/import.log"
      - name: Verify opaque local dark-blade coverage and fade
        run: |
          set -o pipefail
          godot --headless --path "$RUNNER_TEMP/a04" --script res://prototypes/arcana_fusion20/renderer/a04_blade_candidate_test.gd 2>&1 | tee "$RUNNER_TEMP/a04/artifacts/blade.log"
          grep -Fq 'A04_BLADE_PASS' "$RUNNER_TEMP/a04/artifacts/blade.log"
          ! grep -Eq 'SCRIPT ERROR:|Parse Error:' "$RUNNER_TEMP/a04/artifacts/blade.log"
      - name: Capture actual A0 world and authored blade beats
        env:
          ARCANA20_PHASE_LIGHT: ${{ matrix.light }}
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=10s 1200s xvfb-run -a -s '-screen 0 1280x720x24' env LIBGL_ALWAYS_SOFTWARE=1 ARCANA20_PHASE_FIRST=4 ARCANA20_PHASE_LAST=4 \
            godot --path "$RUNNER_TEMP/a04" --rendering-method gl_compatibility --audio-driver Dummy --resolution 1280x720 --windowed \
            --user-data-dir "$RUNNER_TEMP/a04-user" --script res://prototypes/arcana_fusion20/renderer/arcana20_overworld_join_test.gd \
            2>&1 | tee "$RUNNER_TEMP/a04/artifacts/world.log"
          grep -Fq 'ARCANA20_JOIN_DIAGNOSTIC PASS' "$RUNNER_TEMP/a04/artifacts/world.log"
          ! grep -Eq 'SCRIPT ERROR:|Parse Error:|Shader compilation failed|JOIN_FAIL' "$RUNNER_TEMP/a04/artifacts/world.log"
      - run: python3 -m pip install --quiet pillow
      - name: Surface blade materialised
        run: python3 prototypes/arcana_fusion20/renderer/c10_review_surface.py "$RUNNER_TEMP/a04/artifacts" phase_04_blade_ready_tick201
      - name: Surface physical cut
        run: python3 prototypes/arcana_fusion20/renderer/arcana20_candidate_review_surface.py "$RUNNER_TEMP/a04/artifacts" 4 guillotine_impact
      - name: Surface cut frame 3.45 seconds
        run: python3 prototypes/arcana_fusion20/renderer/c10_review_surface.py "$RUNNER_TEMP/a04/artifacts" phase_04_cut_motion_207_tick207
      - name: Surface cut frame 3.5 seconds
        run: python3 prototypes/arcana_fusion20/renderer/c10_review_surface.py "$RUNNER_TEMP/a04/artifacts" phase_04_cut_motion_210_tick210
      - name: Surface cut frame 3.6 seconds
        run: python3 prototypes/arcana_fusion20/renderer/c10_review_surface.py "$RUNNER_TEMP/a04/artifacts" phase_04_cut_motion_216_tick216
      - name: Surface opening rupture
        run: python3 prototypes/arcana_fusion20/renderer/c10_review_surface.py "$RUNNER_TEMP/a04/artifacts" phase_04_candidate_A_rupture_impact_05_tick286
      - name: Surface later rupture
        run: python3 prototypes/arcana_fusion20/renderer/c10_review_surface.py "$RUNNER_TEMP/a04/artifacts" phase_04_candidate_A_rupture_impact_07_tick295
      - name: Report structural and runtime assertions
        if: always()
        run: |
          grep -E 'A04_BLADE_|JOIN_FAIL|SCRIPT ERROR|Parse Error|ARCANA20_JOIN_DIAGNOSTIC' "$RUNNER_TEMP/a04/artifacts/blade.log" "$RUNNER_TEMP/a04/artifacts/world.log" | sed 's/^/::notice title=A04_CANDIDATE::/' || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arcana20-a04-candidate-${{ matrix.light }}
          path: |
            ${{ runner.temp }}/a04/arcana20_join_manifest.json
            ${{ runner.temp }}/a04/artifacts/
          if-no-files-found: warn
