name: Chapter 1 — architecture breakthrough (native Godot 4.7)

# Blood Crucible authored architecture: builds the art, validates the authored
# plan against the gameplay map, runs the frozen Level 5 suites and photographs
# the six required stations natively, with and without the architecture layer.
on:
  push:
    branches:
      - arena/6e89e68d-soul-of-hero
    paths:
      - "game/levels/presentation/crucible_art.gd"
      - "game/levels/dungeon_level.gd"
      - "assets/environment/chapter1/crucible/**"
      - "tools/level5/**"
      - "tools/captures/crucible_capture.*"
      - "data/levels/chapter_1_level_5_architecture.json"
      - ".github/workflows/chapter1-architecture.yml"
  workflow_dispatch:

permissions:
  contents: write
concurrency:
  group: chapter1-architecture
  cancel-in-progress: true

jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.0
          use-dotnet: false
          include-templates: false

      - name: Install Xvfb and Mesa
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes xvfb libgl1-mesa-dri python3-pip >/dev/null

      - name: Rebuild the art and the authored plan from source
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --break-system-packages pillow
          python3 tools/level5/art_crucible.py | tee .artifacts_art.log
          python3 tools/level5/architecture.py | tee .artifacts_arch.log
          git diff --stat -- assets/environment/chapter1/crucible data/levels/chapter_1_level_5_architecture.json

      - name: The authored plan is deterministic and matches the committed files
        run: |
          set -euo pipefail
          python3 tools/level5/art_crucible.py > /dev/null
          python3 tools/level5/architecture.py > /dev/null
          if ! git diff --quiet -- assets/environment/chapter1/crucible data/levels/chapter_1_level_5_architecture.json; then
            echo "ART/PLAN DRIFT: regenerating changed the committed files"
            git diff --stat -- assets/environment/chapter1/crucible data/levels/chapter_1_level_5_architecture.json
            exit 1
          fi
          echo "ART/PLAN REGEN: byte-identical"

      - name: Import the project
        run: |
          set -euo pipefail
          timeout 900s godot --headless --audio-driver Dummy --editor --path . --import --quit \
            2>&1 | tee import.log

      - name: Compile-check the capture harness
        continue-on-error: true
        run: |
          set +eo pipefail
          timeout 300s godot --headless --audio-driver Dummy --path . \
            res://tools/captures/crucible_capture.tscn -- --out-dir=/tmp/none 2>&1 | head -60

      - name: Frozen Level 5 suites
        continue-on-error: true
        run: |
          set +e
          mkdir -p .artifacts/crucible/suites
          rc=0
          run() {
            local name="$1"; shift
            timeout 900s env "$@" > ".artifacts/crucible/suites/${name}.log" 2>&1 || rc=1
            grep -hE "PASSED|FAILED|CONTRACT|OK" ".artifacts/crucible/suites/${name}.log" | tail -3
          }
          run chapter_1_map_design_test godot --headless --path . res://tests/chapter_1_map_design_test.tscn
          run chapter_1_campaign_map_design_test godot --headless --path . res://tests/chapter_1_campaign_map_design_test.tscn
          run chapter_1_collision_route_test godot --headless --path . res://tests/chapter_1_collision_route_test.tscn
          run level5_miniboss godot --headless --path . res://tests/level_5_hooded_archer_miniboss_test.tscn
          run level5_pickup godot --headless --path . res://tests/level_5_archer_soul_pickup_test.tscn
          run level5_live_loot godot --headless --path . res://tests/level_5_live_loot_test.tscn
          run level5_balance_matrix godot --headless --path . res://tests/chapter_1_balance_matrix_test.tscn
          exit $rc

      - name: Capture the six stations, native, art on and off
        continue-on-error: true
        run: |
          set +e
          for mode in after before; do
            extra=""
            [ "$mode" = "before" ] && extra="--no-art"
            export SOUL_OF_HERO_SAVE_PATH="user://crucible_${mode}_$GITHUB_RUN_ID.json"
            xvfb-run -a -s "-screen 0 1280x720x24" env LIBGL_ALWAYS_SOFTWARE=1 \
              timeout 420s godot --path . --audio-driver Dummy \
              --rendering-method gl_compatibility --rendering-driver opengl3 \
              --resolution 1280x720 res://tools/captures/crucible_capture.tscn \
              -- --out-dir="res://.artifacts/crucible/${mode}" --tag="${mode}" $extra \
              > ".artifacts/crucible/${mode}.log" 2>&1
            echo "--- ${mode} exit=$? ---"
            tail -40 ".artifacts/crucible/${mode}.log"
          done

      - name: Publish the evidence
        if: always()
        continue-on-error: true
        run: |
          set +eo pipefail
          mkdir -p docs/chapter1-visual-overhaul/architecture-breakthrough/L05/logs
          shopt -s nullglob
          for logfile in .artifacts/crucible/*.log .artifacts/crucible/suites/*.log; do
            cp "$logfile" "docs/chapter1-visual-overhaul/architecture-breakthrough/L05/logs/$(basename "$logfile" .log).txt"
          done
          shopt -u nullglob
          python3 -m pip install --quiet --break-system-packages pillow
          python3 tools/level5/evidence_breakthrough.py || echo "evidence script failed; logs are still committed"
          git config user.name "chapter1-art-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/chapter1-visual-overhaul/architecture-breakthrough
          if git diff --cached --quiet; then
            echo "nothing to publish"
            exit 0
          fi
          git commit -m "ci(crucible): publish native architecture evidence [skip ci]"
          # another workflow may have pushed while this one ran: reconcile, never
          # force, and retry the publish a few times before giving up
          for attempt in 1 2 3; do
            git pull --rebase --quiet origin arena/6e89e68d-soul-of-hero || true
            if git push --quiet origin HEAD:arena/6e89e68d-soul-of-hero; then
              echo "published on attempt $attempt"
              exit 0
            fi
            sleep 5
          done
          echo "PUBLISH FAILED after 3 attempts"
          exit 1

      - name: Verify the architecture actually built
        if: always()
        run: |
          set -uo pipefail
          rc=0
          for mode in after before; do
            logfile=".artifacts/crucible/${mode}.log"
            if [ "$mode" = "after" ]; then
              grep -qE "CRUCIBLE CAPTURE: .* art=on wall_cells=[1-9][0-9]*" "$logfile" \
                || { echo "MISSING ARCHITECTURE in after run"; rc=1; }
              grep -q "CRUCIBLE STATION tag=after station=f3_fight" "$logfile" \
                || { echo "MISSING live boss frame"; rc=1; }
            else
              grep -qE "CRUCIBLE CAPTURE: .* art=off" "$logfile" || { echo "before run did not disable art"; rc=1; }
            fi
          done
          [ $rc -eq 0 ] && echo "ARCHITECTURE OK"
          exit $rc
