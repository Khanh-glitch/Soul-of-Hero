name: ARCANA20 inspect existing review artifact

on:
  workflow_dispatch:
  push:
    branches: [arena/c7b0c4e8-soul-of-hero]
    paths: ['.github/workflows/arcana20-review-triage.yml']

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: arcana20-visual-review
          run-id: 41202674400
          github-token: ${{ github.token }}
          path: prototypes/arcana_fusion20/renderer/evidence_out/review
      - name: Emit stage data and review thumbnails
        shell: bash
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('prototypes/arcana_fusion20/renderer/evidence_out/review')
          manifest=root/'manifest.json'
          print('::notice::REVIEW_MANIFEST '+(manifest.read_text().replace('\n',' ') if manifest.exists() else 'MISSING'))
          comp=root/'skill_19/d_comparison.json'
          if comp.exists():
              d=json.loads(comp.read_text())['results']
              compact={k:{n:v[n] for n in ('rgb_mae','rgb_max_error','nonblack_mask_iou')} for k,v in d.items()}
              print('::notice::D_RESULTS '+json.dumps(compact,separators=(',',':')))
          files=sorted(root.glob('skill_*/stages.json'))
          for i in range(0, len(files), 5):
              docs={path.parent.name:json.loads(path.read_text()) for path in files[i:i+5]}
              print('::notice::REVIEW_STAGES '+json.dumps(docs, separators=(',',':')))
          PY
      - name: Thumbnails 01-05
        run: python3 tools/arcana20_review/emit_thumbnails.py source 0 5
      - name: Thumbnails 06-10
        run: python3 tools/arcana20_review/emit_thumbnails.py source 5 10
      - name: Thumbnails 11-15
        run: python3 tools/arcana20_review/emit_thumbnails.py source 10 15
      - name: Thumbnails 16-20
        run: python3 tools/arcana20_review/emit_thumbnails.py source 15 20
      - uses: actions/download-artifact@v4
        with:
          name: arcana20-real-scene-diagnostics
          run-id: 41203931063
          github-token: ${{ github.token }}
          path: prototypes/arcana_fusion20/renderer/evidence_out/real-scene
      - name: Real-scene manifest summary
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('prototypes/arcana_fusion20/renderer/evidence_out/real-scene')
          f=root/'manifest.json'
          if f.exists():
              doc=json.loads(f.read_text())
              print('::notice::SCENE_SUMMARY '+json.dumps({k:doc.get(k) for k in ('scene','level','enemy','limitations','overlap_probe')},separators=(',',':')))
          else:
              print('::notice::SCENE_SUMMARY manifest missing')
          print('::notice::SCENE_COUNT '+str(len(list(root.glob('skill_*.png')))))
          PY
      - name: Experimental C-pass thumbnails
        run: |
          python3 - <<'PY'
          import base64, io
          from pathlib import Path
          from PIL import Image
          root = Path('prototypes/arcana_fusion20/renderer/evidence_out/real-scene')
          for path in sorted(root.glob('skill_*_c_separate.png')):
              with Image.open(path) as im:
                  im.thumbnail((240, 135), Image.Resampling.NEAREST)
                  im = im.convert('RGB').quantize(colors=16, method=Image.Quantize.MEDIANCUT)
                  while True:
                      out = io.BytesIO()
                      im.save(out, format='PNG', optimize=True)
                      data = base64.b64encode(out.getvalue()).decode('ascii')
                      if len(data) <= 3900:
                          break
                      if im.width <= 80:
                          raise SystemExit(f'{path}: thumbnail too large')
                      im = im.resize((int(im.width * 0.85), int(im.height * 0.85)), Image.Resampling.NEAREST)
                  print(f'::notice title=REVIEW_C_SEPARATE_{path.stem}::{data}', flush=True)
          PY
      - name: Scene thumbnails 01-05
        run: python3 tools/arcana20_review/emit_thumbnails.py scene 0 5
      - name: Scene thumbnails 06-10
        run: python3 tools/arcana20_review/emit_thumbnails.py scene 5 10
      - name: Scene thumbnails 11-15
        run: python3 tools/arcana20_review/emit_thumbnails.py scene 10 15
      - name: Scene thumbnails 16-20
        run: python3 tools/arcana20_review/emit_thumbnails.py scene 15 20
      - name: Retrieve runtime error stack context
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh run view 41201111499 --log > /tmp/arcana-scene-log.txt
          gh run view 41200681217 --log > /tmp/arcana-source-log.txt
          python3 - <<'PY'
          from pathlib import Path
          for name in ('scene','source'):
              lines=Path('/tmp/arcana-'+name+'-log.txt').read_text().splitlines()
              matched=[]
              for i,line in enumerate(lines):
                  if 'SCRIPT ERROR:' in line or 'ARCANA20_CAPTURE_FAIL' in line:
                      matched.append(' | '.join(lines[i:i+4]))
              for item in sorted(set(matched))[:8]:
                  print('::notice::STACK_'+name.upper()+' '+item[:3500].replace('%','%25'))
              print('::notice::STACK_'+name.upper()+'_COUNT '+str(len(matched)))
          PY
