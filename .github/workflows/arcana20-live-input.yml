name: ARCANA20 live movement and visual-cast diagnostic
on:
  workflow_dispatch:
  push:
    branches: [arena/c7b0c4e8-soul-of-hero]
    paths:
      - '.github/workflows/arcana20-live-input.yml'
      - 'prototypes/arcana_fusion20/renderer/arcana20_overworld_join_test.gd'
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assemble immutable disposable owner overlay
        run: |
          git fetch --no-tags origin 62f6a32d08d319bfdcd28235786558f54f49b420 6b801554a6af95424b4e39dd29f43c146aa13848 2cb1a3c5f093724eb9fecbdf45909ccb611f7b32 18e7afcbd576bbd9bfbcc509b2ee13216186a522 e505173edd119fdd955cf6249511b575a5468440
          python3 tools/arcana20_join/assemble.py --out "$RUNNER_TEMP/arcana20-live" --avfx-sha "$GITHUB_SHA"
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.0
          use-dotnet: false
          include-templates: false
      - name: Import disposable project
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/arcana20-live/artifacts"
          timeout 300s godot --headless --path "$RUNNER_TEMP/arcana20-live" --import 2>&1 | tee "$RUNNER_TEMP/arcana20-live/artifacts/import.log"
          ! grep -Eq 'SCRIPT ERROR:|Parse Error:' "$RUNNER_TEMP/arcana20-live/artifacts/import.log"
      - name: Exercise real pointer, movement, enemy, camera and injected visual cast
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=10s 900s xvfb-run -a -s '-screen 0 1280x720x24' env LIBGL_ALWAYS_SOFTWARE=1 ARCANA20_LIVE_INPUT=1 \
            godot --verbose --path "$RUNNER_TEMP/arcana20-live" --rendering-method gl_compatibility --audio-driver Dummy --resolution 1280x720 --windowed \
            --user-data-dir "$RUNNER_TEMP/arcana20-live-user" --script res://prototypes/arcana_fusion20/renderer/arcana20_overworld_join_test.gd \
            2>&1 | tee "$RUNNER_TEMP/arcana20-live/artifacts/live.log"
          grep -Fq 'ARCANA20_JOIN_DIAGNOSTIC PASS' "$RUNNER_TEMP/arcana20-live/artifacts/live.log"
          ! grep -Eq 'SCRIPT ERROR:|Parse Error:|Shader compilation failed|JOIN_FAIL' "$RUNNER_TEMP/arcana20-live/artifacts/live.log"
      - name: Summarize probe
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/arcana20-live/artifacts/live.log"; then
            grep -E 'JOIN_LIVE_INPUT|JOIN_C20_LIVE|JOIN_FAIL|live input|SCRIPT ERROR|Parse Error|ARCANA20_JOIN_DIAGNOSTIC' "$RUNNER_TEMP/arcana20-live/artifacts/live.log" | head -30 | while IFS= read -r l; do echo "::notice::$l"; done || true
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arcana20-historical-overworld-live-input
          path: |
            ${{ runner.temp }}/arcana20-live/arcana20_join_manifest.json
            ${{ runner.temp }}/arcana20-live/artifacts/
          if-no-files-found: warn
