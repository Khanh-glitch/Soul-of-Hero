name: ARCANA20 C20 selected polygons source diagnostic
on:
  workflow_dispatch:
  push:
    branches: [arena/c7b0c4e8-soul-of-hero]
    paths:
      - 'tools/arcana20_source_compare/c20_poly_reference.ts'
      - 'tools/arcana20_source_compare/compare_c20_poly.py'
      - 'prototypes/arcana_fusion20/renderer/c20_poly_source_compare.gd'
      - 'prototypes/arcana_fusion20/renderer/source_c/c_reality_ripper_fusion.gd'
      - '.github/workflows/arcana20-c20-poly-source-compare.yml'
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.0
          use-dotnet: false
          include-templates: false
      - name: Install comparison tools
        run: |
          npm install --prefix "$RUNNER_TEMP/c20-node" esbuild@0.25.12
          python3 -m pip install --quiet pillow numpy
      - name: Capture original C selected polygons
        run: |
          set -o pipefail
          godot --headless --path . --import > import.log 2>&1
          ! grep -Eq 'SCRIPT ERROR:|Parse Error:' import.log
          mkdir -p artifacts/arcana20-c20-poly-source
          "$RUNNER_TEMP/c20-node/node_modules/.bin/esbuild" tools/arcana20_source_compare/c20_poly_reference.ts --bundle --platform=node --format=esm --outfile="$RUNNER_TEMP/c20-ref.mjs"
          node "$RUNNER_TEMP/c20-ref.mjs" artifacts/arcana20-c20-poly-source
      - name: Capture native selected C polygons
        run: |
          set -o pipefail
          timeout 600s godot --headless --path . --script res://prototypes/arcana_fusion20/renderer/c20_poly_source_compare.gd 2>&1 | tee native.log
          grep -Fq 'C20_POLYGON_CAPTURE_COMPLETE' native.log
          ! grep -Eq 'SCRIPT ERROR:|Parse Error:' native.log
      - name: Measure authored coverage and color errors
        run: |
          set -o pipefail
          python3 tools/arcana20_source_compare/compare_c20_poly.py artifacts/arcana20-c20-poly-source | tee comparison.log
          sed 's/^/::notice::/' comparison.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arcana20-c20-original-selected-polygons
          path: |
            artifacts/arcana20-c20-poly-source/
            import.log
            native.log
            comparison.log
          if-no-files-found: warn
