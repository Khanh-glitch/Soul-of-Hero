name: ARCANA20 C10 native full motion before and after
on:
  workflow_dispatch:
  push:
    branches: [arena/c7b0c4e8-soul-of-hero]
    paths:
      - '.github/workflows/arcana20-c10-full-motion.yml'
      - 'prototypes/arcana_fusion20/renderer/c10_motion_world_test.gd'
      - 'tools/arcana20_join/visual_only_harness.py'
permissions:
  contents: read
jobs:
  capture:
    strategy:
      fail-fast: false
      matrix:
        revision: [baseline, candidate]
        light: [normal, dimmed]
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Assemble exact source revision and common visual-only test
        env:
          REVISION: ${{ matrix.revision }}
        run: |
          BASELINE=13df6c9934014b820e569d05daec8612814c4263
          A0=04eacf62f1a3740a57e08691c3a9006d454aaa2c
          git fetch --depth=1 --no-tags origin "$BASELINE" "$A0" 6b801554a6af95424b4e39dd29f43c146aa13848 2cb1a3c5f093724eb9fecbdf45909ccb611f7b32 18e7afcbd576bbd9bfbcc509b2ee13216186a522 e505173edd119fdd955cf6249511b575a5468440
          SHA="$GITHUB_SHA"; if [ "$REVISION" = baseline ]; then SHA="$BASELINE"; fi
          python3 tools/arcana20_join/assemble.py --out "$RUNNER_TEMP/c10-motion" --avfx-sha "$SHA" --a0-sha "$A0"
          cp prototypes/arcana_fusion20/renderer/c10_motion_world_test.gd "$RUNNER_TEMP/c10-motion/prototypes/arcana_fusion20/renderer/"
          python3 tools/arcana20_join/visual_only_harness.py "$RUNNER_TEMP/c10-motion"
          printf 'source_avfx=%s\ntest_harness=%s\na0=%s\n' "$SHA" "$GITHUB_SHA" "$A0" > "$RUNNER_TEMP/c10-motion/capture-revisions.txt"
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.0
          use-dotnet: false
          include-templates: false
      - name: Import
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/c10-motion/artifacts"
          godot --headless --path "$RUNNER_TEMP/c10-motion" --import 2>&1 | tee "$RUNNER_TEMP/c10-motion/artifacts/import.log"
          ! grep -Eq 'SCRIPT ERROR:|Parse Error:' "$RUNNER_TEMP/c10-motion/artifacts/import.log"
      - name: Capture every source tick with scripted actor/camera movement
        env:
          ARCANA20_PHASE_LIGHT: ${{ matrix.light }}
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=10s 3000s xvfb-run -a -s '-screen 0 1280x720x24' env LIBGL_ALWAYS_SOFTWARE=1 ARCANA20_PHASE_FIRST=10 \
            godot --path "$RUNNER_TEMP/c10-motion" --rendering-method gl_compatibility --audio-driver Dummy --resolution 1280x720 --windowed \
            --user-data-dir "$RUNNER_TEMP/c10-motion-user" --script res://prototypes/arcana_fusion20/renderer/c10_motion_world_test.gd \
            2>&1 | tee "$RUNNER_TEMP/c10-motion/artifacts/world.log"
          grep -Fq 'ARCANA20_JOIN_DIAGNOSTIC PASS' "$RUNNER_TEMP/c10-motion/artifacts/world.log"
          ! grep -Eq 'SCRIPT ERROR:|Parse Error:|Shader compilation failed|JOIN_FAIL' "$RUNNER_TEMP/c10-motion/artifacts/world.log"
      - name: Package native lossless and playable motion
        run: |
          set -euo pipefail
          if ! command -v ffmpeg; then sudo apt-get update -qq && sudo apt-get install -y ffmpeg; fi
          ROOT="$RUNNER_TEMP/c10-motion/artifacts/arcana20-join"
          test "$(find "$ROOT" -name 'c10_motion_*.png' | wc -l)" -eq 444
          ffmpeg -hide_banner -loglevel error -framerate 60 -i "$ROOT/c10_motion_%03d.png" -frames:v 444 -c:v ffv1 -pix_fmt bgr0 "$RUNNER_TEMP/c10-motion/artifacts/c10-native-lossless.mkv"
          ffmpeg -hide_banner -loglevel error -framerate 60 -i "$ROOT/c10_motion_%03d.png" -frames:v 444 -c:v libx264 -crf 16 -pix_fmt yuv420p "$RUNNER_TEMP/c10-motion/artifacts/c10-review.mp4"
          rm "$ROOT"/c10_motion_*.png
      - name: Surface motion assertions
        if: always()
        run: grep -E 'JOIN_(OK|FAIL).*C10 full-motion|SCRIPT ERROR|Parse Error|ARCANA20_JOIN_DIAGNOSTIC' "$RUNNER_TEMP/c10-motion/artifacts/world.log" | sed 's/^/::notice title=C10_MOTION::/' || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c10-motion-${{ matrix.revision }}-${{ matrix.light }}
          path: |
            ${{ runner.temp }}/c10-motion/capture-revisions.txt
            ${{ runner.temp }}/c10-motion/arcana20_join_manifest.json
            ${{ runner.temp }}/c10-motion/artifacts/
          if-no-files-found: warn
