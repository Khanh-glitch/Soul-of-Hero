name: A0 Waystation input and separate-process pilot
on:
  push:
    branches: [arena/dea2428e-soul-of-hero]
    paths: ['tools/ci/godot_isolated.sh', 'tests/fixtures/a0_save_diff.gd', 'tests/survival_save_diff_test.gd', 'game/overworld/**', 'game/survival/**', 'game/characters/knight/**', 'game/autoload/save_service.gd', 'tests/survival_connector_pilot_test.gd', 'tests/survival_waystation_input_restart_test.gd', 'tests/survival_waystation_authority_test.gd', 'tests/fixtures/a0_connector*', 'data/survival/items/**', '.github/workflows/a0-waystation-input-restart.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      A1_SHA: 2951bf8559b2e289ce99fd4d394d44c46fdd91b1
      LIBGL_ALWAYS_SOFTWARE: 1
      GODOT_SILENCE_ROOT_WARNING: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 2951bf8559b2e289ce99fd4d394d44c46fdd91b1
          path: .a1-connector-source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify exact legacy and canonical source pins; derive one chunk
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .a1-connector-source rev-parse HEAD)" = "$A1_SHA"
          for f in data/overworld/hollow_marches.json data/overworld/hollow_marches_layers.json data/overworld/hollow_marches_props.json game/characters/knight/knight.tscn; do
            cmp "$f" ".a1-connector-source/$f"
          done
          mkdir -p artifacts/a0-connector/slices artifacts/ud_import artifacts/ud_waystation
          (cd .a1-connector-source && python tools/survival/worldgen/compile_connector.py --out "$GITHUB_WORKSPACE/artifacts/a0-connector" && python tools/survival/worldgen/validate_connector.py --out "$GITHUB_WORKSPACE/artifacts/a0-connector")
          cp .a1-connector-source/data/survival/world/vertical_slice/poi_crown_{waystation,relay_shed}.slice.json artifacts/a0-connector/slices/
          python - <<'PY'
          import json
          p=json.load(open('artifacts/a0-connector/connector_validation_report.json'))
          assert p['ok'] and p['collision_cells']==46 and p['dressed_cells']==48 and p['suppressed_props']==14 and p['imported_chunks']==1 and not p['native_playable'], p
          PY
          rm -rf .a1-connector-source
      - name: Verify exact reviewed A3 source and catalog bytes
        run: |
          set -euo pipefail
          printf '%s  %s\n' \
            2261047e99f9b85e3e3e3b4999e93afba62cbb9923b33743546d181d9f0c96a3 game/survival/economy/a0_economy_adapter.gd \
            109c268036bb92e5dcca2d23ec5f5c1664e1f8645c01abf189d6b5c90f06302c game/survival/economy/vendor/a3_economy_service.gd \
            8bab244159e17acc34d51a22ab05112090e4f08f146511aa5c61683c7d999a47 game/survival/economy/world_source_adapter.gd \
            7b9670f4971d2f161138e0754cbbe66dfe2a239bf0d15d3079a766d729dd230b data/survival/items/world_source_bindings.v3.json \
            bc88143efb61f2202ae37c96373e07a1643cc29b7fc9a38abc84e4958fe2b984 data/survival/items/sources.json | sha256sum --check -
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.0
          use-dotnet: false
          include-templates: false
      - name: Import exact A0 project
        run: timeout 180s bash tools/ci/godot_isolated.sh --headless --path . --user-data-dir artifacts/ud_import --import > artifacts/connector-import.log 2>&1
      - name: Validate field-diff oracle
        run: |
          set -euo pipefail
          timeout 60s bash tools/ci/godot_isolated.sh --headless --path . --user-data-dir artifacts/ud_import --script res://tests/survival_save_diff_test.gd > artifacts/save-diff-oracle.log 2>&1
          cat artifacts/save-diff-oracle.log
          bash tools/ci/gate_log.sh artifacts/save-diff-oracle.log 'Save diff oracle' 'A0 SAVE DIFF ORACLE PASSED'
      - name: A3 V3 authority and anti-replay fixture on real SaveService
        shell: bash
        run: |
          mkdir -p artifacts/ud_authority
          set +e
          timeout --signal=TERM --kill-after=10s 240s bash tools/ci/godot_isolated.sh --headless --path . --user-data-dir artifacts/ud_authority --script res://tests/survival_waystation_authority_test.gd -- --survival-save-fault-test > artifacts/waystation-authority.log 2>&1
          rc=$?
          set -e
          cat artifacts/waystation-authority.log
          echo "::notice::Waystation authority exit=$rc $(grep -E 'A0 WAYSTATION|  FAIL  |SCRIPT ERROR|Parse Error' artifacts/waystation-authority.log | tail -20 | tr '\n' '~')"
          grep "^A0_SAVE_DIFF " artifacts/waystation-authority.log | while IFS= read -r line; do echo "::notice::$line"; done
          bash tools/ci/gate_log.sh artifacts/waystation-authority.log 'Waystation authority fixture' 'A0 WAYSTATION AUTHORITY PASSED'
          [ "$rc" -eq 0 ]
      - name: Real Hero input, canonical receipt, and separate process replay
        shell: bash
        run: |
          set -euo pipefail
          for mode in first restart; do
            args=()
            if [ "$mode" = restart ]; then args=(-- --restart); fi
            set +e
            timeout --signal=TERM --kill-after=15s 1500s xvfb-run -a bash tools/ci/godot_isolated.sh --path . --rendering-method gl_compatibility --rendering-driver opengl3 --audio-driver Dummy --user-data-dir artifacts/ud_waystation --resolution 960x540 --windowed --script res://tests/survival_waystation_input_restart_test.gd "${args[@]}" > "artifacts/waystation-$mode.log" 2>&1
            rc=$?
            set -e
            cat "artifacts/waystation-$mode.log"
            echo "::notice::Waystation $mode exit=$rc $(grep -E 'A0 WAYSTATION|  FAIL  |SCRIPT ERROR|Parse Error' "artifacts/waystation-$mode.log" | tail -20 | tr '\n' '~')"
            bash tools/ci/gate_log.sh "artifacts/waystation-$mode.log" "Waystation $mode" 'A0 WAYSTATION INPUT RESTART PASSED'
            [ "$rc" -eq 0 ]
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a0-waystation-input-restart-logs
          path: |
            artifacts/connector-import.log
            artifacts/waystation-*.log
          if-no-files-found: warn
