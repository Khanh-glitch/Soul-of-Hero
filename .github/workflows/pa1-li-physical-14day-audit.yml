name: PA1 LI Handoff Source Snapshot (no code changes)
on:
  push:
    branches: [handoff/pa1-li-doc-archive-20261113]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Archive existing sources at HEAD
        run: |
          python3 - <<'PY'
          import glob,zipfile,pathlib,json,hashlib,os
          patterns=[
            'docs/design/VEYRA_INDUSTRIAL_ECONOMY_DECISION_LEDGER_2026-11-12.md',
            'docs/survival/CONTROL_TOWER_CURRENT.md',
            'docs/survival/CHAT_REENTRY_HANDOFF_CURRENT.md',
            'web/ref/bible.md','web/ref/OPERATIONS.md',
            'web/reports/economic-network/*.md',
            'web/reports/economic-network/*.csv',
            'web/reports/economic-network/*.json',
            'web/reports/pa1-li/*.md',
            'web/evidence/mec01-post-pr47/LI_MOTORBIKE_RECONCILIATION_R4.md',
            'web/src/game/catalog.ts','web/src/game/world-economy.ts',
            'web/src/game/economic-graph.ts','web/src/game/economic-audits-m5.ts',
            'web/src/game/economic-sim-audit.ts','web/src/game/economy-adapter.ts',
            'web/src/game/engine.ts','web/src/game/world.ts',
            'web/src/veyra05/full-world-spawn-industrial.audit.test.ts',
            'web/tests/economic-network-*.test.ts',
            'web/tests/pa1-li-reality-gates.test.ts',
            'web/tests/pa1-building-ontology.test.ts'
          ]
          paths=sorted(set(f for g in patterns for f in glob.glob(g) if pathlib.Path(f).is_file()))
          manifest={'repository_commit':os.environ.get('GITHUB_SHA'),
            'source_status':'EXACT_REPO_BYTES, not user-chat paper master',
            'files':[{'path':f,'sha256':hashlib.sha256(pathlib.Path(f).read_bytes()).hexdigest()} for f in paths]}
          with zipfile.ZipFile('PA1_LI_REPO_SOURCES_SNAPSHOT.zip','w',zipfile.ZIP_DEFLATED,compresslevel=8) as z:
            for f in paths:z.write(f,'PA1_LI_GITHUB_SOURCES/'+f)
            z.writestr('PA1_LI_GITHUB_SOURCES/MANIFEST_REPO.json',json.dumps(manifest,indent=2))
          print('PACKED_FILES',len(paths))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: PA1_LI_REPO_SOURCES_HANDOFF
          path: PA1_LI_REPO_SOURCES_SNAPSHOT.zip
          retention-days: 45
