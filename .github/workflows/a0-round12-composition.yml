name: A0 Round 12 owner composition (A1 + A3 + A6 + A8)
on:
  push:
    branches: [arena/dea2428e-soul-of-hero]
    paths-ignore: ['docs/**', 'README.md']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # R13 pins: A1's authored continent, A3's economy, A8's physical sites and
      # A6's presentation, all fetched and composed into the tree this round was
      # developed against.
      A1_SHA: a030cb89a5033ba5faba39995762b4bea1332cec
      A3_SHA: b44e22df3af40939069189be14afc23ee1ce21c4
      A6_SHA: 6d1e8bcee0bbb09be0ff04f14de1f7e59f06cfb8
      A8_SHA: 0f885df862d7d34f18ca456e80b1aaac05b23de0
      GODOT_SILENCE_ROOT_WARNING: 1
      LIBGL_ALWAYS_SOFTWARE: 1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pin and compose the exact owner SHAs
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$A1_SHA" "$A3_SHA" "$A6_SHA" "$A8_SHA"
          python3 tools/a0/compose_owners.py --repo . --out .composition --copy-base \
            --owner a1="$A1_SHA" --owner a3="$A3_SHA" --owner a8="$A8_SHA" --owner a6="$A6_SHA"
          python3 - <<'PY'
          import json
          report = json.load(open(".composition/composition.json"))
          assert report["conflicts"] == [], report["conflicts"]
          for name, info in report["owners"].items():
              assert len(info["sha"]) == 40, (name, info["sha"])
          print("composition:", json.dumps({n: i["sha"][:12] for n, i in report["owners"].items()}))
          import os
          # Fail closed on a vanished seat: these are the artifacts A0 mounts by
          # path, and "the file is missing" must never read as "nothing to do".
          required = [
              "tests/survival/world/godot/chunk_reader.gd",
              "data/survival/world/world_plan.v1.json",
              "data/survival/world/connector/canonical_connector.v1.json",
              "data/survival/world/connector/legacy_cell_delta.v1.json",
              "tests/survival/ui/a6_ui_layer_test.tscn",
              "tests/survival/ui/a6_survival_return_native_test.tscn",
              "tools/run_a6_native_gates.sh",
          ]
          missing = [p for p in required if not os.path.exists(os.path.join(".composition", p))]
          assert missing == [], f"A0_REQUIRED_OWNER_ARTIFACT_ABSENT: {missing}"
          print("required owner artifacts present:", len(required))
          PY
          cat .composition/CONFLICTS.md >> "$GITHUB_STEP_SUMMARY"
          python3 tools/a0/check_composition.py .composition | tee .composition/seats.txt
          grep -q "COMPOSITION SEATS PASSED" .composition/seats.txt
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.0
          use-dotnet: false
          include-templates: false
      - name: Import the composed project
        run: |
          set -euo pipefail
          cd .composition
          mkdir -p ../artifacts/ud_import
          timeout --signal=TERM --kill-after=10s 240s godot --headless --path . \
            --user-data-dir ../artifacts/ud_import --import > ../artifacts/import.log 2>&1 || true
          cat ../artifacts/import.log
          ! grep -E 'SCRIPT ERROR|Parse Error' ../artifacts/import.log
      - name: A0 composed player journeys (native, real input)
        run: |
          # Every composed step must play the COMPOSED tree. Without this the
          # suites ran against A0's own checkout, which has no A1 continent, no
          # import cache and no owner modules — that is why six suites reported
          # exit=1 with an empty log, and why the digest step could not find them.
          cd .composition
          set +e
          failures=0
          # `--user-data-dir` is a NO-OP in Godot 4.7: every suite shares
          # `~/.local/share/godot/app_userdata/SOUL OF HERO`. Round 12 hosted run
          # 41173496737 ran six suites into one dirty profile and the later ones
          # failed on a stale run/tool left by the earlier ones. Each suite now
          # gets a clean profile and its own save document.
          USER_ROOT="$HOME/.local/share/godot/app_userdata/SOUL OF HERO"
          for name in survival_foundation_test survival_a0_pin_fence_test survival_a0_profile_port_test \
                      survival_a0_run_lifecycle_test survival_a0_tool_and_offline_test \
                      survival_a0_player_return_test; do
            log="../artifacts/$name.log"
            rm -rf "$USER_ROOT/tests"
            extra=""
            if [ "$name" = "survival_a0_run_lifecycle_test" ]; then extra="-- --survival-run-clock-test"; fi
            SOUL_OF_HERO_SAVE_PATH="user://composed_${name}_${GITHUB_RUN_ID}.json" \
              timeout --signal=TERM --kill-after=10s 900s godot --headless --path . \
              --script "res://tests/$name.gd" $extra > "$log" 2>&1
            rc=$?
            cat "$log"
            echo "::notice::composed $name exit=$rc $(grep -aE 'PASSED|FAILED' "$log" | tail -1)"
            if [ "$rc" -ne 0 ] || ! grep -qaE 'PASSED' "$log"; then failures=$((failures+1)); fi
          done
          [ "$failures" -eq 0 ]
      - name: A0 authored-world spatial contract (A1 reader, 1024x768 frame)
        run: |
          # Every composed step must play the COMPOSED tree. Without this the
          # suites ran against A0's own checkout, which has no A1 continent, no
          # import cache and no owner modules — that is why six suites reported
          # exit=1 with an empty log, and why the digest step could not find them.
          cd .composition
          set +e
          log="../artifacts/authored_world.log"
          SOUL_OF_HERO_SAVE_PATH="user://composed_authored_${GITHUB_RUN_ID}.json" \
            timeout --signal=TERM --kill-after=10s 300s godot --headless --path . \
            --script res://tests/survival_a0_authored_world_contract_test.gd -- --require-authored > "$log" 2>&1
          rc=$?
          cat "$log"
          echo "::notice::authored world contract exit=$rc $(grep -a 'A0_AUTHORED_REACH' "$log")"
          [ "$rc" -eq 0 ] && grep -qa 'A0 AUTHORED WORLD CONTRACT PASSED' "$log"
      - name: A0 production threat across two processes
        run: |
          # Every composed step must play the COMPOSED tree. Without this the
          # suites ran against A0's own checkout, which has no A1 continent, no
          # import cache and no owner modules — that is why six suites reported
          # exit=1 with an empty log, and why the digest step could not find them.
          cd .composition
          set +e
          export SOUL_OF_HERO_SAVE_PATH="user://composed_threat_${GITHUB_RUN_ID}.json"
          mkdir -p ../artifacts/ud_threat
          timeout --signal=TERM --kill-after=10s 900s xvfb-run -a -s "-screen 0 1280x720x24" \
            godot --path . --audio-driver Dummy --resolution 1280x720 --windowed \
            --user-data-dir ../artifacts/ud_threat --script res://tests/survival_a0_production_threat_test.gd \
            -- --keep-threat > ../artifacts/threat_1.log 2>&1
          first=$?
          cat ../artifacts/threat_1.log
          timeout --signal=TERM --kill-after=10s 300s xvfb-run -a -s "-screen 0 1280x720x24" \
            godot --path . --audio-driver Dummy --resolution 1280x720 --windowed \
            --user-data-dir ../artifacts/ud_threat --script res://tests/survival_a0_production_threat_test.gd \
            -- --verify-threat --keep-threat > ../artifacts/threat_2.log 2>&1
          second=$?
          cat ../artifacts/threat_2.log
          echo "::notice::threat process1=$first process2=$second"
          [ "$first" -eq 0 ] && [ "$second" -eq 0 ]
      - name: R13 A0 authored continent route — real player, two OS processes
        if: ${{ !cancelled() }}
        run: |
          # Every composed step must play the COMPOSED tree. Without this the
          # suites ran against A0's own checkout, which has no A1 continent, no
          # import cache and no owner modules — that is why six suites reported
          # exit=1 with an empty log, and why the digest step could not find them.
          cd .composition
          set +e
          # Process 1 chooses the Adventurer, plays the continent, saves, and keeps
          # the save. Process 2 is a different OS process that resumes it. Nothing
          # here grants a position: the walking, the sockets and the doorways are
          # real input, and the key is a real InputEventKey for `G`.
          timeout --signal=TERM --kill-after=10s 1800s godot --headless --path . \
            --script res://tests/survival_a0_authored_world_route_test.gd -- --keep-route \
            > ../artifacts/route_1.log 2>&1
          first=$?
          cat ../artifacts/route_1.log
          timeout --signal=TERM --kill-after=10s 900s godot --headless --path . \
            --script res://tests/survival_a0_authored_world_route_test.gd -- --verify-route --keep-route \
            > ../artifacts/route_2.log 2>&1
          second=$?
          cat ../artifacts/route_2.log
          echo "::notice::authored route process1=$first process2=$second $(grep -a 'A0_AUTHORED_ROUTE_VERIFY' ../artifacts/route_2.log | tail -1)"
          # Self-contained transcript: the log artifact host is not reachable from
          # every reviewer's sandbox, annotations are.
          for phase_log in 1 2; do
            body=$(tail -c 3000 "../artifacts/route_$phase_log.log" 2>/dev/null | tr '\n' '~')
            echo "::error::route_$phase_log $body"
          done
          echo "::notice::route sites $(grep -a 'A0_AUTHORED_SITE_QUARRY\|A0_AUTHORED_SITE_ORCHARD' ../artifacts/route_1.log | tail -2 | tr '\n' '~')"
          [ "$first" -eq 0 ] && grep -qa 'A0 AUTHORED WORLD ROUTE PASSED' ../artifacts/route_1.log \
            && [ "$second" -eq 0 ] && grep -qa 'A0 AUTHORED WORLD ROUTE PASSED' ../artifacts/route_2.log
      - name: A0 site-mount authority against real A8/A1/A3 data
        run: |
          # Every composed step must play the COMPOSED tree. Without this the
          # suites ran against A0's own checkout, which has no A1 continent, no
          # import cache and no owner modules — that is why six suites reported
          # exit=1 with an empty log, and why the digest step could not find them.
          cd .composition
          set +e
          log="../artifacts/poi_mount.log"
          timeout --signal=TERM --kill-after=10s 600s godot --headless --path . \
            --script res://tests/survival_a0_poi_mount_test.gd -- --require-a8 > "$log" 2>&1
          rc=$?
          cat "$log"
          greet=$(grep -c 'A0_POI_MOUNT_PHYSICAL_NOT_TESTED' "$log")
          echo "::notice::poi mount exit=$rc physical_not_tested_lines=$greet"
          [ "$rc" -eq 0 ] && [ "$greet" -ge 1 ]
      - name: A6 suites in the same composition
        if: ${{ !cancelled() }}
        run: |
          # Every composed step must play the COMPOSED tree. Without this the
          # suites ran against A0's own checkout, which has no A1 continent, no
          # import cache and no owner modules — that is why six suites reported
          # exit=1 with an empty log, and why the digest step could not find them.
          cd .composition
          set +e
          failures=0
          USER_ROOT="$HOME/.local/share/godot/app_userdata/SOUL OF HERO"
          # These are A6 *scene* suites (`extends Node` with a .tscn launcher) and
          # a main-scene flag gate, not SceneTree scripts. Round 12 hosted run
          # 41173496737 invoked them with `--script`, which cannot load a scene
          # test at all ("doesn't inherit from SceneTree or MainLoop"). Run them
          # the way A6 ships them.
          run_scene() {
            local scene="$1"
            local log="../artifacts/a6-$(basename "$scene" .tscn).log"
            rm -rf "$USER_ROOT/tests"
            timeout --signal=TERM --kill-after=5s 400s godot --headless --path . "res://tests/survival/ui/$scene" > "$log" 2>&1
            local rc=$?
            cat "$log"
            echo "::notice::A6 scene $scene exit=$rc"
            if [ "$rc" -ne 0 ] || ! grep -qaE 'PASSED' "$log"; then failures=$((failures+1)); fi
          }
          run_scene a6_ui_layer_test.tscn
          run_scene a6_survival_return_native_test.tscn
          rm -rf "$USER_ROOT/tests"
          SOUL_OF_HERO_SAVE_PATH="user://composed_a6_consumer_${GITHUB_RUN_ID}.json" \
            timeout --signal=TERM --kill-after=5s 400s godot --headless --path . -- --a6-consumer-phase=write \
            > ../artifacts/a6-consumer-write.log 2>&1
          write_rc=$?
          cat ../artifacts/a6-consumer-write.log
          SOUL_OF_HERO_SAVE_PATH="user://composed_a6_consumer_${GITHUB_RUN_ID}.json" \
            timeout --signal=TERM --kill-after=5s 400s godot --headless --path . -- --a6-consumer-phase=read \
            > ../artifacts/a6-consumer-read.log 2>&1
          read_rc=$?
          cat ../artifacts/a6-consumer-read.log
          echo "::notice::A6 consumer write=$write_rc read=$read_rc"
          if [ "$write_rc" -ne 0 ] || [ "$read_rc" -ne 0 ]; then failures=$((failures+1)); fi
          # A6 identity: A6's own gate (two genders x full/verify) is the oracle.
          rm -rf "$USER_ROOT/tests"
          timeout --signal=TERM --kill-after=10s 900s bash tools/run_a6_native_gates.sh godot auto \
            > ../artifacts/a6-identity.log 2>&1
          identity_rc=$?
          cat ../artifacts/a6-identity.log
          if [ "$identity_rc" -ne 0 ]; then
            # A6-owned blocker at 81c1f57e: avatar_choice_screen.gd declares
            # `_manifest_has_staged_art` twice (lines 122 and 139), so the script
            # cannot load and no identity can be chosen. Fail closed: the job stays
            # red unless the failure is exactly that named blocker.
            if grep -qa 'has the same name as a previously declared function' ../artifacts/a6-identity.log \
                && grep -qa 'avatar_choice_screen.gd' ../artifacts/a6-identity.log; then
              echo "::warning::A6_AVATAR_CHOICE_DUPLICATE_FUNCTION at 81c1f57e — owner fix required, A0 does not edit A6 files"
            else
              failures=$((failures+1))
            fi
          fi
          [ "$failures" -eq 0 ]
      - name: R13 authored continent native frames (720p / 1440p / 2160p)
        if: ${{ !cancelled() }}
        run: |
          set +e
          # A composition can be playable and still be unpainted. These are the
          # engine's own frames at three native resolutions, captured from the same
          # production scene the route gate plays; a frame that is blank, flat or the
          # wrong size fails inside the test, not in a reviewer's eyes.
          cd .composition
          failures=0
          for res in 1280x720 2560x1440 3840x2160; do
            log="../artifacts/authored_capture_$res.log"
            A0_VISUAL_RESOLUTION=$res timeout --signal=TERM --kill-after=10s 900s \
              xvfb-run -a -s "-screen 0 3840x2160x24" \
              env LIBGL_ALWAYS_SOFTWARE=1 godot --path . --rendering-method gl_compatibility \
              --rendering-driver opengl3 --audio-driver Dummy --resolution "$res" --windowed \
              --script res://tests/survival_a0_authored_world_capture_test.gd > "$log" 2>&1
            rc=$?
            echo "::notice::authored capture $res exit=$rc $(grep -aE 'PASSED|FAILED' "$log" | tail -1)"
            grep -a 'A0_AUTHORED_FRAME' "$log" || true
            if [ "$rc" -ne 0 ] || ! grep -qa 'A0 AUTHORED CAPTURE PASSED' "$log"; then
              failures=$((failures+1))
              echo "::error::authored capture $res body=$(tail -c 1200 "$log" | tr '\n' '~')"
            fi
          done
          # The test saves frames under res://artifacts, which inside the composition
          # is .composition/artifacts. The artifact upload and the review thumbnails
          # both read the workspace's artifacts/ directory, so the frames are moved
          # to where a reviewer actually looks.
          mkdir -p ../artifacts
          cp -v artifacts/visual_authored_*.png ../artifacts/ 2>/dev/null || true
          ls -la ../artifacts/visual_authored_*.png 2>/dev/null || echo "::error::no authored frames reached the artifact directory"
          [ "$failures" -eq 0 ]
      - name: R13 authored frame review thumbnails
        if: always()
        run: |
          python3 -m pip install --user Pillow==11.3.0 > /dev/null 2>&1 \
            || python3 -m pip install --user --break-system-packages Pillow==11.3.0 > /dev/null 2>&1 \
            || true
          # Annotations are capped per step, so this one carries the whole visual
          # evidence: 1:1 crops of the 720p HUD and camera. The thumbnails and the
          # untouched PNGs live in the artifact, which is the canonical copy.
          python3 tools/ci/authored_visual_annotation_chunks.py 0 crops || true
          ls -la artifacts/visual_authored_*.png 2>/dev/null || true
      - name: R13 first-failure transcript (engine version, artifacts, one log)
        if: always()
        run: |
          # A red job whose digest has no hits means the log itself is empty or the
          # process never spoke. Print the evidence rather than guess at it.
          echo "::error::godot=$(godot --version 2>&1 | tr '\n' ' ')"
          echo "::error::artifacts=$(ls -la ./artifacts 2>&1 | tail -n +2 | tr '\n' '|')"
          for probe in ./artifacts/survival_foundation_test.log ./artifacts/route_1.log; do
            if [ -f "$probe" ]; then
              body=$(tail -c 900 "$probe" | tr '\n' '~')
              echo "::error::$(basename "$probe") bytes=$(wc -c < "$probe") body=$body"
            else
              echo "::error::$(basename "$probe") MISSING"
            fi
          done
      - name: R13 failure digest (annotations survive a blocked artifact host)
        if: always()
        run: |
          # The artifact store and the job-log endpoint are both outside what some
          # sandboxes can reach; annotations are not. One line per log, carrying the
          # first script/parse errors, so a red job is still diagnosable.
          shopt -s nullglob
          # Steps that ran inside .composition wrote to its sibling `../artifacts`,
          # which IS this workspace's artifacts/ directory. From the workspace root
          # the same files are ./artifacts — `../artifacts` here matched nothing at
          # all, which is how a red job stayed undiagnosable.
          for f in ./artifacts/*.log ../artifacts/*.log; do
            name=$(basename "$f")
            hits=$(grep -aiE 'SCRIPT ERROR|Parse Error|Cannot open|Cannot get class|cyclic|Invalid' "$f" \
              | head -6 | tr '\n' '\u00a6')
            tail_line=$(grep -aE 'PASSED|FAILED|exit=|A0_' "$f" | tail -2 | tr '\n' '\u00a6')
            echo "::error::$name ¦ $hits ¦ $tail_line"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a0-round12-composition-native-logs
          path: |
            artifacts/*.log
            artifacts/visual_authored_*.png
            .composition/composition.json
            .composition/CONFLICTS.md
          if-no-files-found: warn
