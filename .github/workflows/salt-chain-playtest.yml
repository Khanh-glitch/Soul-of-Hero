name: Salt-chain real-player playtest

on:
  workflow_dispatch:
  push:
    branches: [arena/4795760e-soul-of-hero, arena/97526c8a-soul-of-hero]
    paths:
      - 'web/src/**'
      - 'web/tests/**'
      - 'web/e2e/**'
      - 'web/package.json'
      - 'web/package-lock.json'
      - 'web/vite.config.ts'
      - '.github/workflows/salt-chain-playtest.yml'

permissions:
  contents: read

env:
  CI: true

jobs:
  salt-journey:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        working-directory: web
        run: npm ci
      - name: Verify unit tests, production build, and types
        working-directory: web
        run: |
          npm test
          npm run build
          npx tsc --noEmit
      - name: Install real Chromium browser
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Start production preview
        working-directory: web
        run: |
          npm run preview -- --host 0.0.0.0 --port 4173 > /tmp/soh-preview.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/soh-preview.log
          exit 1
      - name: Play the no-cheat Salt Shale journey
        working-directory: web
        env:
          GAME_URL: http://127.0.0.1:4173
        run: node e2e/salt-chain.mjs
      - name: Upload Salt Shale evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: salt-chain-browser-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: web/evidence/salt-chain/
          if-no-files-found: warn
          retention-days: 30
  map-poi:
    strategy:
      fail-fast: false
      matrix:
        layout: [shipping, dev_delta]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies and build
        working-directory: web
        run: npm ci && npm run build
      - name: Install real Chromium browser
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Start production preview
        working-directory: web
        run: |
          npm run preview -- --host 0.0.0.0 --port 4173 > /tmp/soh-preview.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/soh-preview.log
          exit 1
      - name: Play layout with a bounded total time
        working-directory: web
        env:
          GAME_URL: http://127.0.0.1:4173
          BUILD_SHA: ${{ github.sha }}
          MAP_LAYOUT: ${{ matrix.layout }}
        run: timeout --signal=TERM --kill-after=15s 8m node e2e/map-poi.mjs
      - name: Upload current-build diagnostics and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: map-poi-${{ matrix.layout }}-${{ github.sha }}-${{ github.run_attempt }}
          path: web/evidence/map-poi/
          if-no-files-found: warn
          retention-days: 30
